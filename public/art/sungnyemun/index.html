<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<title>숭례문의 하루</title>
<meta name="description" content="펜으로 그려진 숭례문 앞에서 낮과 밤, 계절이 끝없이 흘러가요.">
<style>
html,body{margin:0;height:100%;background:#14182a;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  background:rgba(20,22,34,.55);color:#f3ece0;font:500 13px/1.4 system-ui,"Noto Sans KR",sans-serif;letter-spacing:.02em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(6px)}

</head><body>
<canvas id="c"></canvas>
<div id="tag"></div>
<div id="tip">화면을 누르면 시간과 계절이 보여요 · 화면도 안 꺼져요</div>
<script>
'use strict';
// ================= 기본 =================
const WW = 1080, GY = 1300, XL0 = -1700, XR0 = 2780;
const DAY = 300;                 // 하루 = 5분
const INTRO = 17.5;              // 그리는 시간
let seed = 11;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a, b) => a + rnd() * (b - a);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = p => p < .5 ? 2 * p * p : 1 - 2 * (1 - p) * (1 - p);
const sm = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const INK = '#2b2830', INK2 = '#5b5660', INK3 = '#8e8890';

// ================= 선 도구 =================
function smooth(c, seg = 10) {
  const o = [];
  for (let i = 0; i < c.length - 1; i++) {
    const p0 = c[Math.max(0, i - 1)], p1 = c[i], p2 = c[i + 1], p3 = c[Math.min(c.length - 1, i + 2)];
    for (let k = 0; k < seg; k++) {
      const t = k / seg, t2 = t * t, t3 = t2 * t;
      o.push([.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
              .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
    }
  }
  o.push(c[c.length - 1]); return o;
}
function resample(pts, step) {
  const o = [pts[0]]; let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    let [x0, y0] = pts[i - 1]; const [x1, y1] = pts[i];
    let d = Math.hypot(x1 - x0, y1 - y0);
    while (d > 0 && acc + d >= step) {
      const r = (step - acc) / d; x0 += (x1 - x0) * r; y0 += (y1 - y0) * r;
      o.push([x0, y0]); d = Math.hypot(x1 - x0, y1 - y0); acc = 0;
    }
    acc += d;
  }
  const L = pts[pts.length - 1], P = o[o.length - 1];
  if (Math.hypot(L[0] - P[0], L[1] - P[1]) > .3) o.push(L);
  return o;
}
function wobble(pts, amp) {
  if (!amp) return pts;
  const p1 = R(0, 6.28), p2 = R(0, 6.28), f1 = R(.008, .014), f2 = R(.03, .045);
  let s = 0;
  return pts.map((p, i) => {
    if (i) s += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]);
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const nx = -(b[1] - a[1]), ny = b[0] - a[0], l = Math.hypot(nx, ny) || 1;
    const o = amp * (Math.sin(s * f1 + p1) * .65 + Math.sin(s * f2 + p2) * .35);
    return [p[0] + nx / l * o, p[1] + ny / l * o];
  });
}
const LAYERS = { bg: [], fg: [] };
function line(pts, o) {
  const s = Object.assign({ t0: 0, dur: 1, w: 2.2, col: INK, wob: 1, L: 'fg', head: false, seed: R(0, 99) }, o);
  s.pts = wobble(resample(pts, o.step || 3), s.wob);
  if (s.pts.length < 2) return;
  s.k = 0; LAYERS[s.L].push(s); return s;
}
const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]];
const arc = (cx, cy, r, a0, a1, n = 40) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });
// 여러 획을 시간 구간에 고르게 나눠 그리기
function many(list, t0, t1, o) {
  list.forEach((p, i) => line(p, Object.assign({ t0: t0 + (t1 - t0) * i / Math.max(1, list.length) * .9, dur: Math.max(.08, (t1 - t0) / list.length * 2.2) }, o)));
}

// ================= 숭례문 모양 =================
const xl = y => 150 + (GY - y) / 238 * 45, xr = y => 930 - (GY - y) / 238 * 45;
const eaveLo = x => 893 - 26 * Math.pow(Math.abs(x - 540) / 310, 3);
const eaveHi = x => 662 - 44 * Math.pow(Math.abs(x - 540) / 345, 3);
const ARCH = { cx: 540, cy: 1182, r: 62 };
// 추녀마루(대각 마루) — 위 지붕: 용마루 끝 → 처마 끝, 살짝 오목
const hipHi = (side, u) => { const x0 = side < 0 ? 405 : 675, x1 = side < 0 ? 198 : 882, y0 = 522, y1 = eaveHi(x1) - 4; return [lerp(x0, x1, u), lerp(y0, y1, u) + Math.sin(Math.PI * u) * 16]; };
const hipLo = (side, u) => { const x0 = side < 0 ? 352 : 728, x1 = side < 0 ? 232 : 848, y0 = 842, y1 = eaveLo(x1) - 3; return [lerp(x0, x1, u), lerp(y0, y1, u) + Math.sin(Math.PI * u) * 7]; };
function hipY(hipFn, side, x) {           // 대각 마루 위 x에서의 y
  let best = 0, bd = 1e9;
  for (let i = 0; i <= 40; i++) { const p = hipFn(side, i / 40), d = Math.abs(p[0] - x); if (d < bd) { bd = d; best = p[1]; } }
  return best;
}

// ---------- 뒤 배경: 남산·타워·빌딩 ----------
const NAMSAN = []; for (let x = 640; x <= 1500; x += 20) NAMSAN.push([x, 905 - 120 * Math.exp(-Math.pow((x - 960) / 210, 2)) - 20 * Math.exp(-Math.pow((x - 1230) / 120, 2))]);
const TOWER = { x: 935, base: 790 };
const BLD = [];
const PINE_HIDE = (x, y) => [70, 1010, -260, 1340].some(px => Math.abs(x - px) < 110 && y > 980);
(function () {
  let x = XL0;
  while (x < XR0) {
    const w = R(70, 170), near = Math.abs(x + w / 2 - 540) < 520;
    const h = near ? R(80, 260) : R(160, 520);
    BLD.push({ x, w, top: 1190 - h, win: [] });
    x += w + R(-10, 26);
  }
  BLD.forEach(b => {                    // 창문 (밤에 켜짐)
    for (let y = b.top + 18; y < 1140; y += 22) for (let xx = b.x + 10; xx < b.x + b.w - 14; xx += 18) if (rnd() < .55 && !(xx > 140 && xx < 940 && y > 470) && !PINE_HIDE(xx, y)) b.win.push([xx, y, R(0, 1), R(.2, 1)]);
  });
})();
// 배경 획
NAMSAN.length && line(NAMSAN, { L: 'bg', t0: .3, dur: 1.4, w: 1.8, col: INK2 });
line([[TOWER.x - 5, TOWER.base], [TOWER.x - 4, 650]], { L: 'bg', t0: 1.0, dur: .4, w: 1.8, col: INK2 });
line([[TOWER.x + 5, TOWER.base], [TOWER.x + 4, 650]], { L: 'bg', t0: 1.0, dur: .4, w: 1.8, col: INK2 });
line(rect(TOWER.x - 16, 632, TOWER.x + 16, 652), { L: 'bg', t0: 1.3, dur: .3, w: 1.6, col: INK2 });
line([[TOWER.x - 22, 632], [TOWER.x + 22, 632]], { L: 'bg', t0: 1.4, dur: .2, w: 1.6, col: INK2 });
line([[TOWER.x, 632], [TOWER.x, 560]], { L: 'bg', t0: 1.5, dur: .3, w: 1.4, col: INK2 });
BLD.forEach((b, i) => {
  const t0 = .4 + Math.abs(b.x + b.w / 2 - 540) / 2200 * 1.8;
  line([[b.x, 1190], [b.x, b.top], [b.x + b.w, b.top], [b.x + b.w, 1190]], { L: 'bg', t0, dur: .5, w: 1.3, col: INK3, wob: .5 });
  for (let y = b.top + 28; y < 1180; y += 44) if (rnd() < .6) line([[b.x + 6, y], [b.x + b.w - 6, y]], { L: 'bg', t0: t0 + .4, dur: .2, w: .9, col: INK3, wob: .3 });
});

// ---------- 석축 ----------
line([[150, GY], [195, 1062], [885, 1062], [930, GY]], { t0: 1.6, dur: 1.2, w: 2.8, wob: .8 });
line([[184, 1062], [184, 1052], [896, 1052], [896, 1062]], { t0: 2.3, dur: .6, w: 1.8, wob: .4 });
(function stones() {
  const segs = [];
  let y = GY, k = 0;
  while (y > 1068) {
    const h = Math.max(30, 48 - k * 3), y2 = Math.max(1062, y - h);
    // 가로 이음
    const a0 = xl(y2), a1 = xr(y2);
    if (y2 > 1062) {
      if (y2 > ARCH.cy - ARCH.r - 26) { segs.push([[a0, y2], [ARCH.cx - ARCH.r - 26, y2]]); segs.push([[ARCH.cx + ARCH.r + 26, y2], [a1, y2]]); }
      else segs.push([[a0, y2], [a1, y2]]);
    }
    // 세로 이음
    let x = xl(y) + R(10, 60);
    while (x < xr(y) - 30) {
      const inArch = Math.abs(x - ARCH.cx) < ARCH.r + 30 && y2 > ARCH.cy - ARCH.r - 40;
      if (!inArch) segs.push([[x, y], [x + R(-2, 2), y2]]);
      x += R(66, 128);
    }
    y = y2; k++;
  }
  many(segs, 2.0, 4.6, { w: 1.3, col: INK2, wob: .7 });
})();
// 홍예문
line([[ARCH.cx - ARCH.r, GY], [ARCH.cx - ARCH.r, ARCH.cy], ...arc(ARCH.cx, ARCH.cy, ARCH.r, Math.PI, Math.PI * 2, 30).slice(1), [ARCH.cx + ARCH.r, GY]], { t0: 3.4, dur: 1.2, w: 2.8, wob: .5, head: true });
line(arc(ARCH.cx, ARCH.cy, ARCH.r + 26, Math.PI, Math.PI * 2, 34), { t0: 3.9, dur: .9, w: 2, wob: .5 });
for (let i = 0; i <= 12; i++) { const a = Math.PI + Math.PI * i / 12; line([[ARCH.cx + Math.cos(a) * ARCH.r, ARCH.cy + Math.sin(a) * ARCH.r], [ARCH.cx + Math.cos(a) * (ARCH.r + 26), ARCH.cy + Math.sin(a) * (ARCH.r + 26)]], { t0: 4.3 + i * .04, dur: .12, w: 1.3, col: INK2, wob: .2 }); }
line([[ARCH.cx - ARCH.r - 26, ARCH.cy], [ARCH.cx - ARCH.r - 26, GY]], { t0: 4.2, dur: .4, w: 1.3, col: INK2 });
line([[ARCH.cx + ARCH.r + 26, ARCH.cy], [ARCH.cx + ARCH.r + 26, GY]], { t0: 4.2, dur: .4, w: 1.3, col: INK2 });
// 여장 (석축 위 낮은 담)
[[195, 326], [754, 885]].forEach(([a, b], j) => {
  line([[a, 1052], [a, 1026], [b, 1026], [b, 1052]], { t0: 4.6 + j * .2, dur: .5, w: 1.8, wob: .4 });
  for (let x = a + 34; x < b - 20; x += 44) line(rect(x, 1026, x + 8, 1038), { t0: 4.9 + j * .2, dur: .15, w: 1.1, col: INK2, wob: 0 });
  line(rect((a + b) / 2 - 5, 1036, (a + b) / 2 + 5, 1044), { t0: 5.0, dur: .12, w: 1, col: INK2, wob: 0 });
});

// ---------- 성벽 ----------
function wall(side) {
  const x0 = side < 0 ? XL0 : xr(1185), x1 = side < 0 ? xl(1185) : XR0;
  const ord = (a, b) => side < 0 ? [[b, 0], [a, 0]] : [[a, 0], [b, 0]];
  line(ord(x0, x1).map(p => [p[0], 1185]), { t0: 4.3, dur: 1.2, w: 2.2, wob: .8 });
  line(ord(x0, x1).map(p => [p[0], 1158]), { t0: 4.6, dur: 1.2, w: 1.8, wob: .8 });
  const segs = [];
  for (let y = GY - 38; y > 1190; y -= 38) segs.push([[x0, y], [x1, y]]);
  for (let y = GY; y > 1190; y -= 38) for (let x = x0 + R(0, 80); x < x1; x += R(70, 120)) segs.push([[x, y], [x, Math.max(1185, y - 38)]]);
  for (let x = x0 + 20; x < x1 - 20; x += 48) segs.push([[x, 1158], [x, 1172]]);
  if (side < 0) segs.sort((a, b) => b[0][0] - a[0][0]); else segs.sort((a, b) => a[0][0] - b[0][0]);
  many(segs, 4.8, 6.4, { w: 1.1, col: INK2, wob: .5 });
}
wall(-1); wall(1);

// ---------- 아래층 ----------
const COL_LO = [328, 408, 484, 596, 672, 752];
line([[310, 1052], [770, 1052]], { t0: 5.4, dur: .5, w: 2.2 });
COL_LO.forEach((x, i) => { line([[x - 6, 1052], [x - 6, 942]], { t0: 5.6 + i * .08, dur: .35, w: 2, wob: .4 }); line([[x + 6, 1052], [x + 6, 942]], { t0: 5.65 + i * .08, dur: .35, w: 2, wob: .4 }); });
line(rect(314, 932, 766, 944), { t0: 6.2, dur: .5, w: 1.9 });
for (let i = 0; i < 5; i++) {               // 칸마다 판문·살
  const a = COL_LO[i] + 6, b = COL_LO[i + 1] - 6;
  line([[a, 962], [b, 962]], { t0: 6.4 + i * .05, dur: .2, w: 1.3, col: INK2, wob: .2 });
  if (i !== 2) for (let x = a + 10; x < b - 4; x += 12) line([[x, 966], [x, 1048]], { t0: 6.5 + i * .05, dur: .15, w: .9, col: INK3, wob: 0 });
  else { line([[540, 962], [540, 1052]], { t0: 6.6, dur: .2, w: 1.3, col: INK2, wob: 0 }); for (let j = 0; j < 2; j++) line(rect(a + 8 + j * 52, 976, a + 44 + j * 52, 1040), { t0: 6.7, dur: .2, w: 1, col: INK3, wob: 0 }); }
}
function brackets(x0, x1, yb, t0, t1) {     // 다포 공포
  const segs = [];
  for (let x = x0; x <= x1; x += 22) {
    segs.push(rect(x - 6, yb - 10, x + 6, yb - 2));
    segs.push(rect(x - 11, yb - 19, x + 11, yb - 13));
    segs.push(rect(x - 5, yb - 28, x + 5, yb - 22));
  }
  segs.push([[x0 - 12, yb - 30], [x1 + 12, yb - 30]]);
  many(segs, t0, t1, { w: 1, col: INK2, wob: 0, step: 2 });
}
brackets(322, 758, 932, 6.8, 7.8);
// 아래 지붕
(function () {
  const eave = []; for (let x = 228; x <= 852; x += 6) eave.push([x, eaveLo(x)]);
  line(eave, { t0: 7.8, dur: .9, w: 2.8, head: true });
  line(eave.map(p => [p[0], p[1] + 9]), { t0: 8.1, dur: .8, w: 1.4, col: INK2 });
  line([[352, 842], [728, 842]], { t0: 8.0, dur: .5, w: 2 });
  [-1, 1].forEach(sd => line(Array.from({ length: 21 }, (_, i) => hipLo(sd, i / 20)), { t0: 8.3, dur: .5, w: 2.4 }));
  const tiles = [];
  for (let x = 236; x <= 844; x += 11) {
    let top = 842;
    if (x < 352) top = hipY(hipLo, -1, x); else if (x > 728) top = hipY(hipLo, 1, x);
    const e = eaveLo(x) - 3; if (e - top > 6) tiles.push([[x, e], [x, top + 3]]);
  }
  many(tiles, 8.5, 9.3, { w: 1, col: INK2, wob: .2 });
  const caps = []; for (let x = 236; x <= 844; x += 11) caps.push(arc(x, eaveLo(x) - 1, 4, Math.PI, Math.PI * 2, 6));
  many(caps, 8.6, 9.3, { w: 1, col: INK, wob: 0, step: 1.5 });
  const raf = []; for (let x = 244; x <= 836; x += 13) raf.push(arc(x, eaveLo(x) + 13, 2.6, 0, Math.PI * 2, 8));
  many(raf, 8.7, 9.4, { w: .9, col: INK2, wob: 0, step: 1.5 });
})();
// ---------- 위층 ----------
line(rect(362, 812, 718, 842), { t0: 9.1, dur: .5, w: 1.8 });
(function () { const s = []; for (let x = 370; x < 714; x += 13) s.push([[x, 816], [x, 838]]); many(s, 9.3, 9.8, { w: .9, col: INK2, wob: 0 }); })();
const COL_HI = [382, 445, 508, 572, 635, 698];
COL_HI.forEach((x, i) => { line([[x - 5, 812], [x - 5, 708]], { t0: 9.5 + i * .06, dur: .3, w: 1.8, wob: .3 }); line([[x + 5, 812], [x + 5, 708]], { t0: 9.55 + i * .06, dur: .3, w: 1.8, wob: .3 }); });
line(rect(366, 698, 714, 708), { t0: 9.9, dur: .4, w: 1.8 });
for (let i = 0; i < 5; i++) {
  const a = COL_HI[i] + 5, b = COL_HI[i + 1] - 5, s = [];
  for (let x = a + 9; x < b - 3; x += 10) s.push([[x, 724], [x, 796]]);
  for (let y = 732; y < 796; y += 12) s.push([[a + 3, y], [b - 3, y]]);
  many(s, 9.9 + i * .05, 10.3 + i * .05, { w: .7, col: INK3, wob: 0 });
}
brackets(372, 708, 698, 10.2, 11.0);
// 현판
line(rect(519, 712, 561, 796), { t0: 10.4, dur: .4, w: 2.2, wob: .2, head: true });
line(rect(524, 717, 556, 791), { t0: 10.6, dur: .3, w: 1, col: INK2, wob: 0 });
// 위 지붕
(function () {
  const eave = []; for (let x = 194; x <= 886; x += 6) eave.push([x, eaveHi(x)]);
  line(eave, { t0: 11.0, dur: 1.0, w: 3, head: true });
  line(eave.map(p => [p[0], p[1] + 10]), { t0: 11.3, dur: .9, w: 1.4, col: INK2 });
  [-1, 1].forEach(sd => line(Array.from({ length: 31 }, (_, i) => hipHi(sd, i / 30)), { t0: 11.5, dur: .7, w: 2.8 }));
  line(rect(400, 504, 680, 522), { t0: 11.7, dur: .6, w: 2.4 });
  line([[404, 513], [676, 513]], { t0: 11.9, dur: .4, w: 1, col: INK2 });
  // 취두
  [-1, 1].forEach(sd => { const x = sd < 0 ? 400 : 680, d = sd; line([[x, 522], [x - d * 4, 488], [x - d * 14, 480], [x - d * 22, 490], [x - d * 16, 500], [x - d * 22, 504]], { t0: 12.1, dur: .4, w: 2.2, wob: .2 }); });
  const tiles = [];
  for (let x = 204; x <= 876; x += 12) {
    let top = 522;
    if (x < 405) top = hipY(hipHi, -1, x); else if (x > 675) top = hipY(hipHi, 1, x);
    const e = eaveHi(x) - 3; if (e - top > 6) tiles.push([[x, e], [x + (x - 540) * .02, top + 3]]);
  }
  many(tiles, 12.0, 13.0, { w: 1, col: INK2, wob: .3 });

  c.fillStyle = lights > .3 ? 'rgba(255,226,160,.9)' : '#b9cbd8'; c.lineWidth = 1.4;
  if (a.type === 'bus') { for (let i = 0; i < 6; i++) { c.beginPath(); c.rect(-L / 2 + 14 + i * 40, -H + 12, 32, 30); c.fill(); c.stroke(); } }
  else { c.beginPath(); c.moveTo(-L / 2 + 52, -H + 5); c.lineTo(-L / 2 + 36, -33); c.lineTo(-4, -33); c.lineTo(-4, -H + 5); c.closePath(); c.fill(); c.stroke(); c.beginPath(); c.moveTo(4, -H + 5); c.lineTo(4, -33); c.lineTo(L / 2 - 26, -33); c.lineTo(L / 2 - 48, -H + 5); c.closePath(); c.fill(); c.stroke(); }
  if (a.type === 'taxi') { c.fillStyle = '#fff4d0'; c.fillRect(-12, -H - 8, 24, 8); c.strokeRect(-12, -H - 8, 24, 8); }
  const wy = -8, wr = a.type === 'bus' ? 15 : 13, rot = a.x / wr * d;
  [-L / 2 + (a.type === 'bus' ? 42 : 30), L / 2 - (a.type === 'bus' ? 42 : 30)].forEach(wx => {
    c.fillStyle = '#2a2a30'; c.beginPath(); c.arc(wx, wy, wr, 0, 7); c.fill();
    c.strokeStyle = '#9a9aa2'; c.lineWidth = 1.4; c.beginPath(); c.arc(wx, wy, wr * .45, 0, 7); c.stroke();
    c.beginPath(); c.moveTo(wx + Math.cos(rot) * wr * .45, wy + Math.sin(rot) * wr * .45); c.lineTo(wx - Math.cos(rot) * wr * .45, wy - Math.sin(rot) * wr * .45); c.stroke();
  });

}
function drawWalker(c, a, rain) {
  const s = a.h / 60, x = a.x, y = a.y, w = Math.sin(a.ph) * 9 * s;
  c.save(); c.translate(x, y); c.scale(a.dir * s, s); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = INK;
  c.lineWidth = 2.4; c.beginPath(); c.moveTo(0, -24); c.lineTo(w, 0); c.moveTo(0, -24); c.lineTo(-w, 0); c.stroke();
  c.fillStyle = a.top; c.lineWidth = 2; c.beginPath(); c.moveTo(-7, -26); c.lineTo(-6, -46); c.quadraticCurveTo(0, -50, 6, -46); c.lineTo(7, -26); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(0, -42); c.lineTo(-w * .7, -28); c.stroke();
  c.fillStyle = '#f0dcc4'; c.beginPath(); c.arc(0, -55, 7, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#2f2a2a'; c.beginPath(); c.arc(0, -57, 7, Math.PI * 1.05, Math.PI * 2.05); c.fill();
  if (a.bag) { c.fillStyle = '#8a6a4a'; c.fillRect(-12, -40, 7, 11); c.strokeRect(-12, -40, 7, 11); }
  if (rain && a.umb < .8) {
    c.beginPath(); c.moveTo(4, -40); c.lineTo(4, -78); c.stroke();
    c.fillStyle = ['#d8534a', '#3f6fb5', '#f2f2f2', '#2c2c34'][Math.floor(a.umb * 4) % 4];
    c.beginPath(); c.moveTo(-24, -74); c.quadraticCurveTo(4, -100, 32, -74); c.closePath(); c.fill(); c.stroke();
  }
  c.restore();
}

// ---------- 날씨 ----------
let weather = 'clear', weatherUntil = 0;
const PART = [];
function pickWeather(now) {
  const r = rnd(), sn = SEASONS[season];
  weather = r < .45 ? 'clear' : sn === '봄' ? 'petal' : sn === '여름' ? 'rain' : sn === '가을' ? 'leaf' : 'snow';
  weatherUntil = now + R(40, 110);
}
function stepParticles(dt, now, n) {
  const [x0, x1, y0, y1] = vis();
  const want = { clear: 0, petal: 70, rain: 220, leaf: 40, snow: 160 }[weather];
  while (PART.length < want && rnd() < .5) PART.push({ x: R(x0 - 100, x1 + 100), y: y0 - R(0, 400), v: weather === 'rain' ? R(900, 1300) : weather === 'snow' ? R(40, 90) : R(60, 120), ph: R(0, 6.28), s: R(.7, 1.4), k: weather });
  for (let i = PART.length - 1; i >= 0; i--) {
    const p = PART[i]; p.y += p.v * dt; p.ph += dt * (p.k === 'leaf' ? 3 : 1.6);
    p.x += (p.k === 'rain' ? -120 : Math.sin(p.ph) * 40 + 18) * dt;
    if (p.y > Math.min(y1, WALK_BOT + 200) || (p.k !== weather && rnd() < dt * .5)) PART.splice(i, 1);
  }
  const dark = 1 - n * .55;
  PART.forEach(p => {
    ctx.save(); ctx.translate(p.x, p.y);
    if (p.k === 'rain') { ctx.strokeStyle = `rgba(200,215,235,${.5 * dark})`; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-5, 34); ctx.stroke(); }
    else if (p.k === 'snow') { ctx.fillStyle = `rgba(255,255,255,${.9 * dark})`; ctx.beginPath(); ctx.arc(0, 0, 3.4 * p.s, 0, 7); ctx.fill(); }
    else { ctx.rotate(p.ph); ctx.fillStyle = p.k === 'petal' ? `rgba(248,196,206,${dark})` : rgb(mix([214, 120, 50], [190, 70, 40], (p.s - .7) / .7), dark); ctx.beginPath(); ctx.ellipse(0, 0, 7 * p.s, 3.6 * p.s, 0, 0, 7); ctx.fill(); }
    ctx.restore();
  });
}

// ================= 돌리기 =================
const START = performance.now() - (+new URLSearchParams(location.search).get('skip') || 0) * 1000;
let lastI = -1, prev = START, dayT = .63, dayN = 0;
const paper = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const p = c.getContext('2d'); p.fillStyle = '#f3ede1'; p.fillRect(0, 0, 256, 256); const id = p.getImageData(0, 0, 256, 256); for (let i = 0; i < id.data.length; i += 4) { const v = (rnd() - .5) * 16; id.data[i] += v; id.data[i + 1] += v; id.data[i + 2] += v; } p.putImageData(id, 0, 0); return c; })();
function frame(nowMs) {
  const now = (nowMs - START) / 1000, dt = Math.min(.1, (nowMs - prev) / 1000); prev = nowMs;
  const I = Math.min(now, INTRO + 1);
  if (I !== lastI) { inkTo(L.bgInk, LAYERS.bg, I); inkTo(L.ink, LAYERS.fg, I); lastI = I; }
  const A = sm(14.2, 17.2, now);                       // 물감·하늘
  if (now > INTRO) {
    dayT += dt / DAY;
    if (dayT >= 1) { dayT -= 1; dayN++; season = (season + 1) % 4; buildWash(); pickWeather(now); }
  }
  if (now > weatherUntil && now > INTRO + 20) pickWeather(now);
  const lt = lightAt(dayT), n = 1 - lt, gl = goldAt(dayT);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // 종이 → 하늘
  ctx.fillStyle = ctx.createPattern(paper, 'repeat'); ctx.fillRect(0, 0, cv.width, cv.height);
  setT(ctx); drawSky(dayT, A, now);
  // 장면 (따로 그려서 어둡게)
  const sc = L.scene.getContext('2d'); sc.setTransform(1, 0, 0, 1, 0, 0); sc.clearRect(0, 0, L.scene.width, L.scene.height);
  sc.globalAlpha = A; sc.drawImage(L.bgWash, 0, 0); sc.globalAlpha = 1;
  sc.drawImage(L.bgInk, 0, 0);
  sc.globalAlpha = A; sc.drawImage(L.wash, 0, 0); sc.globalAlpha = 1;
  sc.drawImage(L.ink, 0, 0);
  // 차·사람
  setT(sc);
  const actA = sm(15, 18, now);
  if (now > 15) {
    const [vx0, vx1] = vis();
    if (!frame.seeded) { frame.seeded = 1; for (let i = 0; i < 3; i++) spawnCar(i % 2 ? 1 : -1, R(vx0, vx1)); for (let i = 0; i < 4; i++) spawnWalker(i % 2 ? 1 : -1, R(vx0, vx1)); }
    const busy = .35 + .65 * clamp(lt + .3);
    if (rnd() < dt * .55 * busy) spawnCar(rnd() < .5 ? 1 : -1);
    if (rnd() < dt * .45 * busy) spawnWalker(rnd() < .5 ? 1 : -1);
    for (let i = ACT.length - 1; i >= 0; i--) {
      const a = ACT[i]; a.x += a.v * a.dir * dt; if (a.k === 'walk') a.ph += dt * a.v / 9;
      if (a.x < vx0 - 500 || a.x > vx1 + 500) ACT.splice(i, 1);
    }
    ACT.sort((a, b) => a.y - b.y);
    sc.globalAlpha = actA;
    ACT.forEach(a => a.k === 'car' ? drawCar(sc, a, n) : drawWalker(sc, a, weather === 'rain'));
    sc.globalAlpha = 1;
  }
  // 어둡게 (하늘은 빼고)
  sc.setTransform(1, 0, 0, 1, 0, 0); sc.globalCompositeOperation = 'source-atop';
  if (A > 0) {
    if (gl > 0) { sc.fillStyle = `rgba(255,150,70,${gl * .16 * A})`; sc.fillRect(0, 0, L.scene.width, L.scene.height); }
    sc.fillStyle = `rgba(16,22,52,${n * .72 * A})`; sc.fillRect(0, 0, L.scene.width, L.scene.height);
    if (n > .2) { const q = (n - .2) / .8 * A; sc.globalAlpha = q * .8; sc.drawImage(L.lit, 0, 0); sc.globalAlpha = q * .7; sc.drawImage(L.ink, 0, 0); sc.globalAlpha = 1; }
  }
  sc.globalCompositeOperation = 'source-over';
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(L.scene, 0, 0);
  // 빛
  setT(ctx);
  if (n > .2 && A > 0) {
    const on = clamp((n - .2) / .5) * A;
    ctx.globalCompositeOperation = 'lighter';
    BLD.forEach(b => b.win.forEach(([x, y, r, k]) => { if (r < .55 + .2 * Math.sin(now * .05 + k * 9)) { ctx.fillStyle = `rgba(255,214,140,${on * .5 * k})`; ctx.fillRect(x, y, 8, 10); } }));
    let g = ctx.createRadialGradient(540, GY + 40, 0, 540, GY + 40, 520); g.addColorStop(0, `rgba(255,190,110,${on * .25})`); g.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 700, 1080, 900);
    LAMPS.forEach(x => { const lx = x + 27, ly = ROAD_BOT - 168; const h = ctx.createRadialGradient(lx, ly, 0, lx, ly, 70); h.addColorStop(0, `rgba(255,224,160,${on * .55})`); h.addColorStop(.25, `rgba(255,214,150,${on * .18})`); h.addColorStop(1, 'rgba(255,224,160,0)'); ctx.fillStyle = h; ctx.fillRect(lx - 70, ly - 70, 140, 140);
      const p = ctx.createRadialGradient(lx, ROAD_BOT + 20, 0, lx, ROAD_BOT + 20, 110); p.addColorStop(0, `rgba(255,214,150,${on * .22})`); p.addColorStop(1, 'rgba(255,214,150,0)'); ctx.fillStyle = p; ctx.fillRect(lx - 110, ROAD_BOT - 90, 220, 220); });
    ctx.fillStyle = `rgba(150,200,255,${on * (.6 + .4 * Math.sin(now * 2))})`; ctx.beginPath(); ctx.arc(TOWER.x, 642, 9, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(255,80,80,${on * (Math.sin(now * 3) > 0 ? .9 : .1)})`; ctx.beginPath(); ctx.arc(TOWER.x, 562, 4, 0, 7); ctx.fill();
    ACT.forEach(a => { if (a.k !== 'car') return; const fx = a.x + a.dir * a.len / 2, fy = a.y - 22;
      const hb = ctx.createLinearGradient(fx, fy, fx + a.dir * 260, fy); hb.addColorStop(0, `rgba(255,240,200,${on * .45 * actA})`); hb.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = hb; ctx.beginPath(); ctx.moveTo(fx, fy - 4); ctx.lineTo(fx + a.dir * 260, fy - 26); ctx.lineTo(fx + a.dir * 260, fy + 22); ctx.lineTo(fx, fy + 4); ctx.fill();
      ctx.fillStyle = `rgba(255,70,60,${on * .8 * actA})`; ctx.beginPath(); ctx.arc(a.x - a.dir * a.len / 2, fy, 5, 0, 7); ctx.fill(); });
    ctx.globalCompositeOperation = 'source-over';
  }
  if (now > INTRO) stepParticles(dt, now, n);
  if (now < INTRO) heads(I);
  requestAnimationFrame(frame);
}

// ================= 누르기 =================
const tag = document.getElementById('tag'), tip = document.getElementById('tip');
let wl = null, tagT = 0, wantWL = false;
function hhmm(d) { const m = Math.floor(d * 1440), h = Math.floor(m / 60), mm = m % 60; return `${h < 12 ? '오전' : '오후'} ${((h + 11) % 12) + 1}:${String(mm).padStart(2, '0')}`; }
addEventListener('pointerdown', async () => {
  const wn = { clear: '맑음', petal: '벚꽃', rain: '비', leaf: '낙엽', snow: '눈' }[weather];
  tag.textContent = `${hhmm(dayT)} · ${SEASONS[season]} · ${wn}`; tag.style.opacity = 1; tip.style.opacity = 0;
  clearTimeout(tagT); tagT = setTimeout(() => tag.style.opacity = 0, 2400);
  wantWL = true;
  try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); } } catch (e) {}
});
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && wl === null && wantWL) try { wl = await navigator.wakeLock.request('screen'); } catch (e) {} });
setTimeout(() => tip.style.opacity = 1, (INTRO + 1) * 1000);
setTimeout(() => tip.style.opacity = 0, (INTRO + 9) * 1000);
addEventListener('resize', resize);
resize(); pickWeather(0); weatherUntil = INTRO + 60;
requestAnimationFrame(frame);
window.__dbg = { set day(v) { dayT = v; }, get day() { return dayT; }, set season(v) { season = v; buildWash(); }, set weather(v) { weather = v; weatherUntil = 1e9; } };
</script></body></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>jjWay · Japan Joy Way</title>
<meta name="description" content="가족과 떠나는 일본 소도시 여행 지도 — 차로 공항, 비행기로 일본, 걸어서 명소">
<meta name="theme-color" content="#bfe3f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#2c2b35;--sea:#bfe3f2;--card:#fffdf7;--pri:#e8594f;--blue:#2f6fd0;--line:rgba(44,43,53,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);color:var(--ink);font-family:Jua,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#vp{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);pointer-events:none;height:100dvh}
#cv{position:fixed;left:0;top:0;touch-action:none}
button,input,select{font-family:inherit;color:inherit}
.chip{position:fixed;background:rgba(255,253,247,.94);border:2px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:15px;box-shadow:0 3px 0 rgba(44,43,53,.25);z-index:20}
#loc{left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));max-width:calc(100vw - var(--pipw, 150px) - 34px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#loc:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(44,43,53,.25)}
#loc::after{content:' ↻';color:#8a8794;font-size:13px}
#loc .cty{font-size:11px;color:#8a8794;margin-right:6px;vertical-align:1px}
#loc b{font-weight:400;font-size:18px}
#btns{position:fixed;left:calc(10px + env(safe-area-inset-left));top:calc(50px + env(safe-area-inset-top));display:flex;gap:8px;z-index:20}
.ib{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-size:20px;box-shadow:0 3px 0 rgba(44,43,53,.25);cursor:pointer;display:grid;place-items:center;padding:0}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(44,43,53,.25)}
#pipWrap{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));z-index:20;pointer-events:none;text-align:center}
#pip{pointer-events:auto;cursor:pointer;border-radius:50%;border:3px solid var(--ink);box-shadow:0 4px 0 rgba(44,43,53,.25),0 0 0 5px rgba(255,255,255,.7);background:var(--sea);display:block}
.top{touch-action:none;cursor:grab;margin:-12px -14px 0;padding:8px 14px 2px}
.grab{width:42px;height:5px;border-radius:3px;background:#d3cec3;margin:0 auto 8px}
.hd{display:flex;align-items:flex-start;gap:8px}.hd h2{flex:1;min-width:0}
.side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.info{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #8a8794;background:#fff;color:#8a8794;font:700 13px/1 Georgia,serif;font-style:italic;padding:0;cursor:pointer}
.info.on{background:#f0d98c;border-color:#c9a632;color:#6b5410}
.cbtn{flex:none;height:32px;padding:0 12px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-family:Jua,sans-serif;font-size:14px;box-shadow:0 2px 0 rgba(44,43,53,.25);cursor:pointer;white-space:nowrap}
.cbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(44,43,53,.25)}
.hint{background:#fff7e0;border:1px solid #f0d98c;border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.45;margin:4px 0 8px}
#pipTxt{margin-top:6px;font-size:13px;background:rgba(255,253,247,.94);border:2px solid var(--ink);border-radius:10px;padding:3px 8px;max-width:190px;line-height:1.3}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.t{background:var(--ink);color:#fff;border-radius:12px;padding:8px 14px;font-size:15px;line-height:1.35;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(96vw,460px);max-height:46vh;overflow:auto;background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(44,43,53,.25);z-index:30;padding:12px 14px 14px;touch-action:pan-y;font-family:system-ui,sans-serif}
#sheet h2{font-family:Jua,sans-serif;font-weight:400;margin:0 0 2px;font-size:22px}
#sheet .sub{color:#6b6876;font-size:13px;margin-bottom:8px}
#sheet .x{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:none;background:#eee9df;font-size:16px;cursor:pointer}
.rt{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.rt b{font-family:Jua,sans-serif;font-weight:400;font-size:16px;min-width:88px}
.al{display:inline-block;background:#eef3ff;border:1px solid #c9d6f5;border-radius:999px;padding:1px 7px;margin:1px 2px;font-size:12px;white-space:nowrap}
.al.ex{background:#fff3e6;border-color:#f3cfa5}
.note{font-size:12px;color:#8a8794;margin-top:8px;line-height:1.45}
.warn{background:#fff0ee;border:1px solid #f2c2bb;border-radius:10px;padding:8px 10px;font-size:14px;margin:6px 0}
.soon{background:#f3f7ee;border:1px dashed #b9cfa3;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.ov{position:fixed;inset:0;z-index:60;background:rgba(44,43,53,.45);display:grid;place-items:center;padding:12px;touch-action:pan-y}
.box{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(44,43,53,.3);width:min(96vw,440px);max-height:92vh;overflow:auto;padding:18px 16px;font-family:system-ui,sans-serif}
.box h1{font-family:Jua,sans-serif;font-weight:400;margin:0;font-size:30px;text-align:center}
.box h1 small{display:block;font-size:15px;color:#6b6876;margin-top:2px}
.box h3{font-family:Jua,sans-serif;font-weight:400;font-size:18px;margin:14px 0 6px}
.step{display:flex;align-items:center;justify-content:center;gap:14px;font-family:Jua,sans-serif;font-size:26px;margin:6px 0}
.step button{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:24px;cursor:pointer}
.mem{display:grid;grid-template-columns:34px 1fr 82px 74px;gap:6px;align-items:center;margin:6px 0}
.mem input,.mem select{height:38px;border:2px solid #d8d3c8;border-radius:10px;padding:0 8px;font-size:15px;background:#fff;min-width:0}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0}
.go{display:block;width:100%;margin-top:16px;height:52px;border-radius:16px;border:3px solid var(--ink);background:var(--pri);color:#fff;font-family:Jua,sans-serif;font-size:22px;box-shadow:0 4px 0 rgba(44,43,53,.35);cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(44,43,53,.35)}
.small{font-size:12px;color:#8a8794;line-height:1.5;margin-top:8px}
.int{display:flex;align-items:center;gap:8px;padding:7px 4px;border-top:1px dashed var(--line);font-size:16px}
.int .nm{flex:1}
.int button{width:34px;height:30px;border-radius:8px;border:2px solid #d8d3c8;background:#fff;cursor:pointer}
.sw{width:50px;height:28px;border-radius:999px;border:2px solid var(--ink);background:#ddd;position:relative;cursor:pointer;padding:0}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.sw.on{background:#7cc576}.sw.on::after{left:24px}
.row2{display:flex;gap:8px;margin-top:12px}
.row2 button{flex:1;height:42px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-family:Jua,sans-serif;font-size:17px;cursor:pointer}
.intro{font-size:14px;line-height:1.55;margin:2px 0 8px}
.sp{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.sp .ic{font-size:20px;line-height:1.2}.sp b{font-family:Jua,sans-serif;font-weight:400;font-size:16px}
.sp .d{font-size:12px;color:#6b6876;line-height:1.4;margin-top:1px}.sp i{font-style:normal;font-size:12px;color:#8a8794;white-space:nowrap;margin-left:auto}
.sp.seen b{color:#8a6a1d}.al.ok{background:#fff3c4;border-color:#e2c25a}
.stamp{display:inline-block;background:#fff3c4;border:2px dashed #d4a017;color:#8a6a1d;border-radius:10px;padding:4px 10px;font-family:Jua,sans-serif;font-size:16px;margin:2px 0 8px;transform:rotate(-2deg)}
#zoom{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:20;transition:bottom .15s}
#zoom button{width:46px;height:46px;font-size:26px!important;border-radius:12px;border:2px solid var(--ink);background:var(--card);font-size:22px;line-height:1;box-shadow:0 3px 0 rgba(44,43,53,.25);cursor:pointer;padding:0}
#zoom button.on{background:#ffcf5a;box-shadow:0 0 0 3px rgba(255,207,90,.5),0 3px 0 rgba(44,43,53,.25)}
#zoom button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(44,43,53,.25)}
#sheet a{color:var(--blue)}
#pts{left:calc(10px + env(safe-area-inset-left));top:calc(102px + env(safe-area-inset-top));padding:3px 11px;font-size:14px}
#pts b{font-weight:400;font-size:16px}
#pts.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.cats{display:flex;gap:6px;margin:4px 0 8px}
.cats button{flex:1;border:2px solid #d8d3c8;background:#fff;border-radius:12px;padding:5px 0;font-size:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.cats button span{font:12px Jua,sans-serif;color:#6b6876}.cats button.on{border-color:var(--ink);background:#fff3c4;transform:translateY(-2px);box-shadow:0 2px 0 rgba(44,43,53,.25)}
.fin{display:block;width:100%;border:2px solid #d8d3c8;border-radius:10px;padding:8px 10px;font-size:15px;margin:5px 0;background:#fff;font-family:system-ui,sans-serif;resize:none}
.fin:focus{outline:none;border-color:var(--blue)}.fin.bad{border-color:var(--pri)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.stars button{border:none;background:none;font-size:24px;color:#d8d3c8;padding:0 1px;cursor:pointer}.stars button.on{color:#f2b134}
.seg{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}.seg button{border:none;background:#fff;padding:5px 10px;font:14px Jua,sans-serif;cursor:pointer}.seg button.on{background:var(--ink);color:#fff}
.lock{font-size:13px;background:#eef3ff;border:1px solid #c9d6f5;border-radius:999px;padding:3px 10px}.lock.off{opacity:.45}
.del{display:block;margin:10px auto 0;border:none;background:none;color:#a33;font-size:13px;text-decoration:underline;cursor:pointer}
.nav{display:block;text-align:center;margin:8px 0;padding:10px;border:2px solid var(--ink);border-radius:12px;background:#eef3ff;font-family:Jua,sans-serif;font-size:16px;text-decoration:none;color:var(--ink)!important}
#attr{position:fixed;left:calc(6px + env(safe-area-inset-left));bottom:calc(4px + env(safe-area-inset-bottom));z-index:15;font:10px system-ui,sans-serif;color:#555;background:rgba(255,255,255,.75);padding:1px 5px;border-radius:4px}
#attr a{color:inherit}
</style>
</head>
<body>
<div id="vp"></div>
<canvas id="cv" aria-label="한국·일본 여행 지도"></canvas>
<div id="loc" class="chip" role="button" title="새로 읽기">📍 불러오는 중…</div>
<div id="pts" class="chip" title="여행 포인트">🏅 <b id="ptsN">0</b></div>
<div id="btns">
  <button class="ib" id="bParty" title="가족 설정">👨‍👩‍👧‍👦</button>
  <button class="ib" id="bSet" title="관심 분야">⚙️</button>
  <button class="ib" id="bHome" title="wowhit 홈">⌂</button>
</div>
<div id="pipWrap"><canvas id="pip"></canvas><div id="pipTxt" hidden></div></div>
<div id="zoom"><button id="bFlag" aria-label="여기에 깃발 꽂기" hidden>🚩</button><button id="bTarget" aria-label="내 위치 · 기본 비율">⌖</button></div>
<div id="sheet" hidden></div>

<div id="toast"></div>
<div id="attr" hidden>出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院 地理院タイル(淡色地図)</a></div>

<div class="ov" id="setup" hidden>
  <div class="box">
    <h1>jjWay<small>Japan Joy Way · 가족과 떠나는 일본 소도시 여행</small></h1>
    <h3>몇 명이 떠나요?</h3>
    <div class="step"><button id="nMinus">−</button><span id="nVal">4</span>명<button id="nPlus">＋</button></div>
    <h3>함께 가는 사람</h3>
    <div id="mems"></div>
    <div class="small">색 동그라미를 누르면 캐릭터 색이 바뀌어요. 이름·구성은 <b>이 폰(브라우저)에만</b> 저장돼요.<br>여권번호·주민번호 같은 정보는 받지 않아요.</div>
    <button class="go" id="goBtn">✈️ 출발!</button>
  </div>
</div>

<div class="ov" id="settings" hidden>
  <div class="box">
    <h1 style="font-size:24px">⚙️ 관심 분야</h1>
    <div class="small" style="text-align:center">켠 분야만 보이고, 위에 있을수록 먼저 보여요.</div>
    <div id="ints"></div>
    <div class="row2"><button id="soundBtn">🔊 소리</button><button id="resetBtn">처음부터</button><button id="setClose">닫기</button></div>
  </div>
</div>


<script>
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), pip = $('pip'), pctx = pip.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 저장 ---------- */
const KEY = 'jjway-v1';
const COLORS = ['#e8594f', '#2f6fd0', '#f2b134', '#3fa66b', '#9b59b6', '#ef7fb0', '#16a5a5', '#8d6e4c'];
const RELS = ['나', '아빠', '엄마', '남편', '아내', '아들', '딸', '형제·자매', '할아버지', '할머니', '친구', '기타'];
const AGES = ['성인', '학생', '어린이', '유아'];
const INTERESTS = [
  ['food', '🍜 맛집', 1], ['shop', '🛍️ 쇼핑', 1], ['stay', '🏨 숙박', 1], ['onsen', '♨️ 온천', 0], ['sight', '🏯 관광·명소', 0],
  ['nature', '🌿 자연·풍경', 0], ['cafe', '🍰 카페·디저트', 0], ['izakaya', '🍶 이자카야·술집', 0], ['fest', '🎎 축제·행사', 0], ['move', '🚃 이동·교통', 0]];
const SEOUL = { x: -457.8, y: -284.2 };
// 모드마다 화면 짧은 쪽에 보이는 거리(km): [기본, 최소, 최대] — 두 손가락·휠로 바꾸면 모드별로 기억
// 땅 위는 모드 하나(walk) — 확대하면 🚶 가족, 축소하면 🚗 자동차로 그림. ⌖ 버튼 = 자동차 비율(260km)로
const SPAN = { walk: [260, 1.2, 700], plane: [1500, 700, 2600] };
const SPF = { walk: .26, plane: .18 };   // 속도 = 보이는 거리 × 이 값(km/초) → 화면에서 늘 비슷한 빠르기
const CARV = 120;                         // 이보다 멀리 보면 자동차 그림·명소 숨김·공항 화살표
function defParty(n) {
  const base = [['아빠', '아빠'], ['엄마', '엄마'], ['', '아들'], ['', '딸']];
  return Array.from({ length: n }, (_, i) => ({ name: base[i] ? base[i][0] : '', rel: base[i] ? base[i][1] : '기타', age: '성인', col: COLORS[i % COLORS.length] }));
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.party) return s; } catch (e) {}
  return null;
}
let S = load() || { party: defParty(4), ints: INTERESTS.map(([k, , on]) => ({ k, on: !!on })), pos: { ...SEOUL }, mode: 'walk', country: 'KOR', from: null, stamps: {}, started: false };
S.span = Object.assign({ walk: SPAN.walk[0], plane: SPAN.plane[0] }, S.span || {}); delete S.span.car;
if (S.mode === 'car') S.mode = 'walk';
if (S.boardFrom === 'car') S.boardFrom = 'walk';
S.seen = S.seen || {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- 데이터 ---------- */
let M = null, R = null, PL = null;  // map.json, routes.json, places.json
const LAND = {}, ADM = [];
let AIR = [], CITY = [], SPOT = [];
let mask = null, MK = null;
function decode(arr, q) {
  const p = new Path2D(); let x = 0, y = 0;
  for (let i = 0; i < arr.length; i += 2) { x += arr[i]; y += arr[i + 1]; i ? p.lineTo(x / q, y / q) : p.moveTo(x / q, y / q); }
  p.closePath(); return p;
}
const proj = (lon, lat) => ({ x: (lon - M.proj.lon0) * M.proj.kx, y: -(lat - M.proj.lat0) * M.proj.ky });
function buildMask() {
  // 2km 격자: 1 = 한국 땅, 2 = 일본 땅
  const x0 = -820, y0 = -960, sc = 0.5, w = Math.ceil(2300 * sc), h = Math.ceil(2260 * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.setTransform(sc, 0, 0, sc, -x0 * sc, -y0 * sc);
  g.fillStyle = '#f00'; LAND.KOR.forEach(p => g.fill(p));
  g.fillStyle = '#0f0'; LAND.JPN.forEach(p => g.fill(p));
  const d = g.getImageData(0, 0, w, h).data, m = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) m[i] = d[i * 4] > 110 ? 1 : d[i * 4 + 1] > 110 ? 2 : 0;
  mask = m; MK = { x0, y0, sc, w, h };
}
function landAt(x, y) {
  const i = Math.floor((x - MK.x0) * MK.sc), j = Math.floor((y - MK.y0) * MK.sc);
  return i < 0 || j < 0 || i >= MK.w || j >= MK.h ? 0 : mask[j * MK.w + i];
}
const LANDC = { KOR: 1, JPN: 2 };
function canStand(x, y, c) {      // 땅이거나 땅에서 5km 안(좁은 해협·다리)
  const v = LANDC[c]; if (landAt(x, y) === v) return true;
  for (let a = 0; a < 8; a++) if (landAt(x + Math.cos(a * Math.PI / 4) * 5, y + Math.sin(a * Math.PI / 4) * 5) === v) return true;
  return false;
}

/* ---------- 노선 ---------- */
const AL = c => R.airlines[c] || c;
function destsFrom(code) {
  const out = {}, a = R.kr[code] ? 'kr' : 'jp';
  if (a === 'kr') {
    Object.assign(out, R.routes[code] || {});
    if (R.domestic.CJU.includes(code)) out.CJU = ['국내선'];
    if (code === 'CJU') R.domestic.CJU.forEach(k => out[k] = ['국내선']);
  } else {
    for (const k in R.routes) if (R.routes[k][code]) out[k] = R.routes[k][code];
  }
  return out;
}
function krFor(jp) { return Object.keys(R.routes).filter(k => R.routes[k][jp]); }
function seasonal(k, j, al) { return R.seasonal[`${k}-${j}-${al}`] || R.seasonal[`${j}-${k}-${al}`] || ''; }
function airName(c) { return (R.kr[c] || R.jp[c]).ko; }

/* ---------- 입력: 한 손가락 = 조이스틱, 두 손가락 = 확대·축소, 휠 = 확대·축소 ---------- */

/* ---------- 상태 ---------- */

const FLY = m => m === 'ground' || m === 'takeoff' || m === 'plane' || m === 'landing';
const GAUGE = { board: 1.5, land: 1.2 };
const GCOL = { board: '#e8594f', land: '#3fa66b' };
const ICON = { castle: '🏯', garden: '🌳', temple: '🛕', shrine: '⛩️', museum: '🏛️', island: '🏝️', theater: '🎭', aquarium: '🐟', onsen: '♨️', bridge: '🌉', view: '🏞️', sea: '🌊', valley: '🏞️' };

function puff(x, y, n = 18) { if (RM) n = 6; for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 20 + Math.random() * 60; FX.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: .7 + Math.random() * .4, r: 6 + Math.random() * 8 }); } }

/* ---------- 정보 창 ---------- */

}
const NOTE = () => `<div class="note">노선: ${R.source}, ${R.checked} 확인. 예약 전 항공사에서 다시 확인하세요.</div>`;

/* ---------- 게이지 ---------- */
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function headTo(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }
function gaugeOff() { P.g = 0; P.gFor = null; P.gKind = null; P.gAt = null; }
function gauge(dt, id, at, kind, still) {

  P.gAt = at;
  P.g = still ? Math.min(1, P.g + dt / GAUGE[kind]) : Math.max(0, P.g - dt * 1.6);
  return P.g >= 1;
}

/* ---------- 탑승·이륙·착륙 ---------- */

}
function takeoff(hd) {

  locT = 0; closeSheet(); vib([15, 30, 15]);
}

  locT = 0; closeSheet(); vib(20);
}
function arrive(a) {

  const first = !S.stamps[a.code]; S.stamps[a.code] = S.stamps[a.code] || Date.now();
  puff(a.x, a.y, 24); toast(`📍 ${airName(a.code)} 도착!${first ? ' · 🏅 첫 도장 +10' : ''}`);
  if (first) { burst(a.x, a.y, 24, ['#ffd84d', '#fff', '#7fd1ff']); SFX.stamp(); coinsTo(W / 2, H * CY, 6); addPts(10); }
  P.lastFrom = S.from; P.lastFirst = first;
  S.from = null; P.quiet = a.code; sheetAirport(a, 'land'); vib([20, 40, 20]); save();
}
function cancelBoard() {
  if (S.mode !== 'ground') return;
  const a = airport(S.from); S.mode = 'walk'; S.boardFrom = null; S.country = a.c; S.from = null; P.quiet = a.code; gaugeOff();

}
function cancelLanding() {

  S.from = P.lastFrom; P.lastFrom = null; P.quiet = null; P.x = a.x; P.y = a.y; P.anim = null;
  S.mode = 'plane'; S.boardFrom = 'walk'; P.skip = a.code; gaugeOff();

}
Object.assign(window, { cancelBoard, cancelLanding });

/* ---------- 갱신 ---------- */
let locT = 0;
const ease = f => f * f * (3 - 2 * f);
function moveOnLand(dt, ix, iy, sp, okFn) {
  const k = 1 - Math.exp(-dt * 9);
  P.vx += (ix * sp - P.vx) * k; P.vy += (iy * sp - P.vy) * k;
  let nx = P.x + P.vx * dt, ny = P.y + P.vy * dt;
  if (!okFn(nx, ny)) { if (okFn(nx, P.y)) ny = P.y; else if (okFn(P.x, ny)) nx = P.x; else { nx = P.x; ny = P.y; } }
  const moved = Math.hypot(nx - P.x, ny - P.y); P.x = nx; P.y = ny;
  if (moved > 0) { P.trail.unshift({ x: P.x, y: P.y }); if (P.trail.length > 400) P.trail.length = 400; }
  if (Math.hypot(P.vx, P.vy) > sp * .05) { const t = Math.atan2(P.vy, P.vx); let d = t - P.hd; d = Math.atan2(Math.sin(d), Math.cos(d)); P.hd += d * Math.min(1, dt * 10); }
  return moved;
}
// 지금 가까이 있는 것에 맞춰 창 자동으로 열기·닫기 (명소 > 공항 > 도시)
function autoSheet(key, open) {
  if (P.closedFor && P.closedFor !== key) P.closedFor = null;
  if (!key) { if (['air', 'land', 'city', 'spot', 'flag'].includes(P.sheetKind)) closeSheet(); return; }
  if (P.sheetFor !== key && P.closedFor !== key) open();
}
function step(dt) {

    P.alt = 0;
    const air = nearestAirport(NEAR.walkAir, a => a.c === S.country);
    if (P.quiet && (!air || air.code !== P.quiet)) { P.quiet = null; P.lastFrom = null; }
    const spot = !far() ? nearest(SPOT, NEAR.spot) : null;     // 명소 도장은 확대했을 때만
    const city = nearest(CITY, NEAR.city * (far() ? 1.3 : 1));
    // 명소 도착 = 도장

  h += `<div class="seg"><button data-v="want" onclick="pickStatus('want')">가고 싶어요</button><button data-v="been" onclick="pickStatus('been')">다녀왔어요</button></div></div>`;
  h += `<div class="frow"><span class="lock">🔒 나만 보기</span><span class="lock off" title="나중에">🌏 공개 (준비 중)</span></div>`;
  h += `<button class="go" style="margin-top:10px;height:48px" onclick="saveFlag()">${f ? '💾 고친 내용 저장' : '✨ 깃발 꽂기'}</button>`;
  if (f) h += `<button class="del" onclick="deleteFlag('${f.id}')">깃발 뽑기(삭제)</button>`;
  openSheet(head, h, 'flagform', 'flagform');
  paintForm(); if (!f) setTimeout(() => $('fName') && $('fName').focus(), 50);
}
function paintForm() {
  const sh = $('sheet'); if (!FORM) return;
  sh.querySelectorAll('.cats button').forEach(b => b.classList.toggle('on', b.dataset.c === FORM.cat));
  sh.querySelectorAll('.stars button').forEach(b => b.classList.toggle('on', +b.dataset.s <= FORM.star));
  sh.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v === FORM.status));
}
window.pickCat = k => { FORM.cat = k; SFX.pop(); paintForm(); };
window.pickStar = i => { FORM.star = FORM.star === i ? 0 : i; paintForm(); };
window.pickStatus = v => { FORM.status = v; paintForm(); };
window.cancelFlag = () => { FORM = null; closeSheet(); };
window.saveFlag = () => {
  const name = ($('fName').value || '').trim();
  if (!name) { $('fName').classList.add('bad'); $('fName').focus(); toast('이름을 적어 주세요'); return; }
  const now = Date.now(), data = { name, memo: $('fMemo').value.trim(), link: $('fLink').value.trim(), cat: FORM.cat, star: FORM.star, status: FORM.status };
  if (FORM.id) {
    const f = S.flags.find(x => x.id === FORM.id); Object.assign(f, data, { updated: now });
    const rt = FLAGS.find(r => r.f === f); FORM = null; save(); sheetFlag(rt); burst(rt.x, rt.y, 12, ['#ffd84d', '#fff']); SFX.pop(); toast('💾 저장했어요'); return;
  }
  const f = { id: uid(), lat: FORM.lat, lon: FORM.lon, ...data, vis: 'private', created: now, updated: now };
  S.flags.push(f); const rt = flagRT(f, performance.now()); FLAGS.push(rt); FORM = null; save();
  closeSheet(); P.closedFor = 'flag:' + f.id;
  // 생성 연출: 하늘에서 깃발이 떨어져 꽂힘 → 충격파 · 색종이 · 아이콘 뿅 · 동전
  const col = CATS[f.cat][2];
  setTimeout(() => { shock(rt.x, rt.y, col); shock(rt.x, rt.y, '#ffd84d'); burst(rt.x, rt.y, 36, [col, '#ffd84d', '#ffffff', '#7fd1ff']); vib([30, 40, 60]);
    const sx = W / 2 + (rt.x - CAM.x) * CAM.z, sy = H * CY + (rt.y - CAM.y) * CAM.z; coinsTo(sx, sy, 5); addPts(5); }, 420);
  SFX.plant(); toast(`🚩 ${CATS[f.cat][0]} ${name} — 깃발을 꽂았어요! +5`, 3000);
};
window.deleteFlag = id => {
  if (!confirm('이 깃발을 뽑을까요?')) return;
  S.flags = S.flags.filter(x => x.id !== id); const i = FLAGS.findIndex(r => r.f.id === id), rt = FLAGS[i];
  if (rt) { burst(rt.x, rt.y, 14, ['#bbb', '#888']); FLAGS.splice(i, 1); }
  FORM = null; save(); closeSheet(); toast('깃발을 뽑았어요');
};
window.editFlag = id => openFlagForm(FLAGS.find(r => r.f.id === id));
function sheetFlag(rt) {
  const f = rt.f, c = CATS[f.cat];
  const head = `<h2>${c[0]} ${esc(f.name)}</h2><button class="cbtn" onclick="editFlag('${f.id}')">✏️ 고치기</button>`;
  let h = `<div class="sub">🚩 내 깃발 · ${c[1]} · ${f.status === 'been' ? '✔ 다녀왔어요' : '💭 가고 싶어요'}${f.star ? ' · ' + '★'.repeat(f.star) : ''}</div>`;
  if (f.memo) h += `<div class="intro">${esc(f.memo)}</div>`;
  if (f.link) h += `<div class="sub"><a href="${esc(/^https?:\/\//.test(f.link) ? f.link : 'https://' + f.link)}" target="_blank" rel="noopener">🔗 링크 열기</a></div>`;
  h += `<a class="nav" href="https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lon}" target="_blank" rel="noopener">🧭 구글 지도에서 길 찾기</a>`;
  h += `<div class="note">🔒 나만 보기 · ${new Date(f.created).toLocaleDateString('ko-KR')} 꽂음</div>`;
  openSheet(head, h, 'flag:' + f.id, 'flag');
}
// 지나가면: 동전 짤랑(층층이 돈 줍듯) + 팝업. 멀어졌다 다시 오면 또.
function flagStep() {
  if (S.mode !== 'walk' || far()) return null;
  let near = null, nd = .7;
  for (const r of FLAGS) {
    const d = Math.hypot(r.x - P.x, r.y - P.y);
    if (d > 1.6) r.armed = true;
    if (d < nd) { nd = d; near = r; }
  }
  if (near && near.armed && performance.now() - near.born > 1500) {
    near.armed = false; near.last = performance.now();
    const sx = W / 2 + (near.x - CAM.x) * CAM.z, sy = H * CY + (near.y - CAM.y) * CAM.z;
    burst(near.x, near.y, 18, ['#ffd84d', '#fff3a0', CATS[near.f.cat][2]], 60); coinsTo(sx, sy, 3); addPts(1); SFX.coin(); vib(20);
    if (P.closedFor === 'flag:' + near.f.id) P.closedFor = null;
  }
  return near;
}
function flagMarks(g, cam, cx, cy, span, small) {
  if (FLY(S.mode) || span > CARV * 3) return;
  const now = performance.now();
  for (const r of FLAGS) {
    const sx = cx + (r.x - cam.x) * cam.z, sy = cy + (r.y - cam.y) * cam.z;
    if (!onScr(g, sx, sy)) continue;
    const c = CATS[r.f.cat], k = small ? .7 : span > CARV ? .75 : 1;
    // 꽂히는 연출: 0.45초 떨어짐 → 통통
    const age = (now - r.born) / 1000; let dy = 0, sc = 1;
    if (age < .45) dy = -260 * (1 - age / .45) ** 2; else if (age < .9) { const q = (age - .45) / .45; sc = 1 + Math.sin(q * Math.PI * 2) * .25 * (1 - q); }
    const glow = now - r.last < 600 ? 1 - (now - r.last) / 600 : 0;
    g.save(); g.translate(sx, sy + dy); g.scale(k * sc, k * sc);
    g.fillStyle = 'rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(0, 1, 7, 2.6, 0, 0, 6.29); g.fill();
    if (glow) { g.fillStyle = `rgba(255,216,77,${glow * .6})`; g.beginPath(); g.arc(0, -16, 22, 0, 6.29); g.fill(); }
    g.strokeStyle = '#4a3b2a'; g.lineWidth = 2.2; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -30); g.stroke();
    const wave = Math.sin(now / 260 + r.x) * 2;
    g.fillStyle = c[2]; g.strokeStyle = '#2c2b35'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(0, -30); g.quadraticCurveTo(10, -30 + wave, 20, -26 + wave); g.lineTo(20, -14 + wave); g.quadraticCurveTo(10, -18 + wave, 0, -16); g.closePath(); g.fill(); g.stroke();
    g.font = '11px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(c[0], 10, -22 + wave);
    if (r.f.status === 'been') { g.fillStyle = '#ffd84d'; g.beginPath(); g.arc(0, -31, 3, 0, 6.29); g.fill(); }
    g.restore();
    if (!small && span < 60 && free(sx + 10 * k, sy + 10, r.f.name.length * 12, 14)) text(g, r.f.name, sx + 10 * k, sy + 10, 12, '#2c2b35');
    LBL.push([sx + 8, sy - 18, 26, 34]);
  }
}
$('bFlag').onclick = () => { if (S.mode === 'walk' && !far()) openFlagForm(null); };

/* ---------- 설정 화면 ---------- */
let draftN = S.party.length, draft = S.party.map(m => ({ ...m }));
function renderSetup() {
  $('nVal').textContent = draftN;
  while (draft.length < draftN) draft.push(...defParty(draft.length + 1).slice(draft.length).map(m => ({ ...m, col: COLORS[draft.length % COLORS.length] })));
  const box = $('mems'); box.innerHTML = '';
  draft.slice(0, draftN).forEach(m => {
    const row = document.createElement('div'); row.className = 'mem';
    row.innerHTML = `<button class="dot" style="background:${m.col}" aria-label="색"></button>
      <input maxlength="10" placeholder="이름·별명" value="${(m.name || '').replace(/"/g, '&quot;')}">
      <select>${RELS.map(r => `<option${r === m.rel ? ' selected' : ''}>${r}</option>`).join('')}</select>
      <select>${AGES.map(r => `<option${r === m.age ? ' selected' : ''}>${r}</option>`).join('')}</select>`;
    const [dot, inp, rel, age] = row.children;
    dot.onclick = () => { m.col = COLORS[(COLORS.indexOf(m.col) + 1) % COLORS.length]; dot.style.background = m.col; };
    inp.oninput = () => m.name = inp.value.trim(); rel.onchange = () => m.rel = rel.value; age.onchange = () => m.age = age.value;
    box.appendChild(row);
  });
}
$('nMinus').onclick = () => { draftN = Math.max(1, draftN - 1); renderSetup(); };
$('nPlus').onclick = () => { draftN = Math.min(8, draftN + 1); renderSetup(); };
$('goBtn').onclick = () => {
  S.party = draft.slice(0, draftN).map(m => ({ ...m, name: m.name || m.rel }));
  const first = !S.started; S.started = true; save(); $('setup').hidden = true;
  if (first) toast('🚗 차로 공항까지 가요 · 화면을 끌어서 움직이고, 두 손가락으로 확대·축소(⌖ = 기본 비율)', 4600);
  else toast(`${S.party.length}명 출발 준비 완료`);
};
$('bParty').onclick = () => { draftN = S.party.length; draft = S.party.map(m => ({ ...m })); renderSetup(); $('setup').hidden = false; };
function renderInts() {
  const box = $('ints'); box.innerHTML = '';
  S.ints.forEach((it, i) => {
    const nm = INTERESTS.find(x => x[0] === it.k)[1];
    const row = document.createElement('div'); row.className = 'int';
    row.innerHTML = `<span class="nm">${nm}</span><button aria-label="위로">▲</button><button aria-label="아래로">▼</button><button class="sw${it.on ? ' on' : ''}" aria-label="켜기"></button>`;
    const [, up, dn, sw] = row.children;
    up.onclick = () => { if (i) { [S.ints[i - 1], S.ints[i]] = [S.ints[i], S.ints[i - 1]]; save(); renderInts(); } };
    dn.onclick = () => { if (i < S.ints.length - 1) { [S.ints[i + 1], S.ints[i]] = [S.ints[i], S.ints[i + 1]]; save(); renderInts(); } };
    sw.onclick = () => { it.on = !it.on; if (!S.ints.some(x => x.on)) it.on = true; save(); renderInts(); };
    box.appendChild(row);
  });
}
const soundLbl = () => $('soundBtn').textContent = S.sound === false ? '🔇 소리 꺼짐' : '🔊 소리 켜짐';
$('soundBtn').onclick = () => { S.sound = S.sound === false; save(); soundLbl(); if (S.sound) SFX.coin(); };
$('bSet').onclick = () => { renderInts(); soundLbl(); $('settings').hidden = false; };
$('setClose').onclick = () => { $('settings').hidden = true; const k = P.sheetFor; if (k) { closeSheet(); P.closedFor = null; } };
$('resetBtn').onclick = () => { if (confirm('가족 설정·도장·위치를 모두 지우고 처음부터 할까요?')) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } };
$('bHome').onclick = () => location.href = '/';
// 창 위쪽(손잡이·제목 줄)을 아래로 쓸어내리면 닫힘
(() => {
  const sh = $('sheet'); let d = null;
  sh.addEventListener('pointerdown', e => { if (!e.target.closest('.top') || e.target.closest('button')) return; d = { id: e.pointerId, y: e.clientY, dy: 0 }; sh.setPointerCapture(e.pointerId); sh.style.transition = 'none'; });
  sh.addEventListener('pointermove', e => { if (!d || e.pointerId !== d.id) return; d.dy = Math.max(0, e.clientY - d.y); sh.style.transform = `translateX(-50%) translateY(${d.dy}px)`; });
  const end = e => { if (!d || e.pointerId !== d.id) return; const close = d.dy > 60; d = null; sh.style.transition = 'transform .18s'; if (close) { sh.style.transform = 'translateX(-50%) translateY(110%)'; setTimeout(xClose, 170); } else sh.style.transform = ''; };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
})();
// 돋보기 누르면 지금 상황 창 다시 열기
$('pip').addEventListener('click', () => {
  P.closedFor = null;
  if (S.mode === 'ground') return sheetGround(airport(S.from));
  if (S.mode !== 'walk') return;
  const spot = !far() ? nearest(SPOT, NEAR.spot) : null, air = nearestAirport(NEAR.walkAir, a => a.c === S.country), city = nearest(CITY, NEAR.city * 1.3);
  if (spot) sheetSpot(spot); else if (air) sheetAirport(air, P.lastFrom && P.quiet === air.code ? 'land' : undefined); else if (city) sheetCity(city);
  else { const c = nearest(CITY, 400); if (c) { sheetCity(c); } else toast('공항·도시 근처에서 누르면 정보가 열려요'); }
});
// 위쪽 상태 칸 = 새로 읽기
$('loc').onclick = () => { S.pos = { x: P.x, y: P.y }; save(); location.replace(location.pathname + '?r=' + Date.now()); };

/* ---------- 시작 ---------- */
let last = 0;
function frame(ts) {
  const t = ts / 1000, dt = Math.min(.05, last ? t - last : 0); last = t;
  if ($('setup').hidden && $('settings').hidden) step(dt); else { P.vx = P.vy = 0; }
  draw(t); requestAnimationFrame(frame);
}
(async () => {
  resize();
  const [m, r, pl] = await Promise.all(['map.json', 'routes.json', 'places.json'].map(f => fetch(f).then(x => x.json())));
  M = m; R = r; PL = pl;
  for (const k in M.land) LAND[k] = M.land[k].map(a => decode(a, M.proj.q));
  for (const a of M.adm) ADM.push({ ko: a.ko, ja: a.ja, c: a.c, lx: a.lx, ly: a.ly, p: a.r.map(x => decode(x, M.proj.q)) });
  AIR = Object.entries(M.airports).map(([code, a]) => ({ code, ...a, pref: (R.kr[code] && R.kr[code].pref) || a.pref }));
  buildMask();
  CITY = PL.cities.map(c => ({ ...c, ...proj(c.lon, c.lat), c: 'JPN' }));
  for (const c of CITY) { c.spots = c.spots.map((s, i) => ({ ...s, ...proj(s.lon, s.lat), city: c.id, key: c.id + ':' + i })); SPOT.push(...c.spots); }
  FLAGS.push(...S.flags.map(f => flagRT(f)));
  $('ptsN').textContent = S.pts || 0;
  if (FLY(S.mode) && !S.from) S.mode = 'walk';
  if (S.mode === 'takeoff') S.mode = 'ground';
  if (S.mode === 'landing') S.mode = 'plane';
  P.alt = S.mode === 'plane' ? 1 : 0;
  if (S.mode === 'walk' && !canStand(P.x, P.y, S.country) && !AIR.some(a => dist(a, P) < 22)) { P.x = SEOUL.x; P.y = SEOUL.y; S.country = 'KOR'; }
  const span0 = FLY(S.mode) ? S.span.walk + (S.span.plane - S.span.walk) * P.alt : S.span.walk;
  CAM.x = P.x; CAM.y = P.y; CAM.z = Math.min(W, H) / span0;
  if (S.mode === 'ground') { const a = airport(S.from); P.x = a.x; P.y = a.y; sheetGround(a); }
  if (!S.started) { renderSetup(); $('setup').hidden = false; }
  requestAnimationFrame(frame);
})();

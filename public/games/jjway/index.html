<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>jjWay · Japan Joy Way</title>
<meta name="description" content="가족과 떠나는 일본 소도시 여행 지도 — 차로 공항, 비행기로 일본, 걸어서 명소">
<meta name="theme-color" content="#bfe3f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#2c2b35;--sea:#bfe3f2;--card:#fffdf7;--pri:#e8594f;--blue:#2f6fd0;--line:rgba(44,43,53,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);color:var(--ink);font-family:Jua,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#vp{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);pointer-events:none;height:100dvh}
#cv{position:fixed;left:0;top:0;touch-action:none}
button,input,select{font-family:inherit;color:inherit}
.chip{position:fixed;background:rgba(255,253,247,.94);border:2px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:15px;box-shadow:0 3px 0 rgba(44,43,53,.25);z-index:20}
#loc{left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));max-width:calc(100vw - var(--pipw, 150px) - 34px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#loc:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(44,43,53,.25)}
#loc::after{content:' ↻';color:#8a8794;font-size:13px}
#loc .cty{font-size:11px;color:#8a8794;margin-right:6px;vertical-align:1px}
#loc b{font-weight:400;font-size:18px}
#btns{position:fixed;left:calc(10px + env(safe-area-inset-left));top:calc(50px + env(safe-area-inset-top));display:flex;gap:8px;z-index:20}
.ib{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-size:20px;box-shadow:0 3px 0 rgba(44,43,53,.25);cursor:pointer;display:grid;place-items:center;padding:0}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(44,43,53,.25)}
#pipWrap{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));z-index:20;pointer-events:none;text-align:center}
#pip{pointer-events:auto;cursor:pointer;border-radius:50%;border:3px solid var(--ink);box-shadow:0 4px 0 rgba(44,43,53,.25),0 0 0 5px rgba(255,255,255,.7);background:var(--sea);display:block}
.top{touch-action:none;cursor:grab;margin:-12px -14px 0;padding:8px 14px 2px}
.grab{width:42px;height:5px;border-radius:3px;background:#d3cec3;margin:0 auto 8px}
.hd{display:flex;align-items:flex-start;gap:8px}.hd h2{flex:1;min-width:0}
.side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.info{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #8a8794;background:#fff;color:#8a8794;font:700 13px/1 Georgia,serif;font-style:italic;padding:0;cursor:pointer}
.info.on{background:#f0d98c;border-color:#c9a632;color:#6b5410}
.cbtn{flex:none;height:32px;padding:0 12px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-family:Jua,sans-serif;font-size:14px;box-shadow:0 2px 0 rgba(44,43,53,.25);cursor:pointer;white-space:nowrap}
.cbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(44,43,53,.25)}
.hint{background:#fff7e0;border:1px solid #f0d98c;border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.45;margin:4px 0 8px}
#pipTxt{margin-top:6px;font-size:13px;background:rgba(255,253,247,.94);border:2px solid var(--ink);border-radius:10px;padding:3px 8px;max-width:190px;line-height:1.3}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.t{background:var(--ink);color:#fff;border-radius:12px;padding:8px 14px;font-size:15px;line-height:1.35;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(96vw,460px);max-height:46vh;overflow:auto;background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(44,43,53,.25);z-index:30;padding:12px 14px 14px;touch-action:pan-y;font-family:system-ui,sans-serif}
#sheet h2{font-family:Jua,sans-serif;font-weight:400;margin:0 0 2px;font-size:22px}
#sheet .sub{color:#6b6876;font-size:13px;margin-bottom:8px}
#sheet .x{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:none;background:#eee9df;font-size:16px;cursor:pointer}
.rt{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.rt b{font-family:Jua,sans-serif;font-weight:400;font-size:16px;min-width:88px}
.al{display:inline-block;background:#eef3ff;border:1px solid #c9d6f5;border-radius:999px;padding:1px 7px;margin:1px 2px;font-size:12px;white-space:nowrap}
.al.ex{background:#fff3e6;border-color:#f3cfa5}
.note{font-size:12px;color:#8a8794;margin-top:8px;line-height:1.45}
.warn{background:#fff0ee;border:1px solid #f2c2bb;border-radius:10px;padding:8px 10px;font-size:14px;margin:6px 0}
.soon{background:#f3f7ee;border:1px dashed #b9cfa3;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.ov{position:fixed;inset:0;z-index:60;background:rgba(44,43,53,.45);display:grid;place-items:center;padding:12px;touch-action:pan-y}
.box{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(44,43,53,.3);width:min(96vw,440px);max-height:92vh;overflow:auto;padding:18px 16px;font-family:system-ui,sans-serif}
.box h1{font-family:Jua,sans-serif;font-weight:400;margin:0;font-size:30px;text-align:center}
.box h1 small{display:block;font-size:15px;color:#6b6876;margin-top:2px}
.box h3{font-family:Jua,sans-serif;font-weight:400;font-size:18px;margin:14px 0 6px}
.step{display:flex;align-items:center;justify-content:center;gap:14px;font-family:Jua,sans-serif;font-size:26px;margin:6px 0}
.step button{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:24px;cursor:pointer}
.mem{display:grid;grid-template-columns:34px 1fr 82px 74px;gap:6px;align-items:center;margin:6px 0}
.mem input,.mem select{height:38px;border:2px solid #d8d3c8;border-radius:10px;padding:0 8px;font-size:15px;background:#fff;min-width:0}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0}
.go{display:block;width:100%;margin-top:16px;height:52px;border-radius:16px;border:3px solid var(--ink);background:var(--pri);color:#fff;font-family:Jua,sans-serif;font-size:22px;box-shadow:0 4px 0 rgba(44,43,53,.35);cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(44,43,53,.35)}
.small{font-size:12px;color:#8a8794;line-height:1.5;margin-top:8px}
.int{display:flex;align-items:center;gap:8px;padding:7px 4px;border-top:1px dashed var(--line);font-size:16px}
.int .nm{flex:1}
.int button{width:34px;height:30px;border-radius:8px;border:2px solid #d8d3c8;background:#fff;cursor:pointer}
.sw{width:50px;height:28px;border-radius:999px;border:2px solid var(--ink);background:#ddd;position:relative;cursor:pointer;padding:0}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.sw.on{background:#7cc576}.sw.on::after{left:24px}
.row2{display:flex;gap:8px;margin-top:12px}
.row2 button{flex:1;height:42px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-family:Jua,sans-serif;font-size:17px;cursor:pointer}
.intro{font-size:14px;line-height:1.55;margin:2px 0 8px}
.sp{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.sp .ic{font-size:20px;line-height:1.2}.sp b{font-family:Jua,sans-serif;font-weight:400;font-size:16px}
.sp .d{font-size:12px;color:#6b6876;line-height:1.4;margin-top:1px}.sp i{font-style:normal;font-size:12px;color:#8a8794;white-space:nowrap;margin-left:auto}
.sp.seen b{color:#8a6a1d}.al.ok{background:#fff3c4;border-color:#e2c25a}
#zoom{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:20;transition:bottom .15s}
#zoom button{width:46px;height:46px;font-size:26px!important;border-radius:12px;border:2px solid var(--ink);background:var(--card);font-size:22px;line-height:1;box-shadow:0 3px 0 rgba(44,43,53,.25);cursor:pointer;padding:0}
#zoom button.on{background:#ffcf5a;box-shadow:0 0 0 3px rgba(255,207,90,.5),0 3px 0 rgba(44,43,53,.25)}
#zoom button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(44,43,53,.25)}
#sheet a{color:var(--blue)}
#pts{cursor:pointer}#pts:active{transform:translateY(2px)}
.mbox{max-height:88vh;display:flex;flex-direction:column;padding-bottom:10px}
.mhead{display:flex;align-items:center;justify-content:space-between}
.mx{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:16px;cursor:pointer}
#mSum{display:flex;gap:6px;margin:10px 0}
#mSum div{flex:1;background:#fff7e0;border:1px solid #f0d98c;border-radius:12px;padding:6px 4px;text-align:center;font-size:12px;color:#6b6876}
#mSum b{display:block;font-family:Jua,sans-serif;font-weight:400;font-size:20px;color:var(--ink)}
.mtabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.mtabs button{flex:1;border:2px solid #d8d3c8;border-bottom:none;border-radius:10px 10px 0 0;background:#f3efe6;padding:7px 0;font:15px Jua,sans-serif;cursor:pointer}
.mtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#mList{overflow:auto;flex:1;min-height:120px}
.mg{margin:10px 0 4px;font-family:Jua,sans-serif;font-size:17px;display:flex;align-items:center;gap:8px}
.mg small{font:12px system-ui,sans-serif;color:#8a8794}
.bar{flex:1;height:8px;background:#eee8da;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f2b134,#e8594f)}
.mc{font:14px Jua,sans-serif;color:#6b6876;margin:6px 0 2px 2px;display:flex;align-items:center;gap:6px}
.mr{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:10px;cursor:pointer;font-size:14px}
.mr:active{background:#fff3c4}.mr .ic{font-size:18px;width:26px;text-align:center}.mr b{font-weight:600;flex:1}.mr i{font-style:normal;font-size:12px;color:#8a8794;white-space:nowrap}
.mr.no{opacity:.45}.mr.ok b{color:#8a6a1d}
.fb{display:flex;align-items:center;gap:8px;margin:4px 0 8px}.fb .bar{position:relative;max-width:120px;height:10px}.fb .bar u{position:absolute;left:50%;top:-2px;bottom:-2px;border-left:2px solid #e8594f}.fb small{font-size:12px;color:#6b6876}
#peekBtn small{font:12px system-ui,sans-serif;color:#d4a017}
.fsearch{display:flex;gap:6px}.fsearch .fin{flex:1;margin:0}.qgo{flex:none;width:64px;border-radius:10px;border:2px solid var(--ink);background:var(--pri);color:#fff;font:16px Jua,sans-serif;cursor:pointer}
.qbs{display:flex;gap:6px;margin:8px 0}.qbs button{flex:1;height:40px;border-radius:12px;border:2px solid var(--ink);background:#fff;font:15px Jua,sans-serif;cursor:pointer}
.qmsg{text-align:center;color:#6b6876;font-size:14px;padding:12px}
#qRes .mr b{display:flex;flex-direction:column}#qRes .mr .ko{font-weight:400;font-size:13px;color:#2f6fd0}#qRes .mr b small{font-weight:400;font-size:11px;color:#8a8794;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
#peek:has(#card:not([hidden])){max-width:none}
#card{background:var(--card);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(44,43,53,.3);padding:10px 12px;width:min(92vw,380px);font-family:system-ui,sans-serif}
.ct{display:flex;align-items:center;gap:7px}.ct .ci{font-size:22px}.ct b{font:400 18px Jua,sans-serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{display:flex;align-items:center;gap:8px;margin:7px 0 2px}.cb .bar{position:relative;flex:1;height:10px}.cb .bar u{position:absolute;left:50%;top:-2px;bottom:-2px;border-left:2px solid #e8594f}.cb small{font-size:12px;color:#6b6876;white-space:nowrap}
.cd{font-size:13px;color:#6b6876;margin:4px 0 0}
.cbtns{display:flex;gap:8px;margin-top:8px}.cbtns button{flex:1;height:40px;border-radius:12px;border:2px solid var(--ink);background:#fff;font:16px Jua,sans-serif;cursor:pointer;box-shadow:0 2px 0 rgba(44,43,53,.25)}
.cbtns button{font-size:15px}
.cbtns button.wi.on{background:#ffe6ef;border-color:#b3305f;color:#b3305f}.cbtns button.ok.on{background:#fff3c4;border-color:#a8790f;color:#8a6a1d}
.ct .cdt{flex:none;height:32px;padding:0 12px;border-radius:999px;border:2px solid var(--ink);background:#fff;font:14px Jua,sans-serif;cursor:pointer;box-shadow:0 2px 0 rgba(44,43,53,.25)}.ct .cdt:active{transform:translateY(2px);box-shadow:none}
.cbtns button:active{transform:translateY(2px);box-shadow:none}
.hb{flex:none;width:32px;height:28px;border-radius:8px;border:1.5px solid #e2dcd0;background:#fff;color:#d8d3c8;font-size:16px;cursor:pointer;margin-left:4px}.hb.on{color:#e05a8a;border-color:#f3b6cb;background:#ffe6ef}
.mfoot{display:flex;gap:8px;margin-top:8px}.mfoot button{flex:1;height:38px;border-radius:10px;border:2px solid #d8d3c8;background:#fff;font:14px Jua,sans-serif;color:#a33;cursor:pointer}
.empty{text-align:center;color:#8a8794;font-size:14px;padding:24px 8px;line-height:1.6}

#peek{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:28;max-width:calc(100vw - 130px)}
#peek.in{animation:pin .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pin{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#peekBtn{height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:var(--card);font-family:Jua,sans-serif;font-size:17px;box-shadow:0 3px 0 rgba(44,43,53,.3);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#peekBtn span{font-size:13px;color:#8a8794;margin-left:4px}#peekBtn em{font-style:normal;color:#d4a017}
#peekBtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(44,43,53,.3)}
#pts{left:calc(10px + env(safe-area-inset-left));top:calc(102px + env(safe-area-inset-top));padding:3px 11px;font-size:14px}
#pts b{font-weight:400;font-size:16px}
#pts.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.cats{display:flex;gap:6px;margin:4px 0 8px}
.cats button{flex:1;border:2px solid #d8d3c8;background:#fff;border-radius:12px;padding:5px 0;font-size:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.cats button span{font:12px Jua,sans-serif;color:#6b6876}.cats button.on{border-color:var(--ink);background:#fff3c4;transform:translateY(-2px);box-shadow:0 2px 0 rgba(44,43,53,.25)}
.fin{display:block;width:100%;border:2px solid #d8d3c8;border-radius:10px;padding:8px 10px;font-size:15px;margin:5px 0;background:#fff;font-family:system-ui,sans-serif;resize:none}
.fin:focus{outline:none;border-color:var(--blue)}.fin.bad{border-color:var(--pri)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.stars button{border:none;background:none;font-size:24px;color:#d8d3c8;padding:0 1px;cursor:pointer}.stars button.on{color:#f2b134}
.seg{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}.seg button{border:none;background:#fff;padding:5px 10px;font:14px Jua,sans-serif;cursor:pointer}.seg button.on{background:var(--ink);color:#fff}
.lock{font-size:13px;background:#eef3ff;border:1px solid #c9d6f5;border-radius:999px;padding:3px 10px}.lock.off{opacity:.45}
.del{display:block;margin:10px auto 0;border:none;background:none;color:#a33;font-size:13px;text-decoration:underline;cursor:pointer}
.nav{display:block;text-align:center;margin:8px 0;padding:10px;border:2px solid var(--ink);border-radius:12px;background:#eef3ff;font-family:Jua,sans-serif;font-size:16px;text-decoration:none;color:var(--ink)!important}
#attr{position:fixed;left:calc(6px + env(safe-area-inset-left));bottom:calc(4px + env(safe-area-inset-bottom));z-index:15;font:10px system-ui,sans-serif;color:#555;background:rgba(255,255,255,.75);padding:1px 5px;border-radius:4px}
#attr a{color:inherit}
</style>
</head>
<body>
<div id="vp"></div>
<canvas id="cv" aria-label="한국·일본 여행 지도"></canvas>
<div id="loc" class="chip" role="button" title="새로 읽기">📍 불러오는 중…</div>
<div id="pts" class="chip" title="여행 포인트">🏅 <b id="ptsN">0</b></div>
<div id="btns">
  <button class="ib" id="bParty" title="가족 설정">👨‍👩‍👧‍👦</button>
  <button class="ib" id="bSet" title="관심 분야">⚙️</button>
  <button class="ib" id="bHome" title="wowhit 홈">⌂</button>
</div>
<div id="pipWrap"><canvas id="pip"></canvas><div id="pipTxt" hidden></div></div>
<div id="zoom"><button id="bFlag" aria-label="장소 찾기" hidden>🔍</button><button id="bTarget" aria-label="내 위치 · 기본 비율">⌖</button></div>
<div id="sheet" hidden></div>

<div id="peek" hidden><button id="peekBtn"></button><div id="card" hidden></div></div>
<div id="toast"></div>
<div id="attr" hidden>出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院 地理院タイル(淡色地図)</a></div>

<div class="ov" id="setup" hidden>
  <div class="box">
    <h1>jjWay<small>Japan Joy Way · 가족과 떠나는 일본 소도시 여행</small></h1>
    <h3>몇 명이 떠나요?</h3>
    <div class="step"><button id="nMinus">−</button><span id="nVal">4</span>명<button id="nPlus">＋</button></div>
    <h3>함께 가는 사람</h3>
    <div id="mems"></div>
    <div class="small">색 동그라미를 누르면 캐릭터 색이 바뀌어요. 이름·구성은 <b>이 폰(브라우저)에만</b> 저장돼요.<br>여권번호·주민번호 같은 정보는 받지 않아요.</div>
    <button class="go" id="goBtn">✈️ 출발!</button>
  </div>
</div>

<div class="ov" id="medals" hidden>
  <div class="box mbox">
    <div class="mhead"><h1 style="font-size:24px;text-align:left">🏅 나의 여행 기록</h1><button class="mx" id="mClose" aria-label="닫기">✕</button></div>
    <div id="mSum"></div>
    <div class="mtabs"><button data-t="spot" class="on">📍 명소</button><button data-t="air">✈️ 공항</button><button data-t="flag">🚩 깃발</button></div>
    <div id="mList"></div>
    <div class="mfoot"><button id="mResetTab">이 탭 기록 지우기</button><button id="mResetAll">전체 초기화</button></div>
  </div>
</div>
<div class="ov" id="settings" hidden>
  <div class="box">
    <h1 style="font-size:24px">⚙️ 관심 분야</h1>

<script>
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), pip = $('pip'), pctx = pip.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 저장 ---------- */
const KEY = 'jjway-v1';
const COLORS = ['#e8594f', '#2f6fd0', '#f2b134', '#3fa66b', '#9b59b6', '#ef7fb0', '#16a5a5', '#8d6e4c'];
const RELS = ['나', '아빠', '엄마', '남편', '아내', '아들', '딸', '형제·자매', '할아버지', '할머니', '친구', '기타'];
const AGES = ['성인', '학생', '어린이', '유아'];
const INTERESTS = [
  ['food', '🍜 맛집', 1], ['shop', '🛍️ 쇼핑', 1], ['stay', '🏨 숙박', 1], ['onsen', '♨️ 온천', 0], ['sight', '🏯 관광·명소', 0],
  ['nature', '🌿 자연·풍경', 0], ['cafe', '🍰 카페·디저트', 0], ['izakaya', '🍶 이자카야·술집', 0], ['fest', '🎎 축제·행사', 0], ['move', '🚃 이동·교통', 0]];
const SEOUL = { x: -457.8, y: -284.2 };
// 모드마다 화면 짧은 쪽에 보이는 거리(km): [기본, 최소, 최대] — 두 손가락·휠로 바꾸면 모드별로 기억

const SPAN = { walk: [260, 1.2, 700], plane: [1500, 700, 2600] };
const SPF = { walk: .26, plane: .18 };   // 속도 = 보이는 거리 × 이 값(km/초) → 화면에서 늘 비슷한 빠르기

function defParty(n) {
  const base = [['아빠', '아빠'], ['엄마', '엄마'], ['', '아들'], ['', '딸']];
  return Array.from({ length: n }, (_, i) => ({ name: base[i] ? base[i][0] : '', rel: base[i] ? base[i][1] : '기타', age: '성인', col: COLORS[i % COLORS.length] }));
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.party) return s; } catch (e) {}
  return null;
}
let S = load() || { party: defParty(4), ints: INTERESTS.map(([k, , on]) => ({ k, on: !!on })), pos: { ...SEOUL }, mode: 'walk', country: 'KOR', from: null, stamps: {}, started: false };
S.span = Object.assign({ walk: SPAN.walk[0], plane: SPAN.plane[0] }, S.span || {}); delete S.span.car;
if (S.mode === 'car') S.mode = 'walk';
if (S.boardFrom === 'car') S.boardFrom = 'walk';
S.seen = S.seen || {};          // 명소 '다녀왔어요' 시각

// 자동 '다녀왔어요'는 명소마다 딱 한 번. 한 번 자동으로 됐거나 손으로 바꾼 곳은 그 뒤 수동만(S.lock)
S.lock = S.lock || {}; for (const k in S.seen) S.lock[k] = 1;   // '가고 싶어요'는 미리 표시라 잠그지 않음
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- 데이터 ---------- */
let M = null, R = null, PL = null;  // map.json, routes.json, places.json
const LAND = {}, ADM = [];
let AIR = [], CITY = [], SPOT = [];
let mask = null, MK = null;
function decode(arr, q) {
  const p = new Path2D(); let x = 0, y = 0;
  for (let i = 0; i < arr.length; i += 2) { x += arr[i]; y += arr[i + 1]; i ? p.lineTo(x / q, y / q) : p.moveTo(x / q, y / q); }

}
const proj = (lon, lat) => ({ x: (lon - M.proj.lon0) * M.proj.kx, y: -(lat - M.proj.lat0) * M.proj.ky });

  // 2km 격자: 1 = 한국 땅, 2 = 일본 땅
  const x0 = -820, y0 = -960, sc = 0.5, w = Math.ceil(2300 * sc), h = Math.ceil(2260 * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.setTransform(sc, 0, 0, sc, -x0 * sc, -y0 * sc);
  g.fillStyle = '#f00'; LAND.KOR.forEach(p => g.fill(p));
  g.fillStyle = '#0f0'; LAND.JPN.forEach(p => g.fill(p));
  const d = g.getImageData(0, 0, w, h).data, m = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) m[i] = d[i * 4] > 110 ? 1 : d[i * 4 + 1] > 110 ? 2 : 0;
  mask = m; MK = { x0, y0, sc, w, h };
}
function landAt(x, y) {
  const i = Math.floor((x - MK.x0) * MK.sc), j = Math.floor((y - MK.y0) * MK.sc);
  return i < 0 || j < 0 || i >= MK.w || j >= MK.h ? 0 : mask[j * MK.w + i];
}
const LANDC = { KOR: 1, JPN: 2 };
function canStand(x, y, c) {      // 땅이거나 땅에서 5km 안(좁은 해협·다리)
  const v = LANDC[c]; if (landAt(x, y) === v) return true;
  for (let a = 0; a < 8; a++) if (landAt(x + Math.cos(a * Math.PI / 4) * 5, y + Math.sin(a * Math.PI / 4) * 5) === v) return true;
  return false;
}

/* ---------- 노선 ---------- */
const AL = c => R.airlines[c] || c;
function destsFrom(code) {
  const out = {}, a = R.kr[code] ? 'kr' : 'jp';
  if (a === 'kr') {
    Object.assign(out, R.routes[code] || {});
    if (R.domestic.CJU.includes(code)) out.CJU = ['국내선'];
    if (code === 'CJU') R.domestic.CJU.forEach(k => out[k] = ['국내선']);
  } else {
    for (const k in R.routes) if (R.routes[k][code]) out[k] = R.routes[k][code];
  }
  return out;
}
function krFor(jp) { return Object.keys(R.routes).filter(k => R.routes[k][jp]); }
function seasonal(k, j, al) { return R.seasonal[`${k}-${j}-${al}`] || R.seasonal[`${j}-${k}-${al}`] || ''; }
function airName(c) { return (R.kr[c] || R.jp[c]).ko; }
function cityName(c) { return (R.kr[c] || R.jp[c]).city; }

/* ---------- 화면 크기 ---------- */
let W = 0, H = 0, DPR = 1, PIPS = 150;
function resize() {
  const vv = window.visualViewport;
  W = Math.min(innerWidth, document.documentElement.clientWidth || innerWidth);
  H = Math.min(...[innerHeight, document.documentElement.clientHeight, vv && Math.abs(vv.scale - 1) < .01 ? vv.height : 1e9].filter(v => v > 100));

  PIPS = Math.round(Math.max(120, Math.min(190, Math.min(W, H) * .34)));
  pip.style.width = pip.style.height = PIPS + 'px'; pip.width = pip.height = Math.round(PIPS * DPR);
  $('pipTxt').style.maxWidth = Math.max(PIPS + 30, 170) + 'px';
  document.documentElement.style.setProperty('--pipw', PIPS + 'px');
}
addEventListener('resize', resize); window.visualViewport && visualViewport.addEventListener('resize', resize);

/* ---------- 입력: 한 손가락 = 조이스틱, 두 손가락 = 확대·축소, 휠 = 확대·축소 ---------- */
let joy = null, pinch = null; const keys = new Set(), PTR = new Map();
const spanKey = () => S.mode === 'walk' || S.mode === 'ground' ? 'walk' : 'plane';
const far = () => S.span.walk >= CARV;
function setSpan(k, v) { S.span[k] = Math.max(SPAN[k][1], Math.min(SPAN[k][2], v)); }
function zoomBy(f) { const k = spanKey(); setSpan(k, S.span[k] * f); }
cv.addEventListener('pointerdown', e => {
  PTR.set(e.pointerId, { x: e.clientX, y: e.clientY }); cv.setPointerCapture(e.pointerId);
  if (PTR.size === 2) { const [a, b] = [...PTR.values()]; joy = null; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), span: S.span[spanKey()], k: spanKey() }; }

  else TAP = null;
});
let TAP = null;
cv.addEventListener('pointerup', e => {
  if (!TAP || PTR.size > 1) return; const t = TAP; TAP = null;
  if (Math.hypot(e.clientX - t.x, e.clientY - t.y) < 8 && performance.now() - t.t < 350) tapMap(e.clientX, e.clientY);
});

  if (!PTR.has(e.pointerId)) return; PTR.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && PTR.size >= 2) { const [a, b] = [...PTR.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (d > 10) setSpan(pinch.k, pinch.span * pinch.d / d); }

const endPtr = e => { PTR.delete(e.pointerId); if (joy && e.pointerId === joy.id) joy = null; if (PTR.size < 2) pinch = null; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);

$('bTarget').onclick = () => { S.span[spanKey()] = SPAN[spanKey()][0]; CAM.x = P.x; CAM.y = P.y; vib(10); save(); };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  keys.add(e.key.toLowerCase()); if (e.key.startsWith('Arrow')) e.preventDefault();
  if (e.key === '+' || e.key === '=') zoomBy(1 / 1.25); if (e.key === '-') zoomBy(1.25);
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => { keys.clear(); joy = null; pinch = null; PTR.clear(); });
function input() {
  let ix = 0, iy = 0;
  if (keys.has('arrowleft') || keys.has('a')) ix -= 1; if (keys.has('arrowright') || keys.has('d')) ix += 1;
  if (keys.has('arrowup') || keys.has('w')) iy -= 1; if (keys.has('arrowdown') || keys.has('s')) iy += 1;
  const k = Math.hypot(ix, iy); if (k) { ix /= k; iy /= k; }
  if (joy) { const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy); if (d > 6) { const m = Math.min(1, d / 55); ix = dx / d * m; iy = dy / d * m; } }
  return [ix, iy];
}

/* ---------- 상태 ---------- */
// S.mode: walk 걷기 · car 자동차 · ground 탑승(활주로) · takeoff 이륙 · plane 비행 · landing 착륙
const P = { x: S.pos.x, y: S.pos.y, vx: 0, vy: 0, hd: 0, trail: [], warnAt: {}, sheetFor: null, alt: 0, anim: null, skip: null, quiet: null, g: 0, gFor: null, gKind: null, gAt: null, bad: null };
const CAM = { x: P.x, y: P.y, z: 1 };
const FX = [];
const NEAR = { city: 9, spot: 1.6 };
// 닿기 규칙 하나: 화면에서 아이콘 반경 TOUCH px 안이면 닿음 — 명소·깃발·공항 탑승·비행기 착륙 모두 같음.
// 멀리 볼 때 22px가 수십 km라 시내에서 탑승되던 것 → 공항 탑승은 보이는 거리 AIR_DEEP km 이하로 확대했을 때만(명소·깃발은 DEEP)
const TOUCH = 22, AIR_DEEP = 60;
const touchR = () => TOUCH / CAM.z;
const airR = touchR, askR = touchR;
const FLY = m => m === 'ground' || m === 'takeoff' || m === 'plane' || m === 'landing';
const GAUGE = { board: 1.5, land: 1.2 };
const GCOL = { board: '#e8594f', land: '#3fa66b' };
const ICON = { castle: '🏯', garden: '🌳', temple: '🛕', shrine: '⛩️', museum: '🏛️', island: '🏝️', theater: '🎭', aquarium: '🐟', onsen: '♨️', bridge: '🌉', view: '🏞️', sea: '🌊', valley: '🏞️' };

function toast(msg, ms = 2600) {
  const t = document.createElement('div'); t.className = 't'; t.textContent = msg; $('toast').appendChild(t);
  while ($('toast').children.length > 3) $('toast').firstChild.remove();
  setTimeout(() => t.remove(), ms);
}
function puff(x, y, n = 18) { if (RM) n = 6; for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 20 + Math.random() * 60; FX.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: .7 + Math.random() * .4, r: 6 + Math.random() * 8 }); } }
const airport = code => AIR.find(a => a.code === code);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function nearest(list, maxD, filter) {
  let best = null, bd = maxD;
  for (const a of list) { if (filter && !filter(a)) continue; const d = Math.hypot(a.x - P.x, a.y - P.y); if (d < bd) { bd = d; best = a; } }
  return best;
}
const nearestAirport = (d, f) => nearest(AIR, d, f);
function canFly(a) { const m = R.kr[a.code] || R.jp[a.code]; return !m.closed && Object.keys(destsFrom(a.code)).length > 0; }

/* ---------- 정보 창 ---------- */
function chips(list, k, j) {
  return list.map(c => { if (c === '국내선') return `<span class="al">국내선</span>`; const s = k && j ? seasonal(k, j, c) : ''; const ex = c === 'OZ' || s; return `<span class="al${ex ? ' ex' : ''}">${AL(c)}${s ? ' · ' + s : c === 'OZ' ? ' · 12/17 종료' : ''}</span>`; }).join('');
}
const NOTE = () => `<div class="note">노선: ${R.source}, ${R.checked} 확인. 예약 전 항공사에서 다시 확인하세요.</div>`;
const PNOTE = () => `<div class="note">${PL.source} (${PL.checked})</div>`;
const HINT = t => `<div class="hint" hidden>${t}</div>`;   // 사용법은 숨겨 두고 ⓘ로 펼침
function openSheet(head, body, key, kind) {
  locT = 0; const sh = $('sheet');
  const info = body.includes('class="hint"') ? `<button class="info" onclick="toggleHint()" aria-label="사용법">i</button>` : '';
  const i = head.indexOf('<button class="cbtn"'), title = i < 0 ? head : head.slice(0, i), cb = i < 0 ? '' : head.slice(i);
  sh.innerHTML = `<div class="top"><div class="grab"></div><div class="hd">${title}${cb || info ? `<div class="side">${cb}${info}</div>` : ''}</div></div>` + body;

}

window.xClose = () => { const c = P.sheetFor; closeSheet(); P.closedFor = c; $('sheet').style.transform = ''; };
window.toggleHint = () => { const h = $('sheet').querySelector('.hint'), b = $('sheet').querySelector('.info'); if (h) { h.hidden = !h.hidden; b.classList.toggle('on', !h.hidden); } };

function sheetAirport(a, how) {
  const meta = R.kr[a.code] || R.jp[a.code], fly = canFly(a);
  const head = `<h2>${a.c === 'KOR' ? '✈️' : '🛬'} ${meta.ko}</h2>` + (how === 'land' && P.lastFrom ? `<button class="cbtn" onclick="cancelLanding()">↩ 착륙 취소</button>` : '');
  let h = a.c === 'KOR' ? `<div class="sub">${meta.pref || a.pref} · ${a.code}</div>` : `<div class="sub">${meta.ja} · ${a.pref} · ${a.code}</div>`;
  if (meta.closed) h += `<div class="warn">⛔ ${meta.closed}</div>`;
  const lotTip = '';
  if (how === 'land') h += HINT('🚶 걸어서 둘러보세요 · 공항을 벗어나면 도착 확정' + lotTip + (fly ? ' · 다시 와서 서 있으면 탑승 게이지가 차요' : ''));
  else if (how === 'cancel' || (fly && P.quiet === a.code)) h += HINT('✕ 탑승을 취소했어요 · 공항을 벗어났다 다시 오면 탑승 게이지가 차요');
  else if (fly) h += HINT('⭕ 가만히 서 있으면 돋보기 테두리가 차올라요 · 꽉 차면 탑승 · 움직이면 취소' + lotTip);
  if (a.c === 'KOR') {

      h += ks.map(j => `<div class="rt"><b>${R.jp[j].city}</b><div>${chips(r[j], a.code, j)}</div></div>`).join('');

    }

    h += `<div class="sub">한국에서 오는 직항</div>` + krFor(a.code).map(k => `<div class="rt"><b>${R.kr[k].city}</b><div>${chips(R.routes[k][a.code], k, a.code)}</div></div>`).join('');

    else { const ne = M.places.filter(p => p.c === 'JPN' && Math.hypot(p.x - a.x, p.y - a.y) < 90).slice(0, 6); if (ne.length) h += `<div class="rt"><b>주변 도시</b><div>${ne.map(p => `<span class="al">${p.ko.replace(/시$/, '')}</span>`).join('')}</div></div>`; }
    if (!near.length) h += `<div class="soon">🔦 이 지역 도시·명소는 아직 준비 중이에요 (지금은 시코쿠부터).</div>`;
  }
  openSheet(head, h + NOTE(), 'air:' + a.code, how === 'land' ? 'land' : 'air');
}
function sheetGround(a) {
  const d = destsFrom(a.code), dom = k => d[k][0] === '국내선' ? 1 : 0, ks = Object.keys(d).sort((x, y) => dom(x) - dom(y) || d[y].length - d[x].length);
  const head = `<h2>🎫 탑승 · ${cityName(a.code)}</h2><button class="cbtn" onclick="cancelBoard()">✕ 탑승 취소</button>`;
  let h = HINT('🛫 화면을 끄는 방향으로 이륙해요(이륙하면 취소 없음) · 점선 끝 공항 위에 머무르면 착륙 게이지가 차요');
  h += `<div class="sub">갈 수 있는 곳 ${ks.length}곳</div>`;
  h += ks.map(k => { const m = R.kr[k] || R.jp[k]; return `<div class="rt"><b>${m.city}</b><div>${chips(d[k], a.code, k)}</div></div>`; }).join('');
  openSheet(head, h + NOTE(), 'ground:' + a.code, 'ground');
}
function sheetCity(c) {

  const el = $('pkInfo'); if (el) { const ll = unproj(P.pick.x, P.pick.y), a = admAt(P.pick.x, P.pick.y); el.textContent = `${P.pick.name ? P.pick.name + ' · ' : ''}${ll.lat.toFixed(5)}, ${ll.lon.toFixed(5)}${a ? ' · ' + a.ko : ''}`; }
}
function drawPick(g, cx, cy, t) {
  if (!P.pick) return;
  const x = cx + (P.pick.x - CAM.x) * CAM.z, y = cy + (P.pick.y - CAM.y) * CAM.z, k = (Math.sin(t * 5) + 1) / 2;
  g.strokeStyle = '#e8594f'; g.lineWidth = 2.5;
  g.beginPath(); g.arc(x, y, 16 + 3 * k, 0, 6.29); g.stroke();
  g.beginPath(); g.moveTo(x - 30, y); g.lineTo(x - 8, y); g.moveTo(x + 8, y); g.lineTo(x + 30, y); g.moveTo(x, y - 30); g.lineTo(x, y - 8); g.moveTo(x, y + 8); g.lineTo(x, y + 30); g.stroke();
  g.fillStyle = '#e8594f'; g.beginPath(); g.arc(x, y, 3, 0, 6.29); g.fill();
  g.font = '22px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'bottom'; g.globalAlpha = .55; g.fillText('🚩', x + 9, y - 6); g.globalAlpha = 1;
}


// 지도를 톡 누르면: 근처 명소 핀(머리)·깃발이면 카드(멀리서도 '가고 싶어요' 표시)
function tapMap(x, y) {
  if (S.mode !== 'walk' || !$('sheet').hidden && P.sheetKind === 'flagform') return;
  const cx = W / 2, cy = H * CY, span = Math.min(W, H) / CAM.z;
  let best = null, bd = 26;
  if (span <= CARV * 1.1) for (const s of SPOT) {
    const sx = cx + (s.x - CAM.x) * CAM.z, sy = cy + (s.y - CAM.y) * CAM.z - 12 * 1.55, d = Math.hypot(sx - x, sy - y);
    if (d < bd) { bd = d; best = { type: 'spot', s, key: 'spot:' + s.key }; }
  }
  for (const r of FLAGS) {
    const fk = span > CARV ? .75 : 1, sx = cx + (r.x - CAM.x) * CAM.z, sy = cy + (r.y - CAM.y) * CAM.z - 12 * 1.55 * fk, d = Math.hypot(sx - x, sy - y);
    if (d < bd) { bd = d; best = { type: 'flag', rt: r, key: 'flag:' + r.f.id }; }
  }
  if (!best) return;
  joy = null; P.remote = best.key; P.remoteAt = { x: P.x, y: P.y }; SFX.chime();
  if (best.type === 'spot') { best.s.hit = performance.now(); peek(best.key, '', () => sheetSpot(best.s), { type: 'spot', s: best.s, remote: true }); }
  else peek(best.key, '', () => sheetFlag(best.rt), { type: 'flag', rt: best.rt, remote: true });
}
/* ---------- 🏅 나의 여행 기록 ---------- */
let MTAB = 'spot';
const dstr = t => t > 1 ? new Date(t).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' }) : '';
function renderMedals() {
  const seenN = SPOT.filter(x => S.seen[x.key]).length, airN = Object.keys(S.stamps).length;
  $('mSum').innerHTML = `<div><b>${S.pts || 0}</b>포인트</div><div><b>${seenN}/${SPOT.length}</b>다녀온 명소</div><div><b>${Object.keys(S.wish).length}</b>가고 싶어요</div><div><b>${S.flags.length}</b>내 깃발</div>`;
  document.querySelectorAll('.mtabs button').forEach(b => b.classList.toggle('on', b.dataset.t === MTAB));
  let h = '';
  if (MTAB === 'spot') {
    const prefs = [...new Set(CITY.map(c => c.pref))];
    for (const pf of prefs) {
      const cs = CITY.filter(c => c.pref === pf), all = cs.flatMap(c => c.spots), got = all.filter(x => S.seen[x.key]).length;
      h += `<div class="mg">${pf}<small>${got}/${all.length}</small><span class="bar"><i style="width:${all.length ? got / all.length * 100 : 0}%"></i></span></div>`;
      for (const c of cs) {
        const g2 = c.spots.filter(x => S.seen[x.key]).length;
        h += `<div class="mc">🏙️ ${c.ko} <small>${g2}/${c.spots.length}</small>${g2 === c.spots.length ? ' 🏆' : ''}</div>`;
        const rank = x => S.seen[x.key] ? 2 : S.wish[x.key] ? 1 : 0;
        h += c.spots.slice().sort((a, b) => rank(b) - rank(a)).map(x => { const t = S.seen[x.key], w = S.wish[x.key];
          return `<div class="mr ${t ? 'ok' : w ? '' : 'no'}" data-spot="${x.key}"><span class="ic">${t ? '✔' : w ? '💭' : ICON[x.t] || '📍'}</span><b>${x.ko}</b><i>${t ? '다녀옴 ' + dstr(t) : w ? '가고 싶어요' : x.ferry ? '⛴️ 페리' : '아직'}</i>${t ? '' : `<button class="hb${w ? ' on' : ''}" data-wish="${x.key}" aria-label="가고 싶어요">♥</button>`}</div>`; }).join('');
      }
    }
  } else if (MTAB === 'air') {
    const ks = Object.keys(S.stamps).sort((a, b) => S.stamps[b] - S.stamps[a]);
    if (!ks.length) h = `<div class="empty">아직 착륙한 공항이 없어요.<br>공항에 서 있으면 탑승 게이지가 차요 ✈️</div>`;
    for (const [lab, test] of [['🇯🇵 일본', c => R.jp[c]], ['🇰🇷 한국', c => R.kr[c]]]) {
      const list = ks.filter(test); if (!list.length) continue;
      const total = Object.keys(lab.includes('일본') ? R.jp : R.kr).length;
      h += `<div class="mg">${lab}<small>${list.length}/${total}</small><span class="bar"><i style="width:${list.length / total * 100}%"></i></span></div>`;
      h += list.map(c => `<div class="mr ok" data-air="${c}"><span class="ic">🛬</span><b>${airName(c)}</b><i>${dstr(S.stamps[c])}</i></div>`).join('');
    }
  } else {
    if (!S.flags.length) h = `<div class="empty">아직 꽂은 깃발이 없어요.<br>🔍 버튼으로 장소를 찾아 🚩 깃발로 맛집·가게·숙소를 기록해 보세요</div>`;
    for (const [k, c] of Object.entries(CATS)) {
      const list = S.flags.filter(f => f.cat === k).sort((a, b) => b.created - a.created); if (!list.length) continue;
      const been = list.filter(f => f.status === 'been').length;
      h += `<div class="mg">${c[0]} ${c[1]}<small>${list.length}곳 · 다녀옴 ${been}</small></div>`;
      h += list.map(f => `<div class="mr ${f.status === 'been' ? 'ok' : ''}" data-flag="${f.id}"><span class="ic">${f.status === 'been' ? '✔' : '💭'}</span><b>${esc(f.name)}</b><i>${f.star ? '★'.repeat(f.star) + ' · ' : ''}${dstr(f.created)}</i></div>`).join('');
    }
  }
  $('mList').innerHTML = h;
}
// 기록 지우기: 탭별(포인트는 그대로) · 전체(명소·공항·깃발·포인트, 가족 설정·위치는 그대로)
$('mResetTab').onclick = () => {
  const nm = { spot: '명소 기록(다녀왔어요·가고 싶어요)', air: '공항 착륙 기록', flag: '내 깃발' }[MTAB];
  if (!confirm(`${nm}을(를) 모두 지울까요? 되돌릴 수 없어요. (포인트는 그대로)`)) return;
  if (MTAB === 'spot') { S.seen = {}; S.wish = {}; S.lock = {}; } else if (MTAB === 'air') S.stamps = {}; else { S.flags = []; FLAGS.length = 0; }
  save(); closeSheet(); renderMedals(); toast(`${nm}을(를) 지웠어요`);
};
$('mResetAll').onclick = () => {
  if (!confirm('명소 기록, 공항 착륙, 내 깃발, 포인트를 모두 처음으로 돌릴까요? 되돌릴 수 없어요.\n(가족 설정·지금 위치는 그대로)')) return;
  S.seen = {}; S.wish = {}; S.paid = {}; S.lock = {}; S.stamps = {}; S.flags = []; FLAGS.length = 0; S.pts = 0; $('ptsN').textContent = 0;
  save(); closeSheet(); renderMedals(); toast('기록을 모두 처음으로 돌렸어요');
};
$('pts').onclick = () => { MTAB = 'spot'; renderMedals(); $('medals').hidden = false; };
$('mClose').onclick = () => { $('medals').hidden = true; };
document.querySelectorAll('.mtabs button').forEach(b => b.onclick = () => { MTAB = b.dataset.t; renderMedals(); $('mList').scrollTop = 0; });
$('mList').onclick = e => {
  const hb = e.target.closest('[data-wish]');
  if (hb) { const k = hb.dataset.wish; if (S.wish[k]) delete S.wish[k]; else { S.wish[k] = Date.now(); SFX.pop(); } save(); const sc = $('mList').scrollTop; renderMedals(); $('mList').scrollTop = sc; return; }
  const r = e.target.closest('.mr'); if (!r) return;
  $('medals').hidden = true; P.closedFor = null;
  if (r.dataset.spot) sheetSpot(SPOT.find(x => x.key === r.dataset.spot));
  else if (r.dataset.flag) sheetFlag(FLAGS.find(x => x.f.id === r.dataset.flag));
  else if (r.dataset.air) sheetAirport(airport(r.dataset.air));
  P.pinned = true;   // 목록에서 연 창은 멀리 있어도 바로 안 닫히게
};
/* ---------- 설정 화면 ---------- */
let draftN = S.party.length, draft = S.party.map(m => ({ ...m }));
function renderSetup() {
  $('nVal').textContent = draftN;
  while (draft.length < draftN) draft.push(...defParty(draft.length + 1).slice(draft.length).map(m => ({ ...m, col: COLORS[draft.length % COLORS.length] })));
  const box = $('mems'); box.innerHTML = '';
  draft.slice(0, draftN).forEach(m => {
    const row = document.createElement('div'); row.className = 'mem';
    row.innerHTML = `<button class="dot" style="background:${m.col}" aria-label="색"></button>
      <input maxlength="10" placeholder="이름·별명" value="${(m.name || '').replace(/"/g, '&quot;')}">
      <select>${RELS.map(r => `<option${r === m.rel ? ' selected' : ''}>${r}</option>`).join('')}</select>
      <select>${AGES.map(r => `<option${r === m.age ? ' selected' : ''}>${r}</option>`).join('')}</select>`;
    const [dot, inp, rel, age] = row.children;
    dot.onclick = () => { m.col = COLORS[(COLORS.indexOf(m.col) + 1) % COLORS.length]; dot.style.background = m.col; };
    inp.oninput = () => m.name = inp.value.trim(); rel.onchange = () => m.rel = rel.value; age.onchange = () => m.age = age.value;
    box.appendChild(row);
  });
}
$('nMinus').onclick = () => { draftN = Math.max(1, draftN - 1); renderSetup(); };
$('nPlus').onclick = () => { draftN = Math.min(8, draftN + 1); renderSetup(); };
$('goBtn').onclick = () => {
  S.party = draft.slice(0, draftN).map(m => ({ ...m, name: m.name || m.rel }));
  const first = !S.started; S.started = true; save(); $('setup').hidden = true;
  if (first) toast('🚗 차로 공항까지 가요 · 화면을 끌어서 움직이고, 두 손가락으로 확대·축소(⌖ = 기본 비율)', 4600);
  else toast(`${S.party.length}명 출발 준비 완료`);
};
$('bParty').onclick = () => { draftN = S.party.length; draft = S.party.map(m => ({ ...m })); renderSetup(); $('setup').hidden = false; };
function renderInts() {
  const box = $('ints'); box.innerHTML = '';
  S.ints.forEach((it, i) => {
    const nm = INTERESTS.find(x => x[0] === it.k)[1];
    const row = document.createElement('div'); row.className = 'int';
    row.innerHTML = `<span class="nm">${nm}</span><button aria-label="위로">▲</button><button aria-label="아래로">▼</button><button class="sw${it.on ? ' on' : ''}" aria-label="켜기"></button>`;
    const [, up, dn, sw] = row.children;
    up.onclick = () => { if (i) { [S.ints[i - 1], S.ints[i]] = [S.ints[i], S.ints[i - 1]]; save(); renderInts(); } };
    dn.onclick = () => { if (i < S.ints.length - 1) { [S.ints[i + 1], S.ints[i]] = [S.ints[i], S.ints[i + 1]]; save(); renderInts(); } };
    sw.onclick = () => { it.on = !it.on; if (!S.ints.some(x => x.on)) it.on = true; save(); renderInts(); };
    box.appendChild(row);
  });
}
const soundLbl = () => $('soundBtn').textContent = S.sound === false ? '🔇 소리 꺼짐' : '🔊 소리 켜짐';
$('soundBtn').onclick = () => { S.sound = S.sound === false; save(); soundLbl(); if (S.sound) SFX.coin(); };
$('bSet').onclick = () => { renderInts(); soundLbl(); $('settings').hidden = false; };
$('setClose').onclick = () => { $('settings').hidden = true; const k = P.sheetFor; if (k) { closeSheet(); P.closedFor = null; } };
$('resetBtn').onclick = () => { if (confirm('가족 설정·여행 기록·위치를 모두 지우고 처음부터 할까요?')) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } };
$('bHome').onclick = () => location.href = '/';
// 창 위쪽(손잡이·제목 줄)을 아래로 쓸어내리면 닫힘
(() => {
  const sh = $('sheet'); let d = null;
  sh.addEventListener('pointerdown', e => { if (!e.target.closest('.top') || e.target.closest('button')) return; d = { id: e.pointerId, y: e.clientY, dy: 0 }; sh.setPointerCapture(e.pointerId); sh.style.transition = 'none'; });
  sh.addEventListener('pointermove', e => { if (!d || e.pointerId !== d.id) return; d.dy = Math.max(0, e.clientY - d.y); sh.style.transform = `translateX(-50%) translateY(${d.dy}px)`; });
  const end = e => { if (!d || e.pointerId !== d.id) return; const close = d.dy > 60; d = null; sh.style.transition = 'transform .18s'; if (close) { sh.style.transform = 'translateX(-50%) translateY(110%)'; setTimeout(xClose, 170); } else sh.style.transform = ''; };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
})();
// 돋보기 누르면 지금 상황 창 다시 열기
$('pip').addEventListener('click', () => {
  P.closedFor = null;
  if (S.mode === 'ground') return sheetGround(airport(S.from));
  if (S.mode !== 'walk') return;
  if (PEEK) { PEEK.open(); $('peek').hidden = true; return; }   // 아래 제목 띠에 떠 있는 것 먼저
  const spot = !far() ? nearest(SPOT, NEAR.spot) : null, air = nearestAirport(airR(), a => a.c === S.country), city = nearest(CITY, NEAR.city * 1.3);
  if (spot) sheetSpot(spot); else if (air) sheetAirport(air, P.lastFrom && P.quiet === air.code ? 'land' : undefined); else if (city) sheetCity(city);
  else { const c = nearest(CITY, 400); if (c) { sheetCity(c); } else toast('공항·도시 근처에서 누르면 정보가 열려요'); }
});
// 위쪽 상태 칸 = 새로 읽기
$('loc').onclick = () => { S.pos = { x: P.x, y: P.y }; save(); location.replace(location.pathname + '?r=' + Date.now()); };

/* ---------- 시작 ---------- */
let last = 0;
function frame(ts) {
  const t = ts / 1000, dt = Math.min(.05, last ? t - last : 0); last = t;
  if ($('setup').hidden && $('settings').hidden && $('medals').hidden) step(dt); else { P.vx = P.vy = 0; }
  draw(t); requestAnimationFrame(frame);
}
(async () => {
  resize();
  const [m, r, pl] = await Promise.all(['map.json', 'routes.json', 'places.json'].map(f => fetch(f).then(x => x.json())));
  M = m; R = r; PL = pl;
  for (const k in M.land) LAND[k] = M.land[k].map(a => decode(a, M.proj.q));
  for (const a of M.adm) ADM.push({ ko: a.ko, ja: a.ja, c: a.c, lx: a.lx, ly: a.ly, p: a.r.map(x => decode(x, M.proj.q)) });
  AIR = Object.entries(M.airports).map(([code, a]) => ({ code, ...a, pref: (R.kr[code] && R.kr[code].pref) || a.pref }));
  buildMask();
  CITY = PL.cities.map(c => ({ ...c, ...proj(c.lon, c.lat), c: 'JPN' }));
  for (const c of CITY) { c.spots = c.spots.map((s, i) => ({ ...s, ...proj(s.lon, s.lat), city: c.id, key: c.id + ':' + i })); SPOT.push(...c.spots); }
  FLAGS.push(...S.flags.map(f => flagRT(f)));
  $('ptsN').textContent = S.pts || 0;
  if (FLY(S.mode) && !S.from) S.mode = 'walk';
  if (S.mode === 'takeoff') S.mode = 'ground';
  if (S.mode === 'landing') S.mode = 'plane';
  P.alt = S.mode === 'plane' ? 1 : 0;
  if (S.mode === 'walk' && !canStand(P.x, P.y, S.country) && !AIR.some(a => dist(a, P) < 22)) { P.x = SEOUL.x; P.y = SEOUL.y; S.country = 'KOR'; }
  const span0 = FLY(S.mode) ? S.span.walk + (S.span.plane - S.span.walk) * P.alt : S.span.walk;
  CAM.x = P.x; CAM.y = P.y; CAM.z = Math.min(W, H) / span0;
  if (S.mode === 'ground') { const a = airport(S.from); P.x = a.x; P.y = a.y; sheetGround(a); }
  if (!S.started) { renderSetup(); $('setup').hidden = false; }
  requestAnimationFrame(frame);
})();
</script>

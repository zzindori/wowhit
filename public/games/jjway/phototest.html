<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>jjWay 사진 위치 시험</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fb;color:#222a3a;font:15px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 6px}
.lead{margin:0 0 12px;color:#556}
.pick{display:block;background:#2f6fde;color:#fff;font-weight:700;text-align:center;border-radius:12px;padding:13px;margin:8px 0;cursor:pointer}
.pick.alt{background:#fff;color:#2f6fde;border:2px solid #2f6fde}
.pick small{display:block;font-weight:400;font-size:12px;opacity:.85}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
#sum{display:none;background:#fff;border:2px solid #d8deea;border-radius:12px;padding:10px 12px;margin:12px 0}
#sum b{font-size:17px}
.good{color:#14803c}.bad{color:#c0392b}.mid{color:#a86a00}
.ph{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px;margin:6px 0}
.ph img{width:60px;height:60px;object-fit:cover;border-radius:8px;background:#e6e9f0;flex:none}
.ph div{min-width:0;overflow-wrap:anywhere;font-size:13px}
.ph b{display:block;font-size:14px}
h2{font-size:16px;margin:16px 0 4px}
.grp{background:#fff;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:14px}
.note{font-size:12px;color:#667;margin-top:16px}
</style>
</head>
<body>
<main>
<h1>📷 사진 위치 시험</h1>
<p class="lead">이 브라우저에서 사진의 찍은 위치를 읽을 수 있는지 봅니다. 사진은 <b>이 폰 안에서만 읽고 어디에도 올리지 않아요.</b></p>
<label class="pick">① 갤러리에서 고르기<small>기본 사진 선택 창</small><input id="a" type="file" accept="image/*" multiple></label>
<label class="pick alt">② 내 파일에서 고르기<small>①에서 위치가 안 나오면 이것도 해 보세요 · DCIM/Camera 폴더</small><input id="b" type="file" multiple></label>
<div id="sum"></div>
<div id="out"></div>
<p class="note">위치를 켜고 찍은 사진으로 시험해 주세요. 메신저로 받거나 캡처한 사진은 원래 위치가 없어요.</p>
</main>
<script>
const NEAR_M = 50;
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 사진 안에서 EXIF 찾기: JPEG·HEIC 모두 'Exif\0\0' 다음이 TIFF 머리(II*\0 또는 MM\0*)
function findTiff(b) {
  for (let i = 0; i + 10 < b.length; i++) {
    if (b[i] !== 0x45 || b[i + 1] !== 0x78 || b[i + 2] !== 0x69 || b[i + 3] !== 0x66 || b[i + 4] || b[i + 5]) continue;
    const t = i + 6;
    if ((b[t] === 0x49 && b[t + 1] === 0x49 && b[t + 2] === 42 && b[t + 3] === 0) || (b[t] === 0x4d && b[t + 1] === 0x4d && b[t + 2] === 0 && b[t + 3] === 42)) return t;
  }
  return -1;
}
function readExif(buf) {
  const b = new Uint8Array(buf), t = findTiff(b);
  if (t < 0) return { exif: false };
  const dv = new DataView(buf, t), le = b[t] === 0x49;
  const u16 = o => dv.getUint16(o, le), u32 = o => dv.getUint32(o, le);
  const SIZE = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 };
  const ifd = off => {   // 태그 → 값 위치·개수
    const m = new Map(), n = u16(off);
    for (let i = 0; i < n; i++) {
      const e = off + 2 + i * 12, tag = u16(e), type = u16(e + 2), cnt = u32(e + 4), sz = (SIZE[type] || 1) * cnt;
      m.set(tag, { type, cnt, at: sz <= 4 ? e + 8 : u32(e + 8) });
    }
    return m;
  };
  const str = v => { let s = ''; for (let i = 0; i < v.cnt; i++) { const c = dv.getUint8(v.at + i); if (!c) break; s += String.fromCharCode(c); } return s; };
  const rat = (v, i) => { const d = u32(v.at + i * 8 + 4); return d ? u32(v.at + i * 8) / d : 0; };
  const out = { exif: true };
  try {
    const i0 = ifd(u32(4));
    const ex = i0.get(0x8769);
    if (ex) { const e = ifd(u32(ex.at)), d = e.get(0x9003); if (d) out.date = str(d).replace(/^(\d{4}):(\d\d):(\d\d)/, '$1-$2-$3'); }
    const gp = i0.get(0x8825);
    if (gp) {
      const g = ifd(u32(gp.at));
      out.gps = g.size > 0;
      const la = g.get(2), lo = g.get(4);
      if (la && lo && la.cnt >= 3 && lo.cnt >= 3) {
        const dms = v => rat(v, 0) + rat(v, 1) / 60 + rat(v, 2) / 3600;
        let lat = dms(la), lon = dms(lo);
        if (g.get(1) && str(g.get(1)) === 'S') lat = -lat;
        if (g.get(3) && str(g.get(3)) === 'W') lon = -lon;
        if (lat || lon) { out.lat = lat; out.lon = lon; }
      }
    }
  } catch (e) { out.broken = true; }
  return out;
}
function metres(a, b) {
  const R = 6371000, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function groupNear(list) {   // 서로 이어지는 NEAR_M 안의 사진을 한 묶음으로
  const left = [...list], groups = [];
  while (left.length) {
    const g = [left.shift()];
    for (let i = 0; i < g.length; i++) for (let j = left.length - 1; j >= 0; j--) if (metres(g[i], left[j]) <= NEAR_M) g.push(left.splice(j, 1)[0]);
    groups.push(g);
  }
  return groups;
}
function verdict(r) {
  if (r.lat !== undefined) return ['위치 있음', 'good'];
  if (r.gps) return ['위치가 지워져 있음', 'bad'];
  if (r.exif) return ['위치 정보 없음', 'mid'];
  return ['사진 정보(EXIF) 없음', 'mid'];
}
async function run(input, how) {
  const files = [...input.files];
  if (!files.length) return;
  const sum = $('sum'), out = $('out');
  sum.style.display = 'block'; sum.textContent = `읽는 중… (${files.length}장)`; out.textContent = '';
  const rows = [];
  for (const f of files) {
    let r;
    try { r = readExif(await f.arrayBuffer()); } catch (e) { r = { exif: false, broken: true }; }
    r.name = f.name; r.type = f.type; r.url = URL.createObjectURL(f);
    rows.push(r);
  }
  const has = rows.filter(r => r.lat !== undefined), wiped = rows.filter(r => r.lat === undefined && r.gps).length;
  const cls = has.length === rows.length ? 'good' : has.length ? 'mid' : 'bad';
  sum.innerHTML = `<b class="${cls}">${esc(how)}: ${rows.length}장 중 ${has.length}장 위치 읽음</b>` + (wiped ? `<div class="bad">${wiped}장은 위치 칸이 있는데 값이 지워져 있어요(브라우저·폰이 지운 것으로 보여요).</div>` : '') + `<div>${esc(navigator.userAgent.match(/SamsungBrowser\/[\d.]+|Chrome\/[\d.]+|Safari\/[\d.]+|Firefox\/[\d.]+/)?.[0] || '')}</div>`;
  let h = rows.map(r => {
    const [t, c] = verdict(r);
    const pos = r.lat !== undefined ? `${r.lat.toFixed(5)}, ${r.lon.toFixed(5)} · <a href="https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lon}" target="_blank" rel="noopener">지도에서 보기</a>` : '';
    return `<div class="ph"><img alt="" src="${r.url}"><div><b class="${c}">${t}</b>${esc(r.name)}${r.type ? ' · ' + esc(r.type) : ''}${r.date ? '<br>찍은 때 ' + esc(r.date) : ''}${pos ? '<br>' + pos : ''}</div></div>`;
  }).join('');
  if (has.length > 1) {
    const gs = groupNear(has);
    h += `<h2>${NEAR_M}m로 묶으면 마커 ${gs.length}개</h2>` + gs.map((g, i) => `<div class="grp"><b>마커 ${i + 1}</b> · ${g.length}장 — ${g.map(x => esc(x.name)).join(', ')}</div>`).join('');
  }
  out.innerHTML = h;
  input.value = '';
}
$('a').onchange = e => run(e.target, '갤러리');
$('b').onchange = e => run(e.target, '내 파일');
</script>
</body>
</html>

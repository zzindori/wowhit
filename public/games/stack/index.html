<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>층층이 · 쌓고 팔고, 빨리빨리!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 한 화면 게임: 캔버스 전체 + 위쪽 HUD. 단일 룩(밝은 모래색 바닥)으로 고정 */
:root{
  --ground:#d9ccb2; --ink:#2c2b35; --hud:#fffaf0; --cash:#4c9a66; --pad:#4f6390; --warn:#c2462f;
  --display:'Jua',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);overflow:hidden;font-family:var(--display);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.left{display:flex;flex-direction:column;gap:8px;min-width:0}
.chip{background:var(--hud);border-radius:999px;box-shadow:0 3px 0 rgba(44,43,53,.18)}
.money{padding:3px 12px 3px 4px;display:flex;align-items:center;gap:6px;font-size:16px;font-variant-numeric:tabular-nums;width:fit-content}
.money.full{color:var(--warn)}
.money.bump{animation:bump .2s ease-out}
@keyframes bump{40%{transform:scale(1.14)}}
.coin{width:20px;height:20px;border-radius:50%;background:var(--cash);color:var(--hud);display:grid;place-items:center;font-size:12px}
#slowChip{font-size:14px;padding:6px 12px;width:fit-content;background:var(--warn);color:var(--hud)}
#zones{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + var(--stackB,104px) + 52px);
  display:flex;flex-direction:column;align-items:flex-start;gap:5px;pointer-events:none}   /* 층 칩: 왼쪽 아래 세로, 최대 5개 */
#zones .chip{font-size:12px;min-width:30px;padding:4px 8px;color:var(--ink);flex:none;text-align:center;box-sizing:border-box}
#zones .chip.on{background:var(--pad);color:var(--hud)}
#zones .chip.warn{box-shadow:0 3px 0 rgba(44,43,53,.18),inset 0 0 0 3px #e8b923}
#zones .chip.danger{background:var(--warn);color:var(--hud);animation:blink .6s steps(2) infinite}
#zones .chip.danger::after{content:'!';margin-left:3px}
#zones .chip.full{background:#e8b923;color:var(--ink)}
#zones .chip.full::after{content:' ₩MAX';font-size:12px}
#zones .chip.broken{background:#5b6070;color:var(--hud)}
#zones .chip.broken::after{content:' 고장';font-size:12px}
#zones .chip.vip{background:#b58a12;color:var(--hud);animation:blink .6s steps(2) infinite}
#zones .chip.vip::after{content:' 건물주';font-size:12px}
#zones .chip.gold{background:#f4d35e;color:var(--ink)}
#zones .chip.gold::after{content:' 황금';font-size:12px}
#zones .chip.ruin{background:var(--warn);color:var(--hud);animation:blink .6s steps(2) infinite}
#zones .chip.ruin::after{content:' 고장!';font-size:12px}
#zones .chip.deliv{background:#3fa98a;color:var(--hud);animation:blink .6s steps(2) infinite}
#zones .chip.deliv::after{content:' 배달';font-size:12px}
@keyframes blink{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){#zones .chip.danger,#zones .chip.vip,#zones .chip.ruin,#zones .chip.deliv,.money.bump{animation:none}}
button:focus-visible,a:focus-visible{outline:3px solid var(--pad);outline-offset:2px}
#menuBtn{pointer-events:auto;font:inherit;font-size:14px;border:0;padding:8px 14px;color:var(--ink);cursor:pointer}
#panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);right:max(16px,env(safe-area-inset-right,0px));
  background:var(--hud);border-radius:16px;box-shadow:0 6px 0 rgba(44,43,53,.18);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:160px}
#panel button,#panel a{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;text-decoration:none}
#panel button:hover,#panel a:hover{background:rgba(79,99,144,.12)}
#panel .state{float:right;color:var(--pad);margin-left:12px}
#reset.armed{background:var(--warn);color:var(--hud)}
.hint,.toast{position:fixed;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(44,43,53,.82);color:var(--hud);
  padding:10px 18px;border-radius:14px;font-size:16px;text-align:center;pointer-events:none;text-wrap:balance}
.hint,.toast{bottom:calc(env(safe-area-inset-bottom,0px) + var(--stackB,104px))}
.orders{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--ordB,16px));box-sizing:border-box;
  width:min(360px,calc(100% - 32px));background:#e9f8f2;border:2px solid #3fa98a;border-radius:14px;padding:6px 12px;pointer-events:none;
  display:flex;flex-direction:column;gap:3px;font-size:14px;color:#2f6f5b;font-variant-numeric:tabular-nums}
.orders .low{color:var(--warn)}
.orders b{color:#1f6e57;font-weight:normal;background:#c8eee0;border-radius:6px;padding:0 5px}
.mission{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);box-sizing:border-box;
  width:min(360px,calc(100% - 32px));background:var(--hud);border-radius:16px;box-shadow:0 4px 0 rgba(44,43,53,.18);padding:10px 14px;
  pointer-events:none;display:flex;flex-direction:column;gap:5px}
.mrow{display:flex;gap:8px;align-items:center;font-size:16px;min-width:0}
.mlabel{background:var(--pad);color:var(--hud);border-radius:999px;padding:2px 9px;font-size:12px;flex:none}
.mrow.sub{font-size:13px;color:var(--pad);font-variant-numeric:tabular-nums}
.mbar{height:6px;border-radius:3px;background:rgba(44,43,53,.12);overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--cash);transition:width .25s}
.toast{background:var(--pad);transition:opacity .3s}
.toast.bad{background:var(--warn)}
.elev{position:fixed;top:calc(env(safe-area-inset-top,0px) + 170px);left:50%;transform:translateX(-50%);box-sizing:border-box;
  width:min(320px,calc(100% - 32px));background:#3b3f4a;color:var(--hud);border-radius:18px;padding:14px;box-shadow:0 6px 0 rgba(44,43,53,.25);
  display:flex;flex-direction:column;gap:10px}
.elev .etitle{font-size:16px;text-align:center}
.elev .ebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:40vh;overflow-y:auto}
.elev button{font:inherit;font-size:18px;border:0;border-radius:12px;padding:12px 0;background:#5b6070;color:var(--hud);cursor:pointer}
.elev button:disabled{background:#e8b923;color:var(--ink);cursor:default}
.elev button.warn{box-shadow:inset 0 0 0 3px #e8b923}
.elev button.danger{background:var(--warn)}
.elev button.full{box-shadow:inset 0 0 0 3px #e8b923;color:#ffe27a}
.elev button.broken{box-shadow:inset 0 0 0 3px #ffb3a6}
.elev button.vip{background:#b58a12}
.elev button.gold{background:#c9a227;color:var(--ink)}
.elev button.typing{outline:3px solid #fff;outline-offset:-3px}
.elev .ekey{font-size:12px;opacity:.75;text-align:center}
.elev button.ruin{background:var(--warn);box-shadow:inset 0 0 0 3px #ffb3a6}
.elev button.deliv{background:#3fa98a}
</style>
</head>
<body>
<canvas id="game" aria-label="층층이 게임 화면"></canvas>
<div class="hud">
  <div class="left">
    <div class="money chip"><span class="coin">₩</span><span id="money">0</span></div>
    <div id="slowChip" class="chip" hidden>🐢 건물주 화남 · 느려짐 <span id="slowSec">0</span>초</div>
    <div id="zones" aria-label="층 이동"></div>
  </div>
  <button id="menuBtn" class="chip" type="button" aria-expanded="false" aria-controls="panel">설정</button>
</div>
<div id="panel" hidden>
  <button id="sndBtn" type="button">소리 <span class="state" id="sndState">켬</span></button>
  <button id="vibBtn" type="button">진동 <span class="state" id="vibState">켬</span></button>
  <button id="thBtn" type="button">가게 미리보기 <span class="state" id="thState">층대로</span></button>
  <a href="/stack">게임 소개</a>
  <button id="reset" type="button">처음부터</button>
</div>
<div class="toast" id="toast" hidden></div>
<div class="elev" id="elev" hidden><div class="etitle">엘리베이터 · 몇 층으로 갈까요?</div><div class="ebtns" id="elevBtns"></div><div class="ekey" id="elevKey" hidden></div></div>
<div class="mission" id="mission" hidden>
  <div class="mrow"><span class="mlabel">미션</span><span id="mText"></span></div>
  <div class="mrow sub" id="mProg"></div>
  <div class="mbar"><i id="mBar"></i></div>
</div>
<div class="orders" id="orders" hidden></div>
<div class="hint" id="hint" hidden></div>

<script>
(() => {
// ================= 설정 (숫자만 바꿔서 밸런스 조절) =================
const CFG = {
  zoneH: 980, worldW: 760,
  spawnEvery: 1.5, spawnMax: 12,                 // 생산 간격(초), 생산기 앞 최대 개수
  baseValue: 4, valueMul: 5,                     // N층 물건 값 = 4 × 5^N
  zoneCost: 1000, zoneCostMul: 8,                // 다음 층 열기 = 1000 × 8^N
  zoneScale: 8,                                  // 층 안 비용 배수 (N층 = 1층 비용 × 8^N)
  spawnerCost: [0, 60, 240],
  workerMax: 3, workerCap: 4, workerSpeed: 95,   // 층당 일꾼 수, 일꾼 적재량, 속도
  sellMax: 5,
  prod:   { decay: 0.85, max: 5, cost: 60, mul: 2.2 },           // 생산속도(층마다): 생산 간격 × 0.85^Lv(Lv5 ≈ 0.67초), 손님도 같은 비율로 더 자주 옴
  bag:    { step: 2, max: 4, cost: 80, mul: 2.3 },                // 알바 가방(층마다): 일꾼 적재량 4 + 2 × Lv(최대 12개)
  shelf:  { step: 6, max: 4, cost: 70, mul: 2.2 },                // 보관대(층마다): 생산기 앞 최대 개수 12 + 6 × Lv(최대 36개)
  cap:    { base: 6, step: 2, cost: 25, mul: 1.6 },               // 적재량 (상한 없음)
  speed:  { base: 150, bonus: 130, decay: 0.85, cost: 35, mul: 1.7, max: 12 }, // 이동속도 (갈수록 덜 오름, Lv12 ≈ 262에서 MAX — 그 위는 비싸기만 하고 체감 없어서 칸이 사라짐)
  worker: { cost: 100, mul: 2.1 },
  sell:   { base: 0.45, decay: 0.78, cost: 40, mul: 1.8 },        // 손님에게 하나 건네는 간격
  cust:   { every: 4.5, patience: 14, maxLine: 5, want: [1, 3], speed: 80, tip: 0.2 }, // 손님: 등장 간격(생산기 수로 나눔), 참을성(초), 줄 길이, 사는 개수, 팁 비율
  wallet: { base: 500, mul: 2, costRate: 0.6 },    // 지갑 한도 = 500 × 2^레벨, 업그레이드 비용 = 현재 한도의 60%
  gold: { chance: 0.03, mul: 10, life: 60 },     // 황금: 생산 확률, 값 = 지금 최고층 물건 값 × 10, 60초 안에 안 가져가면 사라짐 (일꾼은 못 나름)
  direct: { mul: 2 },                            // 주인공이 직접 판매대에 내려놓은 물건 값 배수               // 황금 물건: 생산될 확률, 값 배수
  thief: { after: 12, chance: 0.3, speed: 115, take: 0.5, cooldown: 25, bounty: 15, lootBonus: 0.5 }, // 도둑: 돈더미를 몇 초 방치하면 나타날 수 있음, 초당 등장 확률, 속도, 훔치는 비율, 다음 등장까지 쉬는 시간
  padHold: 0.5,                                  // 업그레이드 칸에 몇 초 서 있어야 돈을 내기 시작하는지(지나가다 밟으면 안 냄)
  warpCost: 1500,                                // 엘리베이터(층 버튼으로 이동) 비용
  events: { first: 60, every: 50 },              // 층 이벤트(고장·VIP): 처음 몇 초 뒤부터, 평균 몇 초마다
  broken: { fixTime: 2, ruin: 120, warn: 30, rebuild: 100 }, // 수리: 앞에 몇 초 서 있기 / 고장 난 채로 몇 초 지나면 부서짐(몇 초 전부터 경고) / 다시 제작 비용(× 8^층)
  deliv: { time: 60, perFloor: 15, want: [2, 4], mul: 6, tip: 0.5 }, // 배달 주문: 기본 제한 시간 + 층 차이당 추가 초, 개수, 보상 = 개당 '지금 최고층 물건 값' × 6(황금처럼 아래층 배달도 값어치 있게), 절반 넘게 남기고 끝내면 배달팁 50%
  vip: { time: 40, want: [3, 6], mul: 5, goldMul: 5, slow: 10, slowSpd: 0.6 }, // VIP: 제한 시간(초), 원하는 개수, 보상 배수(물건 값 × 5), 황금을 건네면 그 물건만 또 × 5,
                                                 //      놓치면 10초 동안 일꾼 속도의 60%로 (업그레이드와 상관없이 일꾼보다 느림)
  autoCost: 1500,                                // 층 자동 수금 칸 비용 (× 8^층)
  away: { hours: [1, 2, 4, 8], cost: 300, mul: 4, rate: 0.5, min: 60 }, // 잔업: 단계별 최대 시간, 비용(× 4^단계 × 8^층), 자동으로 벌던 속도의 몇 %, 몇 초 이상 비워야 계산
  cashMax: 40,                                   // 돈더미 최대 장수(손님 결제 1번 = 1장, 금액과 무관). 꽉 차면 챙길 때까지 판매가 멈춤
  drawStackMax: 40                               // 등에 그려지는 최대 개수 (넘으면 숫자로 표시)
};

// ================= 그림 슬롯 =================
// 경로를 넣으면 도형 대신 그림으로 그림. 비워두거나 로딩 실패하면 도형 그대로.
// 투명 PNG, 위에서 비스듬히 본 시점, 바닥 중앙이 기준점. item0~item5는 층별 물건(6종 반복).
const ART_SRC = { player:'', worker:'', customer:'', thief:'', bill:'', machine:'', desk:'',
  item0:'', item1:'', item2:'', item3:'', item4:'', item5:'' };
const ART = {};
// 기본 생산기 = 3D 프린터 몸체(코드로 그린 SVG). 노즐 머리·빛·만들어지는 물건은 drawPrinter()가 움직이며 그림.
// ART_SRC.machine에 그림을 넣으면 그걸 우선 사용(예전 방식)
const PRN = new Image();
PRN.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="480" height="400"><defs><filter id="shd" x="-10%" y="-10%" width="130%" height="130%"><feGaussianBlur stdDeviation="2.4"/></filter> <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9dfe7"/><stop offset="1" stop-color="#93c4d0"/></linearGradient> <linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef9fb"/><stop offset="1" stop-color="#cfe9ef"/></linearGradient> <linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c8ecf5"/></linearGradient> <pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="12" fill="#f2c230"/><rect x="6" width="6" height="12" fill="#38445a"/></pattern></defs> <path d="M12 182 H230 V46 L240 55 V192 H24 Z" fill="#2c2b35" opacity=".26" filter="url(#shd)"/> <g stroke="#38445a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"> <path d="M20 98 H220 Q226 98 227 104 L230 150 H10 L13 104 Q14 98 20 98 Z" fill="#e4f3f6"/><path d="M16 145 H224" stroke="#fff" stroke-width="2" opacity=".7"/> <rect x="10" y="148" width="220" height="34" rx="8" fill="url(#b)"/><rect x="10" y="168" width="220" height="14" rx="6" fill="#f2a58c"/> <rect x="150" y="153" width="64" height="11" rx="3" fill="url(#h)" stroke-width="2.5"/> <rect x="20" y="58" width="44" height="92" rx="8" fill="url(#b)"/><path d="M24 50 Q24 44 30 44 L54 44 Q60 44 60 50 L64 60 L20 60 Z" fill="url(#t)"/> <rect x="27" y="70" width="30" height="24" rx="4" fill="#2f3b4f" stroke-width="3"/><path d="M31 87 L37 80 L43 84 L51 75" fill="none" stroke="#7ff0a8" stroke-width="2.5"/> <circle cx="33" cy="106" r="4" fill="#7ff0a8" stroke-width="2"/><circle cx="45" cy="106" r="4" fill="#f2c230" stroke-width="2"/> <rect x="27" y="116" width="30" height="8" rx="3" fill="#f2a58c" stroke-width="2.5"/><rect x="198" y="52" width="18" height="80" rx="5" fill="url(#b)"/> <rect x="54" y="34" width="168" height="22" rx="7" fill="#f2a58c"/><path d="M62 45 h150" stroke="#d98a70" stroke-width="2"/> <path d="M100 124 L168 124 L172 134 L96 134 Z" fill="url(#p)" stroke-width="3"/></g> <path d="M104 129 L166 129" stroke="#8fe3f0" stroke-width="2"/> <g fill="#fff" opacity=".5"><rect x="16" y="151" width="208" height="4" rx="2"/><rect x="24" y="62" width="36" height="4" rx="2"/></g></svg>`);
// 가게 생산기는 모두 같은 240×200 틀(위에서 본 넓은 작업대 `deck`)
const svgImg = svg => { const im = new Image(); im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); return im; };
// 1층 분식 조리대 3대(사용자 요청으로 분리): 0번 떡볶이 철판 · 1번 김밥 말이대 · 2번 순대 찜기. 받침·메뉴판은 공통 틀, 위 조리 도구만 다름.
// 프린터와 같은 틀(240×200, 0.625배)이라 충돌·물건 자리 계산을 같이 씀. 메뉴판 글자·움직이는 부분은 animTteok/animKimbap/animSundae가 그림
// 위에서 내려다본 넓은 작업대(사용자: '생산기를 위에서 본 듯이 책상을 넓게') — 윗판 y 44~134, 앞판 132~182, 뒤 가장자리에 메뉴판(52~188 × 4~40, 글자 23).
// 완성된 물건은 오른쪽 앞 쟁반(172~222 × 106~126) 위에 생김(spot [197, 122])
// tilt(0~1): 45도처럼 — 윗판(v 44~134)을 앞 모서리(134) 기준으로 납작하게(× tilt), 메뉴판은 그만큼 내려옴(+ 90×(1-tilt)), 앞판은 그대로. under = 윗판 그림 밑에 깔리는 도구 옆면(두께)

let VW = 0, VH = 0, DPR = 1, scale = 1; const cam = { x:380, y:600 };
function resize(){

  cv.width = Math.round(VW*DPR); cv.height = Math.round(VH*DPR);
  scale = Math.max(0.55, Math.min(1.6, Math.min(VW/430, VH/660)));

const toS = (x, y, z=0) => [(x-cam.x)*scale + VW/2 + SHK.x, (y-cam.y)*scale + VH/2 - z*scale + SHK.y];
const inRect = (x, y, r) => Math.abs(x-r.x) < r.w/2 && Math.abs(y-r.y) < r.h/2;

// ---- 위치 계산 ----
function stackPos(e, i){
  i = Math.min(i, CFG.drawStackMax); const sway = 0.0009*i*i;
  return [e.x - e.fx*11 - e.svx*sway, e.y - e.fy*7 - e.svy*sway*0.6, 30 + i*9*(1 - 0.2*(e.bump || 0))];
}
function spItemPos(z, k, i){
  const p = SP[k]; const col = i%3, row = Math.floor(i/3)%3, layer = Math.floor(i/9);   // 한 단에 3×3, 보관대 MAX(36개)면 4단

function fly(from, toFn, kind, dur, done){ anims.push({ from, toFn, kind, t:0, dur, done }); }
function floatText(x, y, text, color){ floats.push({ x, y, text, color, t:0 }); }
// 연달아 줍는 돈은 글자 하나로 합쳐서 금액만 올림 (0.05초마다 새 글자가 겹쳐 뜨지 않게)
function floatSum(x, y, key, amt, color){

// ---- 효과 (보는 맛): 파티클, 지갑으로 날아가는 동전, 화면 흔들림, 큰 글자 배너 ----
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;   // 움직임 줄이기 설정이면 흔들림 끄고 파티클 줄임
let parts = [], coins = [], banner = null, bannerQ = [], shakeA = 0;
const SHK = { x:0, y:0 };
const CONF = ['#f2a35e', '#3f7fc4', '#4c9a66', '#e8b923', '#c46a9a', '#7a7fd1'];
// 월드 좌표 파티클. kind: spark(반짝 별) conf(색종이) dust(먼지) ring(바닥 원)
function burst(x, y, z, n, kind, o = {}){
  if (RM) n = Math.ceil(n/3);
  for (let i = 0; i < n && parts.length < 320; i++) {
    const a = Math.random()*Math.PI*2, sp = (o.speed || 90)*(0.4 + Math.random()*0.8);
    parts.push({ x, y, z, kind, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*0.5, vz:(o.up ?? 120)*(0.6 + Math.random()*0.7),
      g:o.g ?? 320, t:0, life:(o.life || 0.8)*(0.7 + Math.random()*0.6), size:o.size || 4,
      color:o.color || CONF[Math.floor(Math.random()*CONF.length)], rot:Math.random()*6, vr:(Math.random() - 0.5)*14 });
  }
}
function ring(x, y, color){ parts.push({ x, y, z:0, kind:'ring', vx:0, vy:0, vz:0, g:0, t:0, life:0.5, size:70, color }); }
function shake(a){ if (!RM) shakeA = Math.max(shakeA, a); }
function showBanner(text, color){ const b = { text, color:color || C.gold, t:0 }; if (banner) bannerQ.push(b); else banner = b; }
// 지갑(왼쪽 위 돈 칩)으로 날아가는 동전. 화면 좌표 기준
const moneyChip = () => moneyEl.parentElement;
function coinsToWallet(sx, sy, n){
  const r = moneyChip().querySelector('.coin').getBoundingClientRect(), tx = r.left + r.width/2, ty = r.top + r.height/2;
  for (let i = 0; i < Math.min(n, RM ? 3 : 14); i++)
    coins.push({ sx:sx + (Math.random() - 0.5)*30, sy:sy + (Math.random() - 0.5)*20, tx, ty, t:-i*0.04, dur:0.45 + Math.random()*0.15,
      bend:(Math.random() - 0.5)*160 });
}
const coinsFrom = (x, y, z, n) => { const [sx, sy] = toS(x, y, z); coinsToWallet(sx, sy, n); };
function bumpMoney(){
  if (RM || !every('bump', 0.09)) return;
  const el = moneyChip(); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}
function updFx(dt){
  parts = parts.filter(q => {
    q.t += dt; if (q.t >= q.life) return false;
    q.x += q.vx*dt; q.y += q.vy*dt; q.z += q.vz*dt; q.vz -= q.g*dt; q.rot += q.vr*dt;
    if (q.z < 0 && q.g > 0) { q.z = 0; q.vz *= -0.35; q.vx *= 0.6; q.vy *= 0.6; }
    return true;
  });
  coins = coins.filter(c => { c.t += dt/c.dur; if (c.t >= 1) { bumpMoney(); if (every('coinTick', 0.05)) tone(1900 + Math.random()*300, 0.04, 'sine', 0.035); return false; } return true; });
  if (banner && (banner.t += dt) > (bannerQ.length ? 1.1 : 1.7)) banner = bannerQ.shift() || null;   // 다음 배너가 기다리면 조금 빨리 넘김
  shakeA = shakeA < 0.3 ? 0 : shakeA*Math.exp(-dt*9);
  SHK.x = (Math.random() - 0.5)*2*shakeA; SHK.y = (Math.random() - 0.5)*2*shakeA;
}
function drawParts(){
  parts.forEach(q => {
    const k = q.t/q.life, [sx, sy] = toS(q.x, q.y, q.z);
    if (q.kind === 'ring') {
      ctx.strokeStyle = q.color; ctx.globalAlpha = 1 - k; ctx.lineWidth = 4*scale*(1 - k) + 1;
      ctx.beginPath(); ctx.ellipse(sx, sy, q.size*(0.5 + k)*scale, q.size*(0.5 + k)*0.55*scale, 0, 0, Math.PI*2); ctx.stroke();

function steer(e, vx, vy, dt, free){
  e.x += vx*dt; e.y += vy*dt;
  if (!free) {
    e.x = Math.max(20, Math.min(W-20, e.x));
    const f = e.z ?? curZone;                       // 일꾼은 자기 층, 주인공은 지금 층
    e.y = Math.max(gy(f, 40), Math.min(gy(f, ZH-20), e.y));
  }
  const sp = Math.hypot(vx, vy);
  if (sp > 5) { e.fx = vx/sp; e.fy = vy/sp; }
  const k = Math.min(1, dt*8); e.svx += (vx-e.svx)*k; e.svy += (vy-e.svy)*k;
}
function moveTo(e, tx, ty, spd, dt, free){
  const dx = tx-e.x, dy = ty-e.y, d = Math.hypot(dx, dy);
  if (d < 4) { steer(e, 0, 0, dt, free); return true; }
  const s = Math.min(spd, d/dt); steer(e, dx/d*s, dy/d*s, dt, free); return false;
}

    const x0 = SP[k].x - MACH.hw*b - BODY_R, x1 = SP[k].x + MACH.hw*b + BODY_R;
    pushOut(e, x0, x1, y0, y1);

  const dy = gy(z, DESK.y);                                   // 판매대(그림보다 약간 작게): 바닥 DESK.y-8 ~ DESK.y+12
  pushOut(e, DESK.x - DESK_BOX.hw - BODY_R, DESK.x + DESK_BOX.hw + BODY_R, dy - DESK_BOX.top - BODY_R, dy + DESK_BOX.bot + BODY_R);
}

  const dl = e.x - x0, dr = x1 - e.x, du = e.y - y0, dd = y1 - e.y, m = Math.min(dl, dr, du, dd);   // 가장 적게 파고든 쪽으로 밀어냄

  if (ART.thief) return;
  const [sx, sy] = toS(T.x, T.y), u = scale;
  const bob = Math.hypot(T.svx, T.svy) > 20 ? Math.abs(Math.sin(performance.now()/90))*2*u : 0;
  const hx = sx + T.fx*2*u, hy = sy - 40*u - bob + T.fy*1.5*u;
  const [bx, by0] = toS(T.x - T.fx*12, T.y, 34), by = by0 - bob;   // 등 뒤(가는 쪽 반대) 짐 자리
  if (T.tp === 'pick') {                           // 소매치기: 회색 후드 푹 + 흰 마스크, 훔치면 손에 지갑
    ctx.fillStyle = K.dark; ctx.beginPath(); ctx.arc(hx, hy, 10.5*u, Math.PI*1.05, Math.PI*1.95); ctx.lineTo(hx + 10*u, hy + 2*u); ctx.lineTo(hx + 8*u, hy + 2*u); ctx.arc(hx, hy, 8*u, Math.PI*1.9, Math.PI*1.1, true); ctx.lineTo(hx - 10*u, hy + 2*u); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#246b3c'; ctx.beginPath(); ctx.ellipse(bx, by - r - (T.loot > 0 ? 4 : 0)*u, 4*u, 2.5*u, 0, 0, Math.PI*2); ctx.fill();   // 위 매듭
    ctx.fillStyle = '#2f8a4e'; ctx.beginPath(); ctx.arc(hx, hy, 9.6*u, Math.PI, 0); ctx.lineTo(hx + 9.6*u, hy + 3*u); ctx.lineTo(hx - 9.6*u, hy + 3*u); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#e8f3e6'; ctx.beginPath(); ctx.arc(hx - 3*u, hy - 4*u, 2.2*u, 0, Math.PI*1.5); ctx.stroke();
    ctx.fillStyle = '#24232e'; ctx.fillRect(hx - 7*u, hy - 1*u, 14*u, 3*u);                         // 눈만 빼꼼
    ctx.fillStyle = '#2f8a4e'; ctx.beginPath(); ctx.arc(hx - 2.5*u, hy + 5*u, 2.2*u, 0, Math.PI*2); ctx.arc(hx + 2.5*u, hy + 5*u, 2.2*u, 0, Math.PI*2); ctx.fill();   // 코 밑 매듭
  } else {                                         // 먹튀범: 검은 눈가리개, 훔치면 돈 자루
    ctx.fillStyle = '#24232e'; ctx.fillRect(sx - 9*u, sy - 44*u - bob, 18*u, 5*u);

}

// 층 경고 — 남은 시간이 짧고 놓치면 손해 큰 순서:
// 5=VIP(40초) > 6=황금(60초에 사라짐) > 7=부서지기 직전 고장 > 2=손님 화나기 직전 > 4=고장·부서짐 > 3=돈더미 MAX(판매만 멈춤) > 1=손님 대기
const ALERT_CLS = ['', 'warn', 'danger', 'full', 'broken', 'vip', 'gold', 'ruin', 'deliv'];

function custAlert(z){

}

// ---- 층 이벤트: 기계 고장 / VIP 손님 (자동화가 끝난 층에도 가끔 들를 이유) ----
const VIP_SPOT = {x:170, y:300};
let evT = CFG.events.first;
// ---- 잔업: 게임을 꺼 두거나 다른 화면에 있던 동안 층마다 잔업수당이 쌓임 ----
// 일꾼이 있는 층만, 생산·일꾼 운반·손님 중 가장 느린 쪽 기준 속도 × 50%. 단계마다 최대 시간 1→2→4→8시간. 이벤트(고장·VIP·도둑·황금)는 안 일어남
const awayHours = Z => Z.awayLv ? CFG.away.hours[Z.awayLv-1] : 0;
function awayRate(Z, z){
  if (!Z.awayLv || !Z.wrkLv) return 0;
  const on = Z.sp.filter(s => s.on && !s.broken && !s.ruined).length; if (!on) return 0;
  const prod = on/prodIv(z);
  const carry = Z.wrkLv*wcap(z)/(2*(SP[1].y - SELL.y)/CFG.workerSpeed + 2);
  const cust = Z.sp.filter(s => s.on).length/CFG.cust.every*CFG.spawnEvery/prodIv(z)*(CFG.cust.want[0] + CFG.cust.want[1])/2;
  return Math.min(prod, carry, cust)*valueOf(z)*CFG.away.rate;
}
// 잔업을 샀는데 못 버는 이유 (없으면 '')
const awayWhy = Z => !Z.awayLv ? '' : !Z.wrkLv ? '일꾼 없음' : !Z.sp.some(s => s.on && !s.broken && !s.ruined) ? '생산기 고장' : '';
function grantAway(sec){
  const parts = [], miss = []; let total = 0;
  S.zones.forEach((Z, z) => {
    const v = Math.floor(awayRate(Z, z)*Math.min(sec, awayHours(Z)*3600));
    if (v <= 0) { if (awayWhy(Z)) miss.push(`${z+1}층(${awayWhy(Z)})`); return; }
    Z.safe = (Z.safe || 0) + v; total += v; parts.push(`${z+1}층 ₩${fmt(v)}`);
  });
  if (!total && !miss.length) return;
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), missMsg = miss.length ? ` · 못 받음: ${miss.join(' ')}` : '';
  if (!total) { toast(`잔업수당 없음${missMsg}`, true); toastT = 6; return; }
  toast(`자리 비운 ${h ? h + '시간' : ''}${m || !h ? ` ${m}분` : ''} 동안 ${parts.slice(0, 3).join(' · ')}${parts.length > 3 ? ` 외 ${parts.length-3}곳` : ''} · 층마다 잔업수당을 챙겨요${missMsg}`);
  toastT = 6; sfx.mission(); save();
}

// 고장 난 채로 오래 두면 부서짐: 쌓인 물건(황금 포함)은 사라지고, 그 자리 '다시 제작' 칸에서 돈을 내야 다시 돌아감

}

    if (z === curZone) { shake(4); burst(SP[k].x, gy(z, SP[k].y - 34 - MACH_GAP), 40, 10, 'dust', { color:'#5b6070', speed:50, up:60, g:0, life:0.9, size:8 }); }

// ---- 배달 주문: 어느 층 손님이 다른 층 물건을 시킴 (예: 6층 찜질방에서 3층 치킨). 주인공만 가져다줄 수 있고 보상은 물건 값 × 3 (+빨리 오면 배달팁) ----
const DELIV_SPOT = {x:180, y:390};
const delivEach = () => valueOf(S.zones.length - 1)*CFG.deliv.mul;   // 배달 한 개 값: 어느 층 물건이든 지금 최고층 값 × 6

const shopLabel = z => `${z+1}층${THEMES[z] ? ' ' + THEMES[z].shop : ''}`;

const mixKind = (z, ph = 0) => kindOf(z).vars ? z + (1 + Math.floor(performance.now()/900 + ph) % kindOf(z).vars.length)*VAR : z;   // ph = 손님마다 바뀌는 박자

  if (!zs.length) return;
  const t = pick(zs), src = pick(S.zones.map((_, z) => z).filter(z => z !== t));
  const [lo, hi] = CFG.deliv.want, want = lo + Math.floor(Math.random()*(hi - lo + 1)), time = CFG.deliv.time + CFG.deliv.perFloor*Math.abs(t - src);

}
function updDeliv(z, cz, dt){

  fly(stackPos(P, idx), () => [D.x, D.y, 30], it, 0.2, () => {}); sfx.hand();

    if (topOf(S.stack, D.src) >= 0) { D.state = 'extra'; D.extra = 0; D.extraSum = 0; D.serveT = -0.6; D.say = pick(DDEOLI_ASK); D.sayT = 2.6; }   // 남은 같은 물건은 떨이로

// 떨이: 배달을 끝낸 뒤 등에 같은 층 물건이 남아 있으면 배달 손님이 반값에 다 사 감(옆에 있는 동안). 다 주거나 멀어지면 정산하고 떠남

    fly(stackPos(P, idx), () => [D.x, D.y, 30], it, 0.18, () => {}); sfx.hand();

  }

function drawDeliv(D, z){

  for (let yy = y0; yy <= y1; yy += 40) { const [a, b] = toS(0, yy), [c] = toS(W, yy); ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, b); ctx.stroke(); }

  if (themeOf(f)) shopSign(themeOf(f), fTop);
  // 계단
  if (f < S.zones.length-1) drawStairs(zr(f, STAIR_UP), `▲ ${f+2}층`);
  if (f > 0) drawStairs(zr(f, STAIR_DN), `▼ ${f}층`);

  const list = [];
  S.zones.forEach((Z, z) => {
    if (z !== f) return;
    // 층 이름
    text(`${z+1}층${themeOf(z) ? ' ' + themeOf(z).shop : ''} · ${kindOf(z).name} ₩${fmt(valueOf(z))}`, 30, gy(z, 920), 0, 16, 'rgba(44,43,53,.55)', 'left');

    // 바닥 칸
    floorRect(zr(z, SELL), C.sellFill, C.sell, false, 0); text('판매', SELL.x, gy(z, SELL.y+22), 0, 15, C.sell);
    floorRect(zr(z, CASH), 'rgba(76,154,102,.10)', 'rgba(76,154,102,.45)', false, 0);   // 밟는 칸(옅게)
    { const cy = gy(z, CASH.y), [a, b] = toS(CASH.x - 34, cy - 20, 3), [c, d] = toS(CASH.x + 34, cy + 12, 3);   // 초록 펠트 매트
      slab(CASH.x - 40, cy - 26, CASH.x + 40, cy + 18, 3, '#5fae7d', '#3f7d58');
      ctx.strokeStyle = '#f2c230'; ctx.lineWidth = 2*scale; ctx.setLineDash([5*scale, 4*scale]); ctx.strokeRect(a, b, c-a, d-b); ctx.setLineDash([]); }
    Z.sp.forEach((s, k) => { if (s.on && !s.ruined) floorRect({ x:SP[k].x, y:gy(z, SP[k].y), ...SP_ZONE }, 'rgba(95,107,132,.15)', C.machFront, false, 0); });

    // 세우는 것들
    list.push({ y:gy(z, DESK.y), draw:() => {
      const [sx, sy] = toS(DESK.x, gy(z, DESK.y+14));
      if (!art('desk', sx, sy, 110*scale, 70*scale)) { if (DSK.complete && DSK.naturalWidth) drawDesk(z); else cube(DESK.x, gy(z, DESK.y+14), 0, 110, 26, C.deskTop, C.deskFront); }
      const q = Z.queue, n = Math.min(q.length, 16);
      for (let i = 0; i < n; i++) { const [x, y, zz] = deskPos(z, i); item(x, y, zz, q[i], true); }
      for (let i = 0; i < n; i++) if (q[i] % VAR >= MINE) mineBadge(...deskPos(z, i));
      if (q.length > 16) text(`+${q.length-16}`, DESK.x-72, gy(z, DESK.y-10), 30, 13, C.ink);
    }});
    if (Z.awayLv) list.push({ y:gy(z, SAFE.y), draw:() => {   // 잔업
      const sy = gy(z, SAFE.y);
      const full = Z.safe > 0;
      floorRect(zr(z, SAFE), full ? 'rgba(232,185,35,.22)' : 'rgba(44,43,53,.08)', full ? '#b58a12' : C.lock, true, 0);   // 돈더미(초록)와 구별되게 금색
      const max = awayRate(Z, z)*awayHours(Z)*3600;
      drawChest(SAFE.x, sy - 8, full, full ? Math.min(1, max > 0 ? Z.safe/max : 1) : 0);
      const why = awayWhy(Z);   // 못 버는 상태면 빈 상자 밑에 이유를 빨갛게
      text(Z.safe > 0 ? `잔업수당 ₩${fmt(Z.safe)}` : why ? `잔업 멈춤 · ${why}` : `잔업수당 · 최대 ${awayHours(Z)}시간`, SAFE.x, sy + 26, 0, Z.safe > 0 ? 14 : 12, Z.safe > 0 ? '#8a6a0e' : why ? C.warn : C.ink, 'center', SAFE.w - 8);
    }});
    list.push({ y:gy(z, CASH.y), draw:() => {
      const n = Math.min(bills(Z, z), 18);
      for (let i = 0; i < n; i++) { const [x, y, zz] = cashPos(z, i); bill(x, y, zz); }
      if (pileFull(Z, z)) { const pulse = 1 + Math.sin(performance.now()/120)*0.08; text('MAX', CASH.x, gy(z, CASH.y-38), 22, 17*pulse, C.warn); }
      else if (Z.cash > 0) text(`₩${fmt(Z.cash)}`, CASH.x, gy(z, CASH.y-38), 20, 15, C.billFront);
      if (Z.auto) text('자동 수금', CASH.x, gy(z, CASH.y+58), 0, 13, C.billFront);
    }});
    if (Z.auto) { const b = cashRobot(z); list.push({ y:b.y, draw:() => drawRobot(b) }); }
    Z.sp.forEach((s, k) => {
      if (!s.on || s.ruined) return;                   // 부서진 생산기는 안 그림(그 자리에 '다시 제작' 칸)
      const p = SP[k], py = gy(z, p.y);
      list.push({ y:py-40, draw:() => {
        if (!ART.machine && PRN.complete && PRN.naturalWidth) return drawPrinter(s, z, k, p, py);
        const [mx, my] = toS(p.x, py-34);
        if (!art('machine', mx, my, 84*scale, 90*scale)) cube(p.x, py-34, 0, 80, 46, C.machTop, C.machFront);
        const [bx, by] = toS(p.x-28, py-58, 0);
        ctx.fillStyle = 'rgba(255,250,240,.5)'; ctx.fillRect(bx, by, 56*scale, 6*scale);
        if (s.broken) {                                // 고장: 연기 + 수리 막대
          for (let i = 0; i < 3; i++) { const t = (performance.now()/900 + i/3) % 1, [cx, cy] = toS(p.x - 10 + i*10, py-34, 50 + t*40);
            ctx.fillStyle = `rgba(90,90,100,${0.5*(1-t)})`; ctx.beginPath(); ctx.arc(cx, cy, (6 + t*8)*scale, 0, Math.PI*2); ctx.fill(); }
          ctx.fillStyle = C.ok; ctx.fillRect(bx, by, 56*scale*Math.min(1, (s.fix || 0)/CFG.broken.fixTime), 6*scale);
          const on = Math.floor(performance.now()/300) % 2, left = CFG.broken.ruin - (s.brokenT || 0);
          const msg = s.fix > 0 ? '수리 중…' : left <= CFG.broken.warn ? `${Math.ceil(left)}초 뒤 부서짐!` : '고장! 앞에 서서 수리';
          text(msg, p.x, py-76, 0, 13, on || s.fix > 0 ? C.hud : '#ffb3a6');
        } else {
          const prog = s.items >= spMax(z) ? 1 : Math.min(1, s.t/prodIv(z));
          ctx.fillStyle = s.items >= spMax(z) ? C.warn : C.hud; ctx.fillRect(bx, by, 56*scale*prog, 6*scale);
          text(s.items >= spMax(z) ? '가득 참' : '생산 중', p.x, py-76, 0, 13, C.hud);
        }
      }});
      list.push({ y:py, draw:() => {
        const g0 = s.items - (s.golden || 0), blinkOff = Math.floor(performance.now()/200) % 2;
        const shown = s.items - ((rt(z).pfly || [])[k] || 0);   // 프린터에서 날아오는 중인 물건은 도착하면 보임
        for (let i = 0; i < shown; i++) {
          const gold = i >= g0, life = gold && s.goldLife ? s.goldLife[i - g0] : 99;
          if (gold && life < 10 && blinkOff) continue;             // 사라지기 10초 전부터 깜빡임
          const [x, y, zz] = spItemPos(z, k, i); item(x, y, zz, gold ? GOLD + z : vk(z, k));
        }
      } });
    });
    rt(z).custs.forEach(c => list.push({ y:c.y, draw:() => customer(c, z) }));
    const V = rt(z).vip; if (V) list.push({ y:V.y, draw:() => drawVip(V, z) });
    const D = rt(z).deliv; if (D) list.push({ y:D.y, draw:() => drawDeliv(D, z) });
    if (Z.openedAt && Date.now() - Z.openedAt < WREATH_MS) [60, 128].forEach((x, i) => list.push({ y:gy(z, 44), draw:() => drawWreath(x, z, i) }));
  });

  // 업그레이드 칸 (지금 층만)
  padNear = null; let nd = 95;
  PADS.forEach(p => { if (p.icon && p.z === f && p.vis()) { const d = Math.hypot(P.x - p.x, P.y - p.y); if (d < nd) { nd = d; padNear = p; } } });
  PADS.forEach(p => {
    if (!p.vis() || p.z !== f) return;
    const c = p.cost(), paid = S.paid[p.id] || 0;
    const pk = 1 + 0.18*Math.sin((p.pop || 0)*Math.PI);   // 완료 직후 '뿅' 커졌다 돌아옴
    floorRect(pk > 1 ? { x:p.x, y:p.y, w:p.w*pk, h:p.h*pk } : p, p.gate ? 'rgba(232,185,35,.22)' : C.padFill, p.gate ? '#b58a12' : C.pad, true, paid/c);
    if (p.id === P.padOn && P.padHold < CFG.padHold && S.money > 0) {   // 서 있는 동안 결제 시작까지 동그라미
      const [hx, hy] = toS(p.x, p.y); ctx.strokeStyle = C.pad; ctx.lineWidth = 3*scale; ctx.beginPath(); ctx.arc(hx, hy, Math.min(p.w, p.h)*0.42*scale, -Math.PI/2, -Math.PI/2 + Math.PI*2*P.padHold/CFG.padHold); ctx.stroke();
    }
    if (p.icon) { iconPad(p, c - paid); return; }
    const mw = p.w - 12;
    text(p.label, p.x, p.y-18, 0, 15, C.ink, 'center', mw);
    if (p.sub()) text(p.sub(), p.x, p.y+2, 0, 13, p.gate ? '#8a6a0e' : C.pad, 'center', mw);
    text(`₩${fmt(c - paid)}`, p.x, p.y+22, 0, 15, S.money > 0 ? C.billFront : C.ink, 'center', mw);
  });

  muds.forEach(m => {                                // 진흙 발자국 (바닥)
    const [mx, my] = toS(m.x, m.y); ctx.fillStyle = `rgba(110,78,44,${0.45*(1 - m.t/1.4)})`;
    ctx.beginPath(); ctx.ellipse(mx, my, 4.5*scale, 2.6*scale, 0, 0, Math.PI*2); ctx.fill();
  });

  if (S.warp) list.push({ y:gy(f, ELEV.y), draw:() => drawElevator(f) });
  if (thief && thief.z === f) list.push({ y:thief.y, draw:drawThief });
  workers.forEach(w => { if (w.z !== f) return; const st = themeOf(f)?.staff;   // 가게 층은 그 가게 유니폼, 프린터 층은 안전모·조끼
    list.push({ y:w.y, draw:() => st ? carrier(w, w.stack, st.body, st.dark, 'worker', 'staff', st) : carrier(w, w.stack, C.worker, C.workerDark, 'worker', 'worker') }); });
  list.push({ y:P.y, draw:() => {
    if (S.slow > 0) {                                  // 발밑 진흙 웅덩이
      const [px, py] = toS(P.x, P.y); ctx.fillStyle = 'rgba(110,78,44,.45)';
      ctx.beginPath(); ctx.ellipse(px, py + 1*scale, 19*scale, 8*scale, 0, 0, Math.PI*2); ctx.fill();
    }
    carrier(P, S.stack, C.player, C.playerDark, 'player');
    const cap = capOf(S.capLv), n = S.stack.length;
    const [x, y, z] = stackPos(P, n);
    if (n >= cap) text('MAX', x, y, z+14, 14, C.warn);
    if (S.slow > 0) vipCloud(P, Math.max(z + 34, 80));  // VIP 놓친 벌칙: 머리(또는 등짐) 위 화난 VIP 먹구름
    else if (n > CFG.drawStackMax) text(`×${n}`, x, y, z+14, 14, C.ink);
  }});
  list.sort((a, b) => a.y - b.y).forEach(o => o.draw());

  // 날아가는 것들
  anims.forEach(a => {
    const to = a.toFn(), t = a.t, e = 1-(1-t)*(1-t);
    const x = a.from[0] + (to[0]-a.from[0])*e, y = a.from[1] + (to[1]-a.from[1])*e;
    const z = a.from[2] + (to[2]-a.from[2])*e + Math.sin(Math.PI*t)*30;
    a.kind === 'bill' ? bill(x, y, z) : item(x, y, z, a.kind);
  });
  drawParts();
  drawLvFx();
  padTip();
  if (themeOf(f)?.trad) drawLeaves();
  floats.forEach(f => {                              // 떠오르는 글자: 처음에 크게 튀어나왔다가 떠오르며 사라짐
    const t = f.t, pop = t < 0.12 ? 1.45 - t/0.12*0.45 : 1, [sx, sy] = toS(f.x, f.y, 60 + (1 - Math.pow(1 - t/0.9, 2))*55);
    ctx.globalAlpha = t > 0.55 ? 1 - (t - 0.55)/0.35 : 1;
    ctx.font = `${Math.round(18*pop*scale)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 4*scale; ctx.strokeStyle = 'rgba(255,250,240,.9)'; ctx.strokeText(f.text, sx, sy);
    ctx.fillStyle = f.color; ctx.fillText(f.text, sx, sy); ctx.globalAlpha = 1;
  });

  // 판매대가 화면 위로 벗어났을 때 손님 대기 표시
  const R = rt(curZone), waiting = R.custs.filter(c => c.state !== 'leave').length;
  if (waiting) {
    const [dx, dy] = toS(DESK.x, gy(curZone, LINE.y), 40);
    if (dy < 110) {
      const danger = custAlert(curZone) === 2, blink = danger && Math.floor(performance.now()/300) % 2;
      const label = `▲ 손님 ${waiting}명 대기${danger ? ' · 화나기 직전!' : ''}`;
      ctx.font = `15px ${FONT}`; const tw = ctx.measureText(label).width + 28;
      const x = Math.max(16 + tw/2, Math.min(VW - 16 - tw/2, dx)), y = toastEl.hidden ? 128 : 210;   // 알림이 떠 있으면 그 아래로
      rr(x - tw/2, y - 17, tw, 34, 17); ctx.fillStyle = danger ? (blink ? '#e0604a' : C.warn) : 'rgba(44,43,53,.82)'; ctx.fill();
      ctx.fillStyle = C.hud; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, y);
    }
  }

  if (fade > 0) { ctx.fillStyle = `rgba(44,43,53,${fade})`; ctx.fillRect(0, 0, VW, VH); }
  drawScreenFx();

  // 조이스틱
  if (joy) {
    ctx.strokeStyle = 'rgba(44,43,53,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, Math.PI*2); ctx.stroke();
    const dx = joy.x-joy.ox, dy = joy.y-joy.oy, d = Math.hypot(dx, dy), m = d > 50 ? 50/d : 1;
    ctx.fillStyle = 'rgba(44,43,53,.4)'; ctx.beginPath(); ctx.arc(joy.ox + dx*m, joy.oy + dy*m, 22, 0, Math.PI*2); ctx.fill();
  }
}

let shownSlow = 0, shownMoney = '', lastHint = null, shownOrders = '', layoutT = 0, shownMission = '', dispMoney = S.money, lastDt = 0.016;
function hud(){
  const w = walletOf(S.walLv);
  const sl = S.slow > 0 ? Math.ceil(S.slow) : 0;
  if (sl !== shownSlow) { shownSlow = sl; slowChip.hidden = !sl; slowSec.textContent = sl; }
  const diff = S.money - dispMoney;                 // 돈 숫자가 촤르륵 따라 올라감(쓸 때는 빨리 내려감)
  dispMoney = Math.abs(diff) < 1 ? S.money : dispMoney + diff*Math.min(1, lastDt*(diff > 0 ? 9 : 16));
  const txt = `${fmt(dispMoney)} / ${fmt(w)}`;
  if (txt !== shownMoney) { shownMoney = txt; moneyEl.textContent = txt; moneyEl.parentElement.classList.toggle('full', S.money >= w); }
  let h = '';
  const gateOpen = S.zones[S.zones.length-1].sp.every(s => s.on);
  if (!S.tut.moved) h = '화면을 드래그해서 움직여요';
  else if (!S.tut.sold) h = S.stack.length > 0 ? '파란 판매 칸에 내려놓으면 손님에게 팔려요' : '회색 생산기 앞 칸에 서서 물건을 모아요';
  else if (!S.tut.collected) h = '초록 돈더미를 밟아서 돈을 챙겨요';
  else if (!S.tut.upgraded) h = '점선 칸 위에 서 있으면 돈이 들어가 업그레이드돼요';
  else if (!S.tut.zone && gateOpen) h = '오른쪽 위 노란 칸에서 다음 층을 열 수 있어요';
  if (h !== lastHint) { lastHint = h; hintEl.textContent = h; hintEl.hidden = !h; }
  // 층 칩: 층이 많아져도 한 줄 — 지금 층 + 경고 있는 층만 보이고, 급한 것부터 앞에 (조용한 층은 숨김. 전체는 엘리베이터 선택판)
  const al = [];
  chipEls.forEach((b, z) => {
    const a = z === curZone ? 0 : zoneAlert(z, true);
    if (chipState[z] !== a) { chipState[z] = a; ALERT_CLS.forEach((c, i) => { if (i) b.classList.toggle(c, a === i); }); b.style.order = z === curZone ? -1 : ALERT_RANK.indexOf(a); }
    if (a) al.push([ALERT_RANK.indexOf(a), z]);
  });
  al.sort((p, q) => p[0] - q[0]);
  const shown = new Set(al.slice(0, CHIP_MAX).map(([, z]) => z));
  chipEls.forEach((b, z) => { const h = z !== curZone && !shown.has(z); if (b.hidden !== h) b.hidden = h; });
  if (moreEl) { const n = al.length - shown.size, t = n > 0 ? `+${n}` : ''; if (moreEl.textContent !== t) { moreEl.textContent = t; moreEl.hidden = !n; } }
  // 배달 주문 카드: 미션 카드 위에 진행 중인 배달을 계속 보여 줌
  const ords = S.zones.map((_, z) => rt(z).deliv).map((D, z) => D && D.state !== 'leave' && D.state !== 'extra'
    ? `<div${D.t < 15 ? ' class="low"' : ''}>🛵 <b>${z+1}층으로 배달</b> · ${D.src+1}층 ${itemName(D.src)} ${D.got}/${D.want}개 · ₩${fmt(delivEach()*D.want)} · ${Math.ceil(D.t)}초</div>` : '').join('');   // 갈 층을 맨 앞에 굵게
  if (ords !== shownOrders) { shownOrders = ords; ordersEl.innerHTML = ords; ordersEl.hidden = !ords; layoutT = 0; }
  if ((layoutT -= lastDt) <= 0) {                   // 아래쪽 쌓기: 미션 카드 → 배달 카드 → 알림/안내
    layoutT = 0.5; const mEl = $('mission'), mh = mEl.hidden ? 0 : mEl.offsetHeight + 8, oh = ordersEl.hidden ? 0 : ordersEl.offsetHeight + 8;
    document.documentElement.style.setProperty('--ordB', `${16 + mh}px`); document.documentElement.style.setProperty('--stackB', `${16 + mh + oh}px`);
  }
  const m = S.mission;
  if (m) {
    const prog = Math.min(m.target, (S.stats[m.type] || 0) - m.base), key = m.n + ':' + prog;
    if (key !== shownMission) {
      shownMission = key; $('mission').hidden = false;
      const f = m.type === 'collect' ? fmt : String;
      $('mText').textContent = missionLabel(m);
      $('mProg').textContent = `${f(prog)} / ${f(m.target)} · 보상 ₩${fmt(m.reward)}`;
      $('mBar').style.width = (prog/m.target*100) + '%';
    }
  }
}

// ---- 시작 ----
let last = 0, saveT = 0;
function frame(now){
  // 마지막 저장 뒤 오래 지났으면(게임을 껐거나 다른 화면이었음) 잔업 계산. 저장 시각이 없는 예전 저장은 건너뜀
  const away = S.seen ? (Date.now() - S.seen)/1000 : 0;
  if (away >= CFG.away.min) grantAway(away);
  if (away >= CFG.away.min || !S.seen) save();
  const dt = Math.min(0.05, (now - last)/1000 || 0); last = now; lastDt = dt;
  update(dt); render(); hud();
  if ((saveT += dt) > 1.5) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
P.x = S.px; P.y = S.py; cam.x = P.x; cam.y = P.y; curZone = zoneOf(P.y);
rebuildPads(); syncWorkers(); renderZoneChips(); resize();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>층층이 · 쌓고 팔고, 빨리빨리!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 한 화면 게임: 캔버스 전체 + 위쪽 HUD. 단일 룩(밝은 모래색 바닥)으로 고정 */
:root{
  --ground:#d9ccb2; --ink:#2c2b35; --hud:#fffaf0; --cash:#4c9a66; --pad:#4f6390; --warn:#c2462f;
  --display:'Jua',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);overflow:hidden;font-family:var(--display);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.left{display:flex;flex-direction:column;gap:8px;min-width:0}
.chip{background:var(--hud);border-radius:999px;box-shadow:0 3px 0 rgba(44,43,53,.18)}
.money{padding:3px 12px 3px 4px;display:flex;align-items:center;gap:6px;font-size:16px;font-variant-numeric:tabular-nums;width:fit-content}
.money.full{color:var(--warn)}
.money.bump{animation:bump .2s ease-out}
@keyframes bump{40%{transform:scale(1.14)}}
.coin{width:20px;height:20px;border-radius:50%;background:var(--cash);color:var(--hud);display:grid;place-items:center;font-size:12px}
#slowChip{font-size:14px;padding:6px 12px;width:fit-content;background:var(--warn);color:var(--hud)}
#zones{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + var(--stackB,104px) + 52px);
  display:flex;flex-direction:column;align-items:flex-start;gap:5px;pointer-events:none}   /* 층 칩: 왼쪽 아래 세로, 최대 5개 */
#zones .chip{font-size:12px;min-width:30px;padding:4px 8px;color:var(--ink);flex:none;text-align:center;box-sizing:border-box}
#zones .chip.on{background:var(--pad);color:var(--hud)}
#zones .chip.warn{box-shadow:0 3px 0 rgba(44,43,53,.18),inset 0 0 0 3px #e8b923}
#zones .chip.danger{background:var(--warn);color:var(--hud);animation:blink .6s steps(2) infinite}
#zones .chip.danger::after{content:'!';margin-left:3px}
#zones .chip.full{background:#e8b923;color:var(--ink)}
#zones .chip.full::after{content:' ₩MAX';font-size:12px}
#zones .chip.broken{background:#5b6070;color:var(--hud)}
#zones .chip.broken::after{content:' 고장';font-size:12px}
#zones .chip.vip{background:#b58a12;color:var(--hud);animation:blink .6s steps(2) infinite}
#zones .chip.vip::after{content:' VIP';font-size:12px}
#zones .chip.gold{background:#f4d35e;color:var(--ink)}
#zones .chip.gold::after{content:' 황금';font-size:12px}
#zones .chip.ruin{background:var(--warn);color:var(--hud);animation:blink .6s steps(2) infinite}
#zones .chip.ruin::after{content:' 고장!';font-size:12px}
#zones .chip.deliv{background:#3fa98a;color:var(--hud);animation:blink .6s steps(2) infinite}
#zones .chip.deliv::after{content:' 배달';font-size:12px}
@keyframes blink{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){#zones .chip.danger,#zones .chip.vip,#zones .chip.ruin,#zones .chip.deliv,.money.bump{animation:none}}
button:focus-visible,a:focus-visible{outline:3px solid var(--pad);outline-offset:2px}
#menuBtn{pointer-events:auto;font:inherit;font-size:14px;border:0;padding:8px 14px;color:var(--ink);cursor:pointer}
#panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);right:max(16px,env(safe-area-inset-right,0px));
  background:var(--hud);border-radius:16px;box-shadow:0 6px 0 rgba(44,43,53,.18);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:160px}
#panel button,#panel a{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;text-decoration:none}
#panel button:hover,#panel a:hover{background:rgba(79,99,144,.12)}
#panel .state{float:right;color:var(--pad);margin-left:12px}
#reset.armed{background:var(--warn);color:var(--hud)}
.hint,.toast{position:fixed;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(44,43,53,.82);color:var(--hud);
  padding:10px 18px;border-radius:14px;font-size:16px;text-align:center;pointer-events:none;text-wrap:balance}
.hint,.toast{bottom:calc(env(safe-area-inset-bottom,0px) + var(--stackB,104px))}
.orders{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--ordB,16px));box-sizing:border-box;
  width:min(360px,calc(100% - 32px));background:#e9f8f2;border:2px solid #3fa98a;border-radius:14px;padding:6px 12px;pointer-events:none;
  display:flex;flex-direction:column;gap:3px;font-size:14px;color:#2f6f5b;font-variant-numeric:tabular-nums}
.orders .low{color:var(--warn)}
.orders b{color:#1f6e57;font-weight:normal;background:#c8eee0;border-radius:6px;padding:0 5px}
.mission{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);box-sizing:border-box;
  width:min(360px,calc(100% - 32px));background:var(--hud);border-radius:16px;box-shadow:0 4px 0 rgba(44,43,53,.18);padding:10px 14px;
  pointer-events:none;display:flex;flex-direction:column;gap:5px}
.mrow{display:flex;gap:8px;align-items:center;font-size:16px;min-width:0}
.mlabel{background:var(--pad);color:var(--hud);border-radius:999px;padding:2px 9px;font-size:12px;flex:none}
.mrow.sub{font-size:13px;color:var(--pad);font-variant-numeric:tabular-nums}
.mbar{height:6px;border-radius:3px;background:rgba(44,43,53,.12);overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--cash);transition:width .25s}
.toast{background:var(--pad);transition:opacity .3s}
.toast.bad{background:var(--warn)}
.elev{position:fixed;top:calc(env(safe-area-inset-top,0px) + 170px);left:50%;transform:translateX(-50%);box-sizing:border-box;
  width:min(320px,calc(100% - 32px));background:#3b3f4a;color:var(--hud);border-radius:18px;padding:14px;box-shadow:0 6px 0 rgba(44,43,53,.25);
  display:flex;flex-direction:column;gap:10px}
.elev .etitle{font-size:16px;text-align:center}
.elev .ebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:40vh;overflow-y:auto}
.elev button{font:inherit;font-size:18px;border:0;border-radius:12px;padding:12px 0;background:#5b6070;color:var(--hud);cursor:pointer}
.elev button:disabled{background:#e8b923;color:var(--ink);cursor:default}
.elev button.warn{box-shadow:inset 0 0 0 3px #e8b923}
.elev button.danger{background:var(--warn)}
.elev button.full{box-shadow:inset 0 0 0 3px #e8b923;color:#ffe27a}
.elev button.broken{box-shadow:inset 0 0 0 3px #ffb3a6}
.elev button.vip{background:#b58a12}
.elev button.gold{background:#c9a227;color:var(--ink)}
.elev button.ruin{background:var(--warn);box-shadow:inset 0 0 0 3px #ffb3a6}
.elev button.deliv{background:#3fa98a}
</style>
</head>
<body>
<canvas id="game" aria-label="층층이 게임 화면"></canvas>
<div class="hud">
  <div class="left">
    <div class="money chip"><span class="coin">₩</span><span id="money">0</span></div>
    <div id="slowChip" class="chip" hidden>🐢 VIP 화남 · 느려짐 <span id="slowSec">0</span>초</div>
    <div id="zones" aria-label="층 이동"></div>
  </div>
  <button id="menuBtn" class="chip" type="button" aria-expanded="false" aria-controls="panel">설정</button>
</div>
<div id="panel" hidden>
  <button id="sndBtn" type="button">소리 <span class="state" id="sndState">켬</span></button>
  <button id="vibBtn" type="button">진동 <span class="state" id="vibState">켬</span></button>
  <button id="thBtn" type="button">가게 미리보기 <span class="state" id="thState">층대로</span></button>
  <a href="/stack">게임 소개</a>
  <button id="reset" type="button">처음부터</button>
</div>
<div class="toast" id="toast" hidden></div>
<div class="elev" id="elev" hidden><div class="etitle">엘리베이터 · 몇 층으로 갈까요?</div><div class="ebtns" id="elevBtns"></div></div>
<div class="mission" id="mission" hidden>
  <div class="mrow"><span class="mlabel">미션</span><span id="mText"></span></div>
  <div class="mrow sub" id="mProg"></div>
  <div class="mbar"><i id="mBar"></i></div>
</div>
<div class="orders" id="orders" hidden></div>
<div class="hint" id="hint" hidden></div>

<script>
(() => {
// ================= 설정 (숫자만 바꿔서 밸런스 조절) =================
const CFG = {
  zoneH: 980, worldW: 760,
  spawnEvery: 1.5, spawnMax: 12,                 // 생산 간격(초), 생산기 앞 최대 개수
  baseValue: 4, valueMul: 5,                     // N층 물건 값 = 4 × 5^N
  zoneCost: 1000, zoneCostMul: 8,                // 다음 층 열기 = 1000 × 8^N
  zoneScale: 8,                                  // 층 안 비용 배수 (N층 = 1층 비용 × 8^N)
  spawnerCost: [0, 60, 240],
  workerMax: 3, workerCap: 4, workerSpeed: 95,   // 층당 일꾼 수, 일꾼 적재량, 속도
  sellMax: 5,
  cap:    { base: 6, step: 2, cost: 25, mul: 1.6 },               // 적재량 (상한 없음)
  speed:  { base: 150, bonus: 130, decay: 0.85, cost: 35, mul: 1.7 }, // 이동속도 (상한 없음, 갈수록 덜 오름)
  worker: { cost: 100, mul: 2.1 },
  sell:   { base: 0.45, decay: 0.78, cost: 40, mul: 1.8 },        // 손님에게 하나 건네는 간격
  cust:   { every: 4.5, patience: 14, maxLine: 5, want: [1, 3], speed: 80, tip: 0.2 }, // 손님: 등장 간격(생산기 수로 나눔), 참을성(초), 줄 길이, 사는 개수, 팁 비율
  wallet: { base: 500, mul: 2, costRate: 0.6 },    // 지갑 한도 = 500 × 2^레벨, 업그레이드 비용 = 현재 한도의 60%
  gold: { chance: 0.03, mul: 10, life: 60 },     // 황금: 생산 확률, 값 = 지금 최고층 물건 값 × 10, 60초 안에 안 가져가면 사라짐 (일꾼은 못 나름)
  direct: { mul: 2 },                            // 주인공이 직접 판매대에 내려놓은 물건 값 배수               // 황금 물건: 생산될 확률, 값 배수
  thief: { after: 12, chance: 0.3, speed: 115, take: 0.5, cooldown: 25 }, // 도둑: 돈더미를 몇 초 방치하면 나타날 수 있음, 초당 등장 확률, 속도, 훔치는 비율, 다음 등장까지 쉬는 시간
  warpCost: 1500,                                // 엘리베이터(층 버튼으로 이동) 비용
  events: { first: 60, every: 50 },              // 층 이벤트(고장·VIP): 처음 몇 초 뒤부터, 평균 몇 초마다
  broken: { fixTime: 2, ruin: 120, warn: 30, rebuild: 100 }, // 수리: 앞에 몇 초 서 있기 / 고장 난 채로 몇 초 지나면 부서짐(몇 초 전부터 경고) / 다시 제작 비용(× 8^층)
  deliv: { time: 50, perFloor: 10, want: [2, 4], mul: 3, tip: 0.3 }, // 배달 주문: 기본 제한 시간 + 층 차이당 추가 초, 개수, 보상 배수(물건 값 × 3), 절반 넘게 남기고 끝내면 배달팁 30%
  vip: { time: 40, want: [3, 6], mul: 5, goldMul: 5, slow: 10, slowSpd: 0.6 }, // VIP: 제한 시간(초), 원하는 개수, 보상 배수(물건 값 × 5), 황금을 건네면 그 물건만 또 × 5,
                                                 //      놓치면 10초 동안 일꾼 속도의 60%로 (업그레이드와 상관없이 일꾼보다 느림)
  autoCost: 1500,                                // 층 자동 수금 칸 비용 (× 8^층)
  away: { hours: [1, 2, 4, 8], cost: 300, mul: 4, rate: 0.5, min: 60 }, // 잔업: 단계별 최대 시간, 비용(× 4^단계 × 8^층), 자동으로 벌던 속도의 몇 %, 몇 초 이상 비워야 계산
  cashMax: 40,                                   // 돈더미 최대 장수(손님 결제 1번 = 1장, 금액과 무관). 꽉 차면 챙길 때까지 판매가 멈춤
  drawStackMax: 40                               // 등에 그려지는 최대 개수 (넘으면 숫자로 표시)
};

// ================= 그림 슬롯 =================
// 경로를 넣으면 도형 대신 그림으로 그림. 비워두거나 로딩 실패하면 도형 그대로.

  item0:'', item1:'', item2:'', item3:'', item4:'', item5:'' };
const ART = {};
// 기본 생산기 = 3D 프린터 몸체(코드로 그린 SVG). 노즐 머리·빛·만들어지는 물건은 drawPrinter()가 움직이며 그림.
// ART_SRC.machine에 그림을 넣으면 그걸 우선 사용(예전 방식)
const PRN = new Image();
PRN.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="480" height="400"><defs> <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9dfe7"/><stop offset="1" stop-color="#93c4d0"/></linearGradient> <linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef9fb"/><stop offset="1" stop-color="#cfe9ef"/></linearGradient> <linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c8ecf5"/></linearGradient> <pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="12" fill="#f2c230"/><rect x="6" width="6" height="12" fill="#38445a"/></pattern></defs> <ellipse cx="120" cy="190" rx="110" ry="8" fill="#2c2b35" opacity=".2"/> <g stroke="#38445a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"> <path d="M14 136 Q14 128 22 128 L218 128 Q226 128 226 136 L230 150 L10 150 Z" fill="url(#t)"/> <rect x="10" y="148" width="220" height="34" rx="8" fill="url(#b)"/><rect x="10" y="168" width="220" height="14" rx="6" fill="#f2a58c"/> <rect x="150" y="153" width="64" height="11" rx="3" fill="url(#h)" stroke-width="2.5"/> <rect x="20" y="58" width="44" height="92" rx="8" fill="url(#b)"/><path d="M24 50 Q24 44 30 44 L54 44 Q60 44 60 50 L64 60 L20 60 Z" fill="url(#t)"/> <rect x="27" y="70" width="30" height="24" rx="4" fill="#2f3b4f" stroke-width="3"/><path d="M31 87 L37 80 L43 84 L51 75" fill="none" stroke="#7ff0a8" stroke-width="2.5"/> <circle cx="33" cy="106" r="4" fill="#7ff0a8" stroke-width="2"/><circle cx="45" cy="106" r="4" fill="#f2c230" stroke-width="2"/> <rect x="27" y="116" width="30" height="8" rx="3" fill="#f2a58c" stroke-width="2.5"/><rect x="198" y="52" width="18" height="80" rx="5" fill="url(#b)"/> <rect x="54" y="34" width="168" height="22" rx="7" fill="#f2a58c"/><path d="M62 45 h150" stroke="#d98a70" stroke-width="2"/> <path d="M100 124 L168 124 L172 134 L96 134 Z" fill="url(#p)" stroke-width="3"/></g> <path d="M104 129 L166 129" stroke="#8fe3f0" stroke-width="2"/> <g fill="#fff" opacity=".5"><rect x="16" y="151" width="208" height="4" rx="2"/><rect x="24" y="62" width="36" height="4" rx="2"/></g></svg>`);
// 1층 생산기 = 분식 조리대(떡볶이 철판 + 김밥 말이대 + 메뉴판). 프린터와 같은 틀(240×200, 0.625배)이라 충돌·물건 자리 계산을 같이 씀
const BUN = new Image();
BUN.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="480" height="400"><defs><linearGradient id="st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f6"/><stop offset="1" stop-color="#c3ccd8"/></linearGradient><linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46685a"/><stop offset="1" stop-color="#3a5a4c"/></linearGradient><pattern id="mt" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#d7c08a"/><rect width="3" height="7" fill="#bfa66a"/></pattern></defs><ellipse cx="120" cy="190" rx="110" ry="8" fill="#2c2b35" opacity=".2"/><g stroke="#38445a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"><rect x="38" y="40" width="7" height="76" rx="2" fill="#a87449"/><rect x="195" y="40" width="7" height="76" rx="2" fill="#a87449"/><rect x="26" y="14" width="188" height="48" rx="6" fill="url(#bd)" stroke="#8c5a3a" stroke-width="5"/><rect x="26" y="14" width="188" height="48" rx="6" fill="none"/><path d="M8 112 H232 L228 124 H12 Z" fill="#dfe5ec"/><rect x="12" y="122" width="216" height="60" rx="8" fill="url(#st)"/><rect x="12" y="166" width="216" height="16" rx="6" fill="#f2a58c"/><circle cx="40" cy="144" r="7" fill="#4a5670"/><circle cx="62" cy="144" r="7" fill="#4a5670"/><rect x="150" y="134" width="56" height="22" rx="4" fill="#e0614a"/><path d="M22 112 Q22 86 40 86 H104 Q122 86 122 112 Z" fill="#4a5670"/><rect x="132" y="102" width="92" height="12" rx="2" fill="url(#mt)" stroke-width="2.5"/></g><ellipse cx="72" cy="98" rx="44" ry="9" fill="#e8452c" stroke="#38445a" stroke-width="2.5"/><g stroke="#38445a" stroke-width="1.6" fill="#fff4e0"><rect x="44" y="93" width="15" height="5" rx="2.5"/><rect x="64" y="97" width="15" height="5" rx="2.5"/><rect x="84" y="92" width="15" height="5" rx="2.5"/><rect x="54" y="100" width="12" height="4" rx="2"/></g><g stroke="#38445a" stroke-width="1.6" fill="#f2c27a"><path d="M76 92 l8 -3 l-1 7 z"/><path d="M98 98 l8 2 l-6 5 z"/></g><g fill="#fff" opacity=".5"><rect x="18" y="126" width="204" height="4" rx="2"/></g><g fill="#fff"><circle cx="158" cy="145" r="2"/><circle cx="178" cy="145" r="2"/><circle cx="198" cy="145" r="2"/></g></svg>
`);

function fmt(n){
  n = Math.floor(n); if (n < 1000) return String(n);
  const e = Math.floor(Math.log10(n)/3), v = n/Math.pow(1000, e);
  const i = e - SUF.length;
  const suf = e < SUF.length ? SUF[e] : String.fromCharCode(97 + Math.floor(i/26)%26) + String.fromCharCode(97 + i%26);
  return (v < 100 ? v.toFixed(1).replace(/\.0$/, '') : Math.floor(v)) + suf;
}

function tone(freq, dur, type='sine', vol=0.1, when=0, slide=0){
  const c = SND.ctx; if (!c || !SND.on) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq*slide, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.008); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(SND.master); o.start(t); o.stop(t+dur+0.02);
}

// ---- 이동 ----
function steer(e, vx, vy, dt, free){
  e.x += vx*dt; e.y += vy*dt;
  if (!free) {
    e.x = Math.max(20, Math.min(W-20, e.x));
    const f = e.z ?? curZone;                       // 일꾼은 자기 층, 주인공은 지금 층
    e.y = Math.max(gy(f, 40), Math.min(gy(f, ZH-20), e.y));
  }
  const sp = Math.hypot(vx, vy);
  if (sp > 5) { e.fx = vx/sp; e.fy = vy/sp; }
  const k = Math.min(1, dt*8); e.svx += (vx-e.svx)*k; e.svy += (vy-e.svy)*k;
}
function moveTo(e, tx, ty, spd, dt, free){
  const dx = tx-e.x, dy = ty-e.y, d = Math.hypot(dx, dy);
  if (d < 4) { steer(e, 0, 0, dt, free); return true; }
  const s = Math.min(spd, d/dt); steer(e, dx/d*s, dy/d*s, dt, free); return false;
}
// ---- 충돌: 프린터 몸체는 못 지나감 (그림보다 약간 작게). 막히면 멈추지 않고 벽 따라 미끄러짐 ----
const MACH = { hw:62, top:70, bot:28 };            // 프린터 x ±62, y는 생산기 칸 y-70 ~ y-28 (바닥 기준선 근처)
const BODY_R = 10;                                 // 사람 몸 반지름
const DESK_BOX = { hw:54, top:8, bot:12 };
function collide(e, z){
  const Z = S.zones[z]; if (!Z) return;
  Z.sp.forEach((s, k) => {
    if (!s.on || s.ruined) return;
    const y0 = gy(z, SP[k].y) - MACH.top - BODY_R, y1 = gy(z, SP[k].y) - MACH.bot + BODY_R;
    const x0 = SP[k].x - MACH.hw - BODY_R, x1 = SP[k].x + MACH.hw + BODY_R;
    pushOut(e, x0, x1, y0, y1);
  });
  if (S.warp) pushOut(e, ELEV.x - 35 - BODY_R, ELEV.x + 35 + BODY_R, gy(z, ELEV.y - 40) - BODY_R, gy(z, ELEV.y) + BODY_R);   // 엘리베이터 문(벽에 붙은 상자)
  const dy = gy(z, DESK.y);                                   // 판매대(그림보다 약간 작게): 바닥 DESK.y-8 ~ DESK.y+12
  pushOut(e, DESK.x - DESK_BOX.hw - BODY_R, DESK.x + DESK_BOX.hw + BODY_R, dy - DESK_BOX.top - BODY_R, dy + DESK_BOX.bot + BODY_R);
}
function pushOut(e, x0, x1, y0, y1){
  if (e.x <= x0 || e.x >= x1 || e.y <= y0 || e.y >= y1) return;
  const dl = e.x - x0, dr = x1 - e.x, du = e.y - y0, dd = y1 - e.y, m = Math.min(dl, dr, du, dd);   // 가장 적게 파고든 쪽으로 밀어냄
  if (m === dl) e.x = x0; else if (m === dr) e.x = x1; else if (m === du) e.y = y0; else e.y = y1;
}
// 일꾼 길찾기: 프린터 줄 위아래를 오갈 땐 프린터 사이 통로로 돌아감 (판매대에 가까운 쪽 통로)
const CORRIDOR = [275, 275, 485];
function detour(e, z, k, tx, ty){
  const yb = gy(z, SP[0].y), top = yb - MACH.top - BODY_R - 6, bot = yb - MACH.bot + BODY_R + 6, cx = CORRIDOR[k];
  const below = e.y > bot, above = e.y < top, tBelow = ty > bot;
  if (tBelow ? below : above) return [tx, ty];
  if (Math.abs(e.x - cx) > 4 && (below || above)) return [cx, e.y];   // 먼저 통로 앞으로 옆걸음
  return [cx, tBelow ? bot + 8 : top - 8];                            // 통로를 따라 줄을 건넘
}
const normalCount = s => s.items - (s.golden || 0);   // 일꾼이 나를 수 있는 일반 물건 수
function bestSpawner(Z){
  let best = 0, n = -1;
  Z.sp.forEach((s, k) => { if (s.on && !s.ruined && normalCount(s) > n) { n = normalCount(s); best = k; } });
  return best;
}

// ---- 황금 물건 ----
// 생산기에서 하나 꺼냄. 황금은 맨 위에 쌓여 있어서 먼저 집힘
function takeItem(s, z){ s.items--; if ((s.golden || 0) > 0) { s.golden--; if (s.goldLife) s.goldLife.pop(); return GOLD + z; } return z; }
// 황금 수명: 생산기 위 황금마다 남은 시간을 가짐(먼저 나온 것부터 순서대로). 다 되면 사라짐
function goldTick(s, z, k, cz, dt){
  if (!s.golden) return;
  const L = s.goldLife || (s.goldLife = []);
  while (L.length < s.golden) L.unshift(CFG.gold.life);      // 예전 저장 데이터 보정
  for (let i = 0; i < L.length; i++) L[i] -= dt;
  while (L.length && L[0] <= 0) {
    L.shift(); s.golden--; s.items--;
    if (z === cz) floatText(SP[k].x, gy(z, SP[k].y), '황금 사라짐', C.warn);
  }

const MISSION_TYPES = ['sell', 'collect', 'tip', 'upgrade', 'golden'];
function makeMission(n){

  return { n, type, target, base:S.stats[type] || 0, reward:Math.round(v*25*(1 + tier*0.5)) };
}
const missionLabel = m => ({ sell:`물건 ${m.target}개 팔기`, collect:`돈 ₩${fmt(m.target)} 챙기기`, tip:`팁 ${m.target}번 받기`,
  upgrade:`업그레이드 ${m.target}번 하기`, golden:`황금 물건 ${m.target}개 팔기` })[m.type];
function checkMission(){

    { const r = $('mission').getBoundingClientRect(); if (r.width) coinsToWallet(r.left + r.width/2, r.top + 10, 12); }
    S.mission = makeMission(m.n + 1); save();
  }
}

// ---- 손님 ----
function updCustomers(Z, z, cz, dt){
  const R = rt(z);
  const onCnt = Z.sp.filter(s => s.on).length;
  R.spawnT -= dt;
  if (R.spawnT <= 0 && R.custs.filter(c => c.state !== 'leave').length < CFG.cust.maxLine) {
    R.spawnT = CFG.cust.every/onCnt * (0.7 + Math.random()*0.6);
    const [lo, hi] = CFG.cust.want;
    const T = themeOf(z), gear = T ? pick(T.guests) : null;
    R.custs.push({ x:-30, y:gy(z, LINE.y), want:lo + Math.floor(Math.random()*(hi-lo+1)), got:0, paySum:0,
      pat:CFG.cust.patience, state:'walk', at:false, fx:1, fy:0, svx:0, svy:0, gear, col:gear ? GUESTS[gear] : pick(CUST_COLS) });
  }
  let slot = 0;
  R.custs.forEach(c => {
    if (c.sayT > 0) c.sayT -= dt;
    if (c.state === 'leave') { moveTo(c, -50, gy(z, 70), CFG.cust.speed*1.4, dt, true); return; }
    c.slot = slot++;
    c.at = moveTo(c, LINE.x - c.slot*LINE.gap, gy(z, LINE.y), CFG.cust.speed, dt, true);
    if (c.at) { c.state = 'wait'; c.fx = 0.3; c.fy = 1; }
    if (c.state === 'wait') {
      c.pat -= dt;
      const T = themeOf(z);                        // 말풍선: 맨 앞에 오면 주문(테마 층), 참을성 35% 아래면 재촉(모든 층)
      if (c.slot === 0 && !c.ordered) { c.ordered = true; if (T) say(c, pick(T.order).replace('{n}', c.want), R); }
      if (!c.hurried && c.pat/CFG.cust.patience < 0.35) { c.hurried = true; say(c, pick(HURRY), R); }
      if (c.pat <= 0) {
        c.state = 'leave'; c.angry = true;
        if (z === cz) {
          say(c, pick(GRUMBLE), R); sfx.angry();
          if (!S.tut.angry) { S.tut.angry = true; toast('손님이 화나서 그냥 가버렸어요. 늦지 않게 채워주세요', true); }
        } else if (every('angryOff', 10)) toast(`${z+1}층 손님이 화나서 떠났어요`, true);
      }
    }
  });
  R.custs = R.custs.filter(c => !(c.state === 'leave' && c.x < -40));

  // 맨 앞 손님에게 하나씩 건네기
  const front = R.custs.find(c => c.state === 'wait' && c.slot === 0 && c.at);
  const cashFull = pileFull(Z, z);
  if (cashFull && z === cz && !S.tut.cashFull) { S.tut.cashFull = true; toast('돈더미가 가득 찼어요! 챙겨야 다시 팔려요', true); }
  if (front && Z.queue.length && !cashFull) {
    R.serveT += dt;
    if (R.serveT >= sellIv(Z.sellLv)) {
      R.serveT = 0; const it = Z.queue.shift(); front.got++; front.paySum += itemValue(it);
      S.stats.sell++; if (it % MINE >= GOLD) S.stats.golden++;
      if (z === cz) { fly(deskPos(z, 0), () => [front.x, front.y, 30], it, 0.22, () => {}); sfx.hand(); R.pull = performance.now(); }
      if (front.got >= front.want) {
        const tip = front.pat/CFG.cust.patience > 0.6;
        if (tip) S.stats.tip++;
        const pay = tip ? Math.round(front.paySum*(1 + CFG.cust.tip)) : front.paySum;
        Z.cash += pay; Z.bills = bills(Z, z) + 1; S.tut.sold = true; front.state = 'leave'; front.happy = true;
        if (themeOf(z)) say(front, pick(themeOf(z).thanks), R);
        if (z === cz) {
          fly([front.x, front.y, 30], () => cashPos(z, bills(Z, z)), 'bill', 0.3, () => {});
          floatText(front.x, front.y, tip ? `팁! +${fmt(pay)}` : `+${fmt(pay)}`, tip ? '#b58a12' : C.billFront); sfx.paid(tip); R.ring = performance.now();
          burst(DESK.x + 37, gy(z, DESK.y+14), 66, 5, 'spark', { color:'#ffd23f', speed:60, up:50, g:0, life:0.45 });
          burst(front.x, front.y, 50, tip ? 14 : 6, 'spark', { color:tip ? '#ffd23f' : '#9be3b0', speed:80, up:60, g:0, life:0.55 });
        }
      }
    }
  } else R.serveT = 0;
}

// ---- 도둑 ----
// 지금 있는 층의 돈더미를 오래 방치하면 위·왼쪽·오른쪽·아래 중 아무 데서나 나타나 절반을 들고 (또 아무 쪽으로) 도망감. 부딪히면 잡아서 돌려받음
// 길은 바깥 → (경유점) → 돈더미, 도망은 그 반대. 계단·엘리베이터(오른쪽 위 x 410~)와 프린터 줄을 가로지르지 않게:
// 위쪽은 판매대와 엘리베이터 사이 통로(x 395)로 내려오고, 아래쪽은 오른쪽 바깥(x W+40)으로 올라옴
const THIEF_SIDES = [['위쪽', [[395, -50], [395, 225]]], ['왼쪽', [[-50, 330]]], ['오른쪽', [[W + 50, 330]]], ['아래쪽', [[W + 40, ZH + 40]]]];
const thiefPath = (side, z) => side[1].map(([x, y]) => [x, gy(z, y)]);
function updThief(cz, dt){
  if (thiefCd > 0) thiefCd -= dt;

    const Z = S.zones[cz], R = rt(cz);
    if (thiefCd <= 0 && Z.cash > 0 && (R.cashIdle || 0) > CFG.thief.after && Math.random() < CFG.thief.chance*dt) {
      const side = pick(THIEF_SIDES), path = thiefPath(side, cz);
      thief = { z:cz, x:path[0][0], y:path[0][1], path, wp:1, out:thiefPath(pick(THIEF_SIDES), cz).reverse(), owp:0, state:'come', loot:0, t:0, fx:-1, fy:0, svx:0, svy:0 };
      toast(`도둑이 ${side[0]}에서 나타났어요! 돈더미를 지키세요`, true); sfx.siren();
    }

    else if (T.wp < T.path.length) { if (moveTo(T, T.path[T.wp][0], T.path[T.wp][1], CFG.thief.speed, dt, true)) T.wp++; }
    else if (moveTo(T, CASH.x + 34, gy(T.z, CASH.y), CFG.thief.speed, dt, true)) { T.state = 'grab'; T.t = 0; }
  } else if (T.state === 'grab') {
    if ((T.t += dt) > 0.9) {
      T.loot = Math.min(Z.cash, Math.max(valueOf(T.z), Math.ceil(Z.cash*CFG.thief.take)));
      T.lootBills = bills(Z, T.z); takeCash(Z, T.z, T.loot); T.lootBills -= Z.bills; T.state = 'run';
      if (T.z === cz) { floatText(T.x, T.y, `-₩${fmt(T.loot)}`, C.warn); sfx.stolen(); shake(4); }
    }
  } else if (T.owp < T.out.length - 1) { if (moveTo(T, T.out[T.owp][0], T.out[T.owp][1], CFG.thief.speed, dt, true)) T.owp++; }
  else if (moveTo(T, T.out[T.owp][0], T.out[T.owp][1], CFG.thief.speed, dt, true)) {
    if (T.loot > 0) toast(`도둑맞았어요 -₩${fmt(T.loot)}`, true);
    thief = null; thiefCd = CFG.thief.cooldown; return;
  }
  // 잡기
  if (T.z === cz && Math.hypot(P.x - T.x, P.y - T.y) < 28) {
    if (T.loot > 0) { Z.cash += T.loot; Z.bills = bills(Z, T.z) + (T.lootBills || 1); toast(`도둑을 잡았어요! ₩${fmt(T.loot)} 되찾음`); }
    else toast('도둑을 쫓아냈어요!');
    floatText(T.x, T.y, '잡았다!', C.pad); sfx.caught(); shake(5); burst(T.x, T.y, 40, 16, 'spark', { color:'#fff3b0', speed:140, up:100, g:0, life:0.5 }); S.stats.thief = (S.stats.thief || 0) + 1;
    thief = null; thiefCd = CFG.thief.cooldown;
  }
}
function drawThief(){
  const T = thief; if (!T) return;
  person(T, '#3b3a48', '#24232e', 'thief');
  if (ART.thief) return;
  const [sx, sy] = toS(T.x, T.y);
  const bob = Math.hypot(T.svx, T.svy) > 20 ? Math.abs(Math.sin(performance.now()/90))*2*scale : 0;

// 층 경고 — 남은 시간이 짧고 놓치면 손해 큰 순서:
// 5=VIP(40초) > 6=황금(60초에 사라짐) > 7=부서지기 직전 고장 > 2=손님 화나기 직전 > 4=고장·부서짐 > 3=돈더미 MAX(판매만 멈춤) > 1=손님 대기
const ALERT_CLS = ['', 'warn', 'danger', 'full', 'broken', 'vip', 'gold', 'ruin', 'deliv'];
const ALERT_RANK = [5, 8, 6, 7, 2, 4, 3, 1];          // 층 칩 앞에 오는 순서(급한 것부터)
function zoneAlert(z, noDeliv){
  const Z = S.zones[z]; if (!Z) return 0;
  const V = rt(z).vip;
  if (V && V.state !== 'leave') return 5;
  const D = rt(z).deliv; if (!noDeliv && D && D.state !== 'leave') return 8;   // 배달 주문 받은 층(위 칩에선 빼고 배달 카드로 보여 줌)
  if (Z.sp.some(s => s.on && (s.golden || 0) > 0)) return 6;   // 황금 물건 대기(주인공만 나를 수 있음)
  if (Z.sp.some(s => s.broken && CFG.broken.ruin - (s.brokenT || 0) <= CFG.broken.warn)) return 7;
  const c = custAlert(z); if (c === 2) return 2;
  if (Z.sp.some(s => s.broken || s.ruined)) return 4;
  if (pileFull(Z, z)) return 3;
  return c;
}
// 층 손님 상태: 0=없음, 1=기다리는 중, 2=화나기 직전(참을성 35% 미만)
function custAlert(z){
  let a = 0;
  for (const c of rt(z).custs) { if (c.state !== 'wait') continue; if (c.pat/CFG.cust.patience < 0.35) return 2; a = 1; }
  return a;
}

// ---- 층 이벤트: 기계 고장 / VIP 손님 (자동화가 끝난 층에도 가끔 들를 이유) ----
const VIP_SPOT = {x:110, y:300};
let evT = CFG.events.first;
// ---- 잔업: 게임을 꺼 두거나 다른 화면에 있던 동안 층마다 잔업수당이 쌓임 ----
// 일꾼이 있는 층만, 생산·일꾼 운반·손님 중 가장 느린 쪽 기준 속도 × 50%. 단계마다 최대 시간 1→2→4→8시간. 이벤트(고장·VIP·도둑·황금)는 안 일어남
const awayHours = Z => Z.awayLv ? CFG.away.hours[Z.awayLv-1] : 0;
function awayRate(Z, z){
  if (!Z.awayLv || !Z.wrkLv) return 0;
  const on = Z.sp.filter(s => s.on && !s.broken && !s.ruined).length; if (!on) return 0;
  const prod = on/CFG.spawnEvery;
  const carry = Z.wrkLv*CFG.workerCap/(2*(SP[1].y - SELL.y)/CFG.workerSpeed + 2);
  const cust = Z.sp.filter(s => s.on).length/CFG.cust.every*(CFG.cust.want[0] + CFG.cust.want[1])/2;
  return Math.min(prod, carry, cust)*valueOf(z)*CFG.away.rate;
}
// 잔업을 샀는데 못 버는 이유 (없으면 '')
const awayWhy = Z => !Z.awayLv ? '' : !Z.wrkLv ? '일꾼 없음' : !Z.sp.some(s => s.on && !s.broken && !s.ruined) ? '생산기 고장' : '';
function grantAway(sec){
  const parts = [], miss = []; let total = 0;
  S.zones.forEach((Z, z) => {
    const v = Math.floor(awayRate(Z, z)*Math.min(sec, awayHours(Z)*3600));
    if (v <= 0) { if (awayWhy(Z)) miss.push(`${z+1}층(${awayWhy(Z)})`); return; }
    Z.safe = (Z.safe || 0) + v; total += v; parts.push(`${z+1}층 ₩${fmt(v)}`);
  });
  if (!total && !miss.length) return;
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), missMsg = miss.length ? ` · 못 받음: ${miss.join(' ')}` : '';
  if (!total) { toast(`잔업수당 없음${missMsg}`, true); toastT = 6; return; }
  toast(`자리 비운 ${h ? h + '시간' : ''}${m || !h ? ` ${m}분` : ''} 동안 ${parts.slice(0, 3).join(' · ')}${parts.length > 3 ? ` 외 ${parts.length-3}곳` : ''} · 층마다 잔업수당을 챙겨요${missMsg}`);
  toastT = 6; sfx.mission(); save();
}

// 고장 난 채로 오래 두면 부서짐: 쌓인 물건(황금 포함)은 사라지고, 그 자리 '다시 제작' 칸에서 돈을 내야 다시 돌아감

// ---- 배달 주문: 어느 층 손님이 다른 층 물건을 시킴 (예: 6층 노래방에서 3층 치킨). 주인공만 가져다줄 수 있고 보상은 물건 값 × 3 (+빨리 오면 배달팁) ----
const DELIV_SPOT = {x:180, y:390};
const shopLabel = z => `${z+1}층${THEMES[z] ? ' ' + THEMES[z].shop : ''}`;
const itemName = z => (THEMES[z]?.item || KINDS[z % KINDS.length]).name;
function startDeliv(){

      shownMission = key; $('mission').hidden = false;
      const f = m.type === 'collect' ? fmt : String;
      $('mText').textContent = missionLabel(m);
      $('mProg').textContent = `${f(prog)} / ${f(m.target)} · 보상 ₩${fmt(m.reward)}`;
      $('mBar').style.width = (prog/m.target*100) + '%';
    }
  }
}

// ---- 시작 ----
let last = 0, saveT = 0;
function frame(now){
  // 마지막 저장 뒤 오래 지났으면(게임을 껐거나 다른 화면이었음) 잔업 계산. 저장 시각이 없는 예전 저장은 건너뜀
  const away = S.seen ? (Date.now() - S.seen)/1000 : 0;
  if (away >= CFG.away.min) grantAway(away);
  if (away >= CFG.away.min || !S.seen) save();
  const dt = Math.min(0.05, (now - last)/1000 || 0); last = now; lastDt = dt;
  update(dt); render(); hud();
  if ((saveT += dt) > 1.5) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
P.x = S.px; P.y = S.py; cam.x = P.x; cam.y = P.y; curZone = zoneOf(P.y);
rebuildPads(); syncWorkers(); renderZoneChips(); resize();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>

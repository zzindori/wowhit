<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쌓고팔기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 한 화면 게임: 캔버스 전체 + 위쪽 HUD. 단일 룩(밝은 모래색 바닥)으로 고정 */
:root{
  --ground:#d9ccb2; --ink:#2c2b35; --hud:#fffaf0; --cash:#4c9a66; --pad:#4f6390; --warn:#c2462f;
  --display:'Jua',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);overflow:hidden;font-family:var(--display);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.left{display:flex;flex-direction:column;gap:8px;min-width:0}
.chip{background:var(--hud);border-radius:999px;box-shadow:0 3px 0 rgba(44,43,53,.18)}
.money{padding:6px 16px 6px 8px;display:flex;align-items:center;gap:8px;font-size:22px;font-variant-numeric:tabular-nums;width:fit-content}
.money.full{color:var(--warn)}
.money.bump{animation:bump .2s ease-out}
@keyframes bump{40%{transform:scale(1.14)}}
.coin{width:26px;height:26px;border-radius:50%;background:var(--cash);color:var(--hud);display:grid;place-items:center;font-size:15px}
#slowChip{font-size:14px;padding:6px 12px;width:fit-content;background:var(--warn);color:var(--hud)}
#zones{display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100vw - 140px);pointer-events:none}
#zones .chip{font-size:14px;min-width:36px;padding:6px 10px;color:var(--ink);flex:none;text-align:center;box-sizing:border-box}
#zones .chip.on{background:var(--pad);color:var(--hud)}
#zones .chip.warn{box-shadow:0 3px 0 rgba(44,43,53,.18),inset 0 0 0 3px #e8b923}
#zones .chip.danger{background:var(--warn);color:var(--hud);animation:blink .6s steps(2) infinite}
#zones .chip.danger::after{content:'!';margin-left:3px}
#zones .chip.full{background:#e8b923;color:var(--ink)}
#zones .chip.full::after{content:' ₩MAX';font-size:12px}
#zones .chip.broken{background:#5b6070;color:var(--hud)}
#zones .chip.broken::after{content:' 고장';font-size:12px}
#zones .chip.vip{background:#b58a12;color:var(--hud);animation:blink .6s steps(2) infinite}
#zones .chip.vip::after{content:' VIP';font-size:12px}
#zones .chip.gold{background:#f4d35e;color:var(--ink)}
#zones .chip.gold::after{content:' 황금';font-size:12px}
#zones .chip.ruin{background:var(--warn);color:var(--hud);animation:blink .6s steps(2) infinite}
#zones .chip.ruin::after{content:' 고장!';font-size:12px}
@keyframes blink{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){#zones .chip.danger,#zones .chip.vip,#zones .chip.ruin,.money.bump{animation:none}}
button:focus-visible,a:focus-visible{outline:3px solid var(--pad);outline-offset:2px}
#menuBtn{pointer-events:auto;font:inherit;font-size:14px;border:0;padding:8px 14px;color:var(--ink);cursor:pointer}
#panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);right:max(16px,env(safe-area-inset-right,0px));
  background:var(--hud);border-radius:16px;box-shadow:0 6px 0 rgba(44,43,53,.18);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:160px}
#panel button,#panel a{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;text-decoration:none}
#panel button:hover,#panel a:hover{background:rgba(79,99,144,.12)}
#panel .state{float:right;color:var(--pad);margin-left:12px}
#reset.armed{background:var(--warn);color:var(--hud)}
.hint,.toast{position:fixed;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(44,43,53,.82);color:var(--hud);
  padding:10px 18px;border-radius:14px;font-size:16px;text-align:center;pointer-events:none;text-wrap:balance}
.hint{bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
.mission{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);box-sizing:border-box;
  width:min(360px,calc(100% - 32px));background:var(--hud);border-radius:16px;box-shadow:0 4px 0 rgba(44,43,53,.18);padding:10px 14px;
  pointer-events:none;display:flex;flex-direction:column;gap:5px}
.mrow{display:flex;gap:8px;align-items:center;font-size:16px;min-width:0}
.mlabel{background:var(--pad);color:var(--hud);border-radius:999px;padding:2px 9px;font-size:12px;flex:none}
.mrow.sub{font-size:13px;color:var(--pad);font-variant-numeric:tabular-nums}
.mbar{height:6px;border-radius:3px;background:rgba(44,43,53,.12);overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--cash);transition:width .25s}
.toast{top:calc(env(safe-area-inset-top,0px) + 110px);background:var(--pad);transition:opacity .3s}
.toast.bad{background:var(--warn)}
.elev{position:fixed;top:calc(env(safe-area-inset-top,0px) + 170px);left:50%;transform:translateX(-50%);box-sizing:border-box;
  width:min(320px,calc(100% - 32px));background:#3b3f4a;color:var(--hud);border-radius:18px;padding:14px;box-shadow:0 6px 0 rgba(44,43,53,.25);
  display:flex;flex-direction:column;gap:10px}
.elev .etitle{font-size:16px;text-align:center}
.elev .ebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:40vh;overflow-y:auto}
.elev button{font:inherit;font-size:18px;border:0;border-radius:12px;padding:12px 0;background:#5b6070;color:var(--hud);cursor:pointer}
.elev button:disabled{background:#e8b923;color:var(--ink);cursor:default}
.elev button.warn{box-shadow:inset 0 0 0 3px #e8b923}
.elev button.danger{background:var(--warn)}
.elev button.full{box-shadow:inset 0 0 0 3px #e8b923;color:#ffe27a}
.elev button.broken{box-shadow:inset 0 0 0 3px #ffb3a6}
.elev button.vip{background:#b58a12}
.elev button.gold{background:#c9a227;color:var(--ink)}
.elev button.ruin{background:var(--warn);box-shadow:inset 0 0 0 3px #ffb3a6}
</style>
</head>
<body>
<canvas id="game" aria-label="쌓고팔기 게임 화면"></canvas>
<div class="hud">
  <div class="left">
    <div class="money chip"><span class="coin">₩</span><span id="money">0</span></div>
    <div id="slowChip" class="chip" hidden>🐢 VIP 화남 · 느려짐 <span id="slowSec">0</span>초</div>
    <div id="zones" aria-label="층 이동"></div>
  </div>
  <button id="menuBtn" class="chip" type="button" aria-expanded="false" aria-controls="panel">설정</button>
</div>
<div id="panel" hidden>
  <button id="sndBtn" type="button">소리 <span class="state" id="sndState">켬</span></button>
  <button id="vibBtn" type="button">진동 <span class="state" id="vibState">켬</span></button>
  <a href="/stack">게임 소개</a>
  <button id="reset" type="button">처음부터</button>
</div>
<div class="toast" id="toast" hidden></div>
<div class="elev" id="elev" hidden><div class="etitle">엘리베이터 · 몇 층으로 갈까요?</div><div class="ebtns" id="elevBtns"></div></div>
<div class="mission" id="mission" hidden>
  <div class="mrow"><span class="mlabel">미션</span><span id="mText"></span></div>
  <div class="mrow sub" id="mProg"></div>
  <div class="mbar"><i id="mBar"></i></div>
</div>
<div class="hint" id="hint">화면을 드래그해서 움직여요</div>

<script>
(() => {
// ================= 설정 (숫자만 바꿔서 밸런스 조절) =================
const CFG = {
  zoneH: 980, worldW: 760,
  spawnEvery: 1.5, spawnMax: 12,                 // 생산 간격(초), 생산기 앞 최대 개수
  baseValue: 4, valueMul: 5,                     // N층 물건 값 = 4 × 5^N
  zoneCost: 1000, zoneCostMul: 8,                // 다음 층 열기 = 1000 × 8^N
  zoneScale: 8,                                  // 층 안 비용 배수 (N층 = 1층 비용 × 8^N)
  spawnerCost: [0, 60, 240],
  workerMax: 3, workerCap: 4, workerSpeed: 95,   // 층당 일꾼 수, 일꾼 적재량, 속도
  sellMax: 5,
  cap:    { base: 6, step: 2, cost: 25, mul: 1.6 },               // 적재량 (상한 없음)
  speed:  { base: 150, bonus: 130, decay: 0.85, cost: 35, mul: 1.7 }, // 이동속도 (상한 없음, 갈수록 덜 오름)
  worker: { cost: 100, mul: 2.1 },
  sell:   { base: 0.45, decay: 0.78, cost: 40, mul: 1.8 },        // 손님에게 하나 건네는 간격
  cust:   { every: 4.5, patience: 14, maxLine: 5, want: [1, 3], speed: 80, tip: 0.2 }, // 손님: 등장 간격(생산기 수로 나눔), 참을성(초), 줄 길이, 사는 개수, 팁 비율
  wallet: { base: 500, mul: 2, costRate: 0.6 },    // 지갑 한도 = 500 × 2^레벨, 업그레이드 비용 = 현재 한도의 60%
  gold: { chance: 0.03, mul: 10, life: 60 },     // 황금: 생산 확률, 값 = 지금 최고층 물건 값 × 10, 60초 안에 안 가져가면 사라짐 (일꾼은 못 나름)
  direct: { mul: 2 },                            // 주인공이 직접 판매대에 내려놓은 물건 값 배수               // 황금 물건: 생산될 확률, 값 배수
  thief: { after: 12, chance: 0.3, speed: 115, take: 0.5, cooldown: 25 }, // 도둑: 돈더미를 몇 초 방치하면 나타날 수 있음, 초당 등장 확률, 속도, 훔치는 비율, 다음 등장까지 쉬는 시간
  warpCost: 1500,                                // 엘리베이터(층 버튼으로 이동) 비용
  events: { first: 60, every: 50 },              // 층 이벤트(고장·VIP): 처음 몇 초 뒤부터, 평균 몇 초마다
  broken: { fixTime: 2, ruin: 120, warn: 30, rebuild: 100 }, // 수리: 앞에 몇 초 서 있기 / 고장 난 채로 몇 초 지나면 부서짐(몇 초 전부터 경고) / 다시 제작 비용(× 8^층)
  vip: { time: 40, want: [3, 6], mul: 5, goldMul: 5, slow: 10, slowSpd: 0.6 }, // VIP: 제한 시간(초), 원하는 개수, 보상 배수(물건 값 × 5), 황금을 건네면 그 물건만 또 × 5,
                                                 //      놓치면 10초 동안 일꾼 속도의 60%로 (업그레이드와 상관없이 일꾼보다 느림)
  autoCost: 1500,                                // 층 자동 수금 칸 비용 (× 8^층)
  away: { hours: [1, 2, 4, 8], cost: 300, mul: 4, rate: 0.5, min: 60 }, // 잔업: 단계별 최대 시간, 비용(× 4^단계 × 8^층), 자동으로 벌던 속도의 몇 %, 몇 초 이상 비워야 계산
  cashMax: 40,                                   // 돈더미 최대 장수(손님 결제 1번 = 1장, 금액과 무관). 꽉 차면 챙길 때까지 판매가 멈춤
  drawStackMax: 40                               // 등에 그려지는 최대 개수 (넘으면 숫자로 표시)
};

// ================= 그림 슬롯 =================
// 경로를 넣으면 도형 대신 그림으로 그림. 비워두거나 로딩 실패하면 도형 그대로.
// 투명 PNG, 위에서 비스듬히 본 시점, 바닥 중앙이 기준점. item0~item5는 층별 물건(6종 반복).
const ART_SRC = { player:'', worker:'', customer:'', thief:'', bill:'', machine:'', desk:'',
  item0:'', item1:'', item2:'', item3:'', item4:'', item5:'' };
const ART = {};
// 기본 생산기 = 3D 프린터 몸체(코드로 그린 SVG). 노즐 머리·빛·만들어지는 물건은 drawPrinter()가 움직이며 그림.
// ART_SRC.machine에 그림을 넣으면 그걸 우선 사용(예전 방식)
const PRN = new Image();
PRN.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="480" height="400"><defs> <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9dfe7"/><stop offset="1" stop-color="#93c4d0"/></linearGradient> <linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef9fb"/><stop offset="1" stop-color="#cfe9ef"/></linearGradient> <linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c8ecf5"/></linearGradient> <pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="12" fill="#f2c230"/><rect x="6" width="6" height="12" fill="#38445a"/></pattern></defs> <ellipse cx="120" cy="190" rx="110" ry="8" fill="#2c2b35" opacity=".2"/> <g stroke="#38445a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"> <path d="M14 136 Q14 128 22 128 L218 128 Q226 128 226 136 L230 150 L10 150 Z" fill="url(#t)"/> <rect x="10" y="148" width="220" height="34" rx="8" fill="url(#b)"/><rect x="10" y="168" width="220" height="14" rx="6" fill="#f2a58c"/> <rect x="150" y="153" width="64" height="11" rx="3" fill="url(#h)" stroke-width="2.5"/> <rect x="20" y="58" width="44" height="92" rx="8" fill="url(#b)"/><path d="M24 50 Q24 44 30 44 L54 44 Q60 44 60 50 L64 60 L20 60 Z" fill="url(#t)"/> <rect x="27" y="70" width="30" height="24" rx="4" fill="#2f3b4f" stroke-width="3"/><path d="M31 87 L37 80 L43 84 L51 75" fill="none" stroke="#7ff0a8" stroke-width="2.5"/> <circle cx="33" cy="106" r="4" fill="#7ff0a8" stroke-width="2"/><circle cx="45" cy="106" r="4" fill="#f2c230" stroke-width="2"/> <rect x="27" y="116" width="30" height="8" rx="3" fill="#f2a58c" stroke-width="2.5"/><rect x="198" y="52" width="18" height="80" rx="5" fill="url(#b)"/> <rect x="54" y="34" width="168" height="22" rx="7" fill="#f2a58c"/><path d="M62 45 h150" stroke="#d98a70" stroke-width="2"/> <path d="M100 124 L168 124 L172 134 L96 134 Z" fill="url(#p)" stroke-width="3"/></g> <path d="M104 129 L166 129" stroke="#8fe3f0" stroke-width="2"/> <g fill="#fff" opacity=".5"><rect x="16" y="151" width="208" height="4" rx="2"/><rect x="24" y="62" width="36" height="4" rx="2"/></g></svg>`);
// 판매대 = 레트로 계산대(짙은 나무 + 황동 금전등록기, 코드로 그린 SVG). 숫자판·손잡이·서랍은 drawDesk()가 움직이며 그림. ART_SRC.desk가 있으면 그걸 우선
const DSK = new Image();
DSK.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" width="480" height="340"><defs><linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9dfe7"/><stop offset="1" stop-color="#93c4d0"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef9fb"/><stop offset="1" stop-color="#cfe9ef"/></linearGradient><linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9b884"/><stop offset="1" stop-color="#c98f5a"/></linearGradient><linearGradient id="woodt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe6c6"/><stop offset="1" stop-color="#efcc98"/></linearGradient><linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d9a52e"/></linearGradient><linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9f0dc"/><stop offset="1" stop-color="#9fd9bd"/></linearGradient><linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4a66"/><stop offset="1" stop-color="#2a3448"/></linearGradient></defs><ellipse cx="120" cy="162" rx="104" ry="7" fill="#2c2b35" opacity=".2"/><g stroke="#38445a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"><path d="M34 84 Q34 78 40 78 L200 78 Q206 78 206 84 L212 116 L28 116 Z" fill="url(#woodt)"/><rect x="28" y="114" width="184" height="46" rx="7" fill="#8c4f3a"/><rect x="38" y="122" width="76" height="30" rx="4" fill="#a8604a" stroke-width="2.5"/><rect x="126" y="122" width="76" height="30" rx="4" fill="#a8604a" stroke-width="2.5"/><path d="M146 112 L210 112 L206 96 L150 96 Z" fill="url(#brass)"/><rect x="152" y="66" width="52" height="32" rx="6" fill="url(#brass)"/></g><g fill="#38445a"><circle cx="160" cy="76" r="2.2"/><circle cx="168" cy="76" r="2.2"/><circle cx="176" cy="76" r="2.2"/><circle cx="184" cy="76" r="2.2"/><circle cx="192" cy="76" r="2.2"/><circle cx="160" cy="84" r="2.2"/><circle cx="168" cy="84" r="2.2"/><circle cx="176" cy="84" r="2.2"/><circle cx="184" cy="84" r="2.2"/><circle cx="192" cy="84" r="2.2"/></g><path d="M162 104 H194" stroke="#a87b1a" stroke-width="2.5" stroke-linecap="round"/><g fill="#fff" opacity=".6"><rect x="40" y="81" width="100" height="3" rx="1.5"/><rect x="156" y="70" width="4" height="22" rx="2"/></g><g fill="#fff" opacity=".15"><rect x="42" y="125" width="68" height="4" rx="2"/><rect x="130" y="125" width="68" height="4" rx="2"/></g></svg>
`);
Object.entries(ART_SRC).forEach(([k, src]) => { if (!src) return; const im = new Image(); im.onload = () => { ART[k] = im; }; im.src = src; });

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const slowChip = $('slowChip'), slowSec = $('slowSec');
const moneyEl = $('money'), hintEl = $('hint'), toastEl = $('toast'), zonesEl = $('zones');
const FONT = "Jua, system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
const C = { ground:'#d9ccb2', tile:'#cfc1a5', ink:'#2c2b35', hud:'#fffaf0', warn:'#c2462f', gold:'#e8b923', ok:'#4c9a66', mid:'#d9a21b',
  billTop:'#7cc794', billFront:'#4c9a66', pad:'#4f6390', padFill:'rgba(79,99,144,.22)', sell:'#3f7fc4', sellFill:'rgba(63,127,196,.20)',
  cashFill:'rgba(76,154,102,.18)', machTop:'#8a96ad', machFront:'#5f6b84', deskTop:'#b98a5e', deskFront:'#8f6440',
  player:'#2f5bd3', playerDark:'#2245a3', worker:'#6b6f7a', workerDark:'#4c4f58', vest:'#f08a24', reflect:'#f6f0c8', helmet:'#f2c230', helmetDark:'#c99a12', skin:'#f3d2b3', angry:'#ec8a74', lock:'rgba(44,43,53,.28)', wall:'#b3a588', stair:'#c4b596', stairLine:'#8a7d64' };
const KINDS = [
  { name:'상자', shape:'box',    top:'#f2a35e', front:'#d9772e' },
  { name:'통',   shape:'barrel', top:'#8fc0e8', front:'#4f8fc4' },

function fmt(n){

function tone(freq, dur, type='sine', vol=0.1, when=0, slide=0){
  const c = SND.ctx; if (!c || !SND.on) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq*slide, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.008); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(SND.master); o.start(t); o.stop(t+dur+0.02);
}

  i = Math.min(i, CFG.drawStackMax); const sway = 0.0009*i*i;
  return [e.x - e.fx*11 - e.svx*sway, e.y - e.fy*7 - e.svy*sway*0.6, 30 + i*9*(1 - 0.2*(e.bump || 0))];
}
function spItemPos(z, k, i){
  const p = SP[k]; const col = i%3, row = Math.floor(i/3)%2, layer = Math.floor(i/6);
  return [p.x-18+col*18, gy(z, p.y-4+row*15), layer*9];
}
function deskPos(z, i){ i = Math.min(i, 15); return [DESK.x-44+(i%4)*16, gy(z, DESK.y+6), 26 + Math.floor(i/4)*9]; }
function cashPos(z, i){ i = Math.min(i, 17); const col = i%3, row = Math.floor(i/3)%2, layer = Math.floor(i/6); return [CASH.x-20+col*20, gy(z, CASH.y-6+row*16), 3 + layer*4]; }   // 3 = 매트 높이

function fly(from, toFn, kind, dur, done){ anims.push({ from, toFn, kind, t:0, dur, done }); }
function floatText(x, y, text, color){ floats.push({ x, y, text, color, t:0 }); }
// 연달아 줍는 돈은 글자 하나로 합쳐서 금액만 올림 (0.05초마다 새 글자가 겹쳐 뜨지 않게)
function floatSum(x, y, key, amt, color){
  const f = floats.find(f => f.key === key && f.t < 0.35);
  if (f) { f.amt += amt; f.text = `+${fmt(f.amt)}`; f.x = x; f.y = y; f.t = Math.min(f.t, 0.12); return; }
  floats.push({ x, y, key, amt, text:`+${fmt(amt)}`, color, t:0 });
}

// ---- 효과 (보는 맛): 파티클, 지갑으로 날아가는 동전, 화면 흔들림, 큰 글자 배너 ----
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;   // 움직임 줄이기 설정이면 흔들림 끄고 파티클 줄임
let parts = [], coins = [], banner = null, bannerQ = [], shakeA = 0;
const SHK = { x:0, y:0 };
const CONF = ['#f2a35e', '#3f7fc4', '#4c9a66', '#e8b923', '#c46a9a', '#7a7fd1'];
// 월드 좌표 파티클. kind: spark(반짝 별) conf(색종이) dust(먼지) ring(바닥 원)
function burst(x, y, z, n, kind, o = {}){
  if (RM) n = Math.ceil(n/3);
  for (let i = 0; i < n && parts.length < 320; i++) {
    const a = Math.random()*Math.PI*2, sp = (o.speed || 90)*(0.4 + Math.random()*0.8);
    parts.push({ x, y, z, kind, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*0.5, vz:(o.up ?? 120)*(0.6 + Math.random()*0.7),
      g:o.g ?? 320, t:0, life:(o.life || 0.8)*(0.7 + Math.random()*0.6), size:o.size || 4,
      color:o.color || CONF[Math.floor(Math.random()*CONF.length)], rot:Math.random()*6, vr:(Math.random() - 0.5)*14 });
  }
}
function ring(x, y, color){ parts.push({ x, y, z:0, kind:'ring', vx:0, vy:0, vz:0, g:0, t:0, life:0.5, size:70, color }); }
function shake(a){ if (!RM) shakeA = Math.max(shakeA, a); }
function showBanner(text, color){ const b = { text, color:color || C.gold, t:0 }; if (banner) bannerQ.push(b); else banner = b; }
// 지갑(왼쪽 위 돈 칩)으로 날아가는 동전. 화면 좌표 기준
const moneyChip = () => moneyEl.parentElement;
function coinsToWallet(sx, sy, n){
  const r = moneyChip().querySelector('.coin').getBoundingClientRect(), tx = r.left + r.width/2, ty = r.top + r.height/2;
  for (let i = 0; i < Math.min(n, RM ? 3 : 14); i++)
    coins.push({ sx:sx + (Math.random() - 0.5)*30, sy:sy + (Math.random() - 0.5)*20, tx, ty, t:-i*0.04, dur:0.45 + Math.random()*0.15,
      bend:(Math.random() - 0.5)*160 });
}
const coinsFrom = (x, y, z, n) => { const [sx, sy] = toS(x, y, z); coinsToWallet(sx, sy, n); };
function bumpMoney(){
  if (RM || !every('bump', 0.09)) return;
  const el = moneyChip(); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}
function updFx(dt){
  parts = parts.filter(q => {
    q.t += dt; if (q.t >= q.life) return false;
    q.x += q.vx*dt; q.y += q.vy*dt; q.z += q.vz*dt; q.vz -= q.g*dt; q.rot += q.vr*dt;
    if (q.z < 0 && q.g > 0) { q.z = 0; q.vz *= -0.35; q.vx *= 0.6; q.vy *= 0.6; }
    return true;
  });
  coins = coins.filter(c => { c.t += dt/c.dur; if (c.t >= 1) { bumpMoney(); if (every('coinTick', 0.05)) tone(1900 + Math.random()*300, 0.04, 'sine', 0.035); return false; } return true; });
  if (banner && (banner.t += dt) > (bannerQ.length ? 1.1 : 1.7)) banner = bannerQ.shift() || null;   // 다음 배너가 기다리면 조금 빨리 넘김
  shakeA = shakeA < 0.3 ? 0 : shakeA*Math.exp(-dt*9);
  SHK.x = (Math.random() - 0.5)*2*shakeA; SHK.y = (Math.random() - 0.5)*2*shakeA;
}
function drawParts(){
  parts.forEach(q => {
    const k = q.t/q.life, [sx, sy] = toS(q.x, q.y, q.z);
    if (q.kind === 'ring') {
      ctx.strokeStyle = q.color; ctx.globalAlpha = 1 - k; ctx.lineWidth = 4*scale*(1 - k) + 1;
      ctx.beginPath(); ctx.ellipse(sx, sy, q.size*(0.5 + k)*scale, q.size*(0.5 + k)*0.55*scale, 0, 0, Math.PI*2); ctx.stroke();
    } else if (q.kind === 'dust') {
      ctx.globalAlpha = 0.35*(1 - k); ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.arc(sx, sy, q.size*(0.6 + k)*scale, 0, Math.PI*2); ctx.fill();
    } else if (q.kind === 'conf') {
      ctx.globalAlpha = k > 0.75 ? (1 - k)*4 : 1; ctx.fillStyle = q.color;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(q.rot); ctx.fillRect(-q.size*scale, -q.size*0.5*scale, q.size*2*scale, q.size*scale); ctx.restore();
    } else {                                          // spark: 네 갈래 반짝이, 점점 작아짐
      const r = q.size*(1 - k)*scale*1.6; ctx.globalAlpha = 1; ctx.fillStyle = q.color; ctx.beginPath();
      ctx.moveTo(sx, sy - r*2); ctx.lineTo(sx + r*0.5, sy - r*0.5); ctx.lineTo(sx + r*2, sy); ctx.lineTo(sx + r*0.5, sy + r*0.5);
      ctx.lineTo(sx, sy + r*2); ctx.lineTo(sx - r*0.5, sy + r*0.5); ctx.lineTo(sx - r*2, sy); ctx.lineTo(sx - r*0.5, sy - r*0.5); ctx.closePath(); ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
}
function drawScreenFx(){
  coins.forEach(c => {                               // 지갑으로 날아가는 동전 (곡선)
    if (c.t < 0) return;
    const t = c.t, e = t*t*(3 - 2*t), x = c.sx + (c.tx - c.sx)*e + Math.sin(Math.PI*t)*c.bend, y = c.sy + (c.ty - c.sy)*e - Math.sin(Math.PI*t)*60;
    const r = 9 - t*3;
    ctx.fillStyle = '#2f7a4b'; ctx.beginPath(); ctx.arc(x, y + 1.5, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5fb37c'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = C.hud; ctx.font = `${Math.round(r*1.1)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('₩', x, y + 0.5);
  });
  if (banner) {                                      // 가운데 큰 글자: 튀어나왔다가 사라짐
    const t = banner.t, s = t < 0.25 ? 0.5 + 0.7*Math.sin(t/0.25*Math.PI/2) - (t > 0.18 ? (t - 0.18)*2.5 : 0) : 1;
    const end = bannerQ.length ? 1.1 : 1.7; ctx.globalAlpha = t > end - 0.4 ? Math.max(0, (end - t)/0.4) : 1;
    ctx.save(); ctx.translate(VW/2, VH*0.36); ctx.scale(s, s);
    ctx.font = `${Math.round(Math.min(40, VW/10))}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 8; ctx.strokeStyle = C.ink; ctx.strokeText(banner.text, 0, 0);
    ctx.fillStyle = banner.color; ctx.fillText(banner.text, 0, 0);
    ctx.restore(); ctx.globalAlpha = 1;
  }
}

// ---- 이동 ----
function steer(e, vx, vy, dt, free){
  e.x += vx*dt; e.y += vy*dt;
  if (!free) {
    e.x = Math.max(20, Math.min(W-20, e.x));
    const f = e.z ?? curZone;                       // 일꾼은 자기 층, 주인공은 지금 층
    e.y = Math.max(gy(f, 40), Math.min(gy(f, ZH-20), e.y));
  }
  const sp = Math.hypot(vx, vy);
  if (sp > 5) { e.fx = vx/sp; e.fy = vy/sp; }
  const k = Math.min(1, dt*8); e.svx += (vx-e.svx)*k; e.svy += (vy-e.svy)*k;
}
function moveTo(e, tx, ty, spd, dt, free){
  const dx = tx-e.x, dy = ty-e.y, d = Math.hypot(dx, dy);
  if (d < 4) { steer(e, 0, 0, dt, free); return true; }
  const s = Math.min(spd, d/dt); steer(e, dx/d*s, dy/d*s, dt, free); return false;
}
// ---- 충돌: 프린터 몸체는 못 지나감 (그림보다 약간 작게). 막히면 멈추지 않고 벽 따라 미끄러짐 ----
const MACH = { hw:62, top:70, bot:28 };            // 프린터 x ±62, y는 생산기 칸 y-70 ~ y-28 (바닥 기준선 근처)
const BODY_R = 10;                                 // 사람 몸 반지름
const DESK_BOX = { hw:54, top:8, bot:12 };
function collide(e, z){
  const Z = S.zones[z]; if (!Z) return;
  Z.sp.forEach((s, k) => {
    if (!s.on || s.ruined) return;
    const y0 = gy(z, SP[k].y) - MACH.top - BODY_R, y1 = gy(z, SP[k].y) - MACH.bot + BODY_R;
    const x0 = SP[k].x - MACH.hw - BODY_R, x1 = SP[k].x + MACH.hw + BODY_R;
    pushOut(e, x0, x1, y0, y1);
  });
  const dy = gy(z, DESK.y);                                   // 판매대(그림보다 약간 작게): 바닥 DESK.y-8 ~ DESK.y+12
  pushOut(e, DESK.x - DESK_BOX.hw - BODY_R, DESK.x + DESK_BOX.hw + BODY_R, dy - DESK_BOX.top - BODY_R, dy + DESK_BOX.bot + BODY_R);
}
function pushOut(e, x0, x1, y0, y1){
  if (e.x <= x0 || e.x >= x1 || e.y <= y0 || e.y >= y1) return;
  const dl = e.x - x0, dr = x1 - e.x, du = e.y - y0, dd = y1 - e.y, m = Math.min(dl, dr, du, dd);   // 가장 적게 파고든 쪽으로 밀어냄
  if (m === dl) e.x = x0; else if (m === dr) e.x = x1; else if (m === du) e.y = y0; else e.y = y1;
}
// 일꾼 길찾기: 프린터 줄 위아래를 오갈 땐 프린터 사이 통로로 돌아감 (판매대에 가까운 쪽 통로)
const CORRIDOR = [275, 275, 485];
function detour(e, z, k, tx, ty){
  const yb = gy(z, SP[0].y), top = yb - MACH.top - BODY_R - 6, bot = yb - MACH.bot + BODY_R + 6, cx = CORRIDOR[k];
  const below = e.y > bot, above = e.y < top, tBelow = ty > bot;
  if (tBelow ? below : above) return [tx, ty];
  if (Math.abs(e.x - cx) > 4 && (below || above)) return [cx, e.y];   // 먼저 통로 앞으로 옆걸음
  return [cx, tBelow ? bot + 8 : top - 8];                            // 통로를 따라 줄을 건넘
}
const normalCount = s => s.items - (s.golden || 0);   // 일꾼이 나를 수 있는 일반 물건 수
function bestSpawner(Z){
  let best = 0, n = -1;
  Z.sp.forEach((s, k) => { if (s.on && !s.ruined && normalCount(s) > n) { n = normalCount(s); best = k; } });
  return best;
}

// ---- 황금 물건 ----
// 생산기에서 하나 꺼냄. 황금은 맨 위에 쌓여 있어서 먼저 집힘
function takeItem(s, z){ s.items--; if ((s.golden || 0) > 0) { s.golden--; if (s.goldLife) s.goldLife.pop(); return GOLD + z; } return z; }
// 황금 수명: 생산기 위 황금마다 남은 시간을 가짐(먼저 나온 것부터 순서대로). 다 되면 사라짐
function goldTick(s, z, k, cz, dt){
  if (!s.golden) return;
  const L = s.goldLife || (s.goldLife = []);
  while (L.length < s.golden) L.unshift(CFG.gold.life);      // 예전 저장 데이터 보정
  for (let i = 0; i < L.length; i++) L[i] -= dt;
  while (L.length && L[0] <= 0) {
    L.shift(); s.golden--; s.items--;
    if (z === cz) floatText(SP[k].x, gy(z, SP[k].y), '황금 사라짐', C.warn);
  }
}

// ---- 미션 (하나씩 순서대로, 끝없이 이어짐) ----
const MISSION_TYPES = ['sell', 'collect', 'tip', 'upgrade', 'golden'];
function makeMission(n){
  const type = MISSION_TYPES[n % MISSION_TYPES.length], tier = Math.floor(n / MISSION_TYPES.length);
  const v = valueOf(S.zones.length - 1);
  const target = { sell:15 + 10*tier, collect:Math.round(v*40*(1 + tier*0.5)), tip:3 + 2*tier, upgrade:2 + tier, golden:1 + Math.floor(tier/2) }[type];
  return { n, type, target, base:S.stats[type] || 0, reward:Math.round(v*25*(1 + tier*0.5)) };
}
const missionLabel = m => ({ sell:`물건 ${m.target}개 팔기`, collect:`돈 ₩${fmt(m.target)} 챙기기`, tip:`팁 ${m.target}번 받기`,
  upgrade:`업그레이드 ${m.target}번 하기`, golden:`황금 물건 ${m.target}개 팔기` })[m.type];
function checkMission(){
  if (!S.mission) S.mission = makeMission(0);
  const m = S.mission;
  if ((S.stats[m.type] || 0) - m.base >= m.target) {
    S.money += m.reward;                             // 미션 보상은 지갑 한도와 상관없이 들어옴
    sfx.mission(); toast(`미션 완료! 보상 +₩${fmt(m.reward)}`); showBanner('미션 완료!', '#9be3b0');
    { const r = $('mission').getBoundingClientRect(); if (r.width) coinsToWallet(r.left + r.width/2, r.top + 10, 12); }
    S.mission = makeMission(m.n + 1); save();
  }
}

// ---- 손님 ----
function updCustomers(Z, z, cz, dt){
  const R = rt(z);
  const onCnt = Z.sp.filter(s => s.on).length;
  R.spawnT -= dt;
  if (R.spawnT <= 0 && R.custs.filter(c => c.state !== 'leave').length < CFG.cust.maxLine) {
    R.spawnT = CFG.cust.every/onCnt * (0.7 + Math.random()*0.6);
    const [lo, hi] = CFG.cust.want;
    R.custs.push({ x:-30, y:gy(z, LINE.y), want:lo + Math.floor(Math.random()*(hi-lo+1)), got:0, paySum:0,
      pat:CFG.cust.patience, state:'walk', at:false, fx:1, fy:0, svx:0, svy:0, col:CUST_COLS[Math.floor(Math.random()*CUST_COLS.length)] });
  }
  let slot = 0;
  R.custs.forEach(c => {
    if (c.state === 'leave') { moveTo(c, -50, gy(z, 70), CFG.cust.speed*1.4, dt, true); return; }
    c.slot = slot++;
    c.at = moveTo(c, LINE.x - c.slot*LINE.gap, gy(z, LINE.y), CFG.cust.speed, dt, true);
    if (c.at) { c.state = 'wait'; c.fx = 0.3; c.fy = 1; }
    if (c.state === 'wait') {
      c.pat -= dt;
      if (c.pat <= 0) {
        c.state = 'leave'; c.angry = true;
        if (z === cz) {
          floatText(c.x, c.y, '화났어요!', C.warn); sfx.angry();
          if (!S.tut.angry) { S.tut.angry = true; toast('손님이 화나서 그냥 가버렸어요. 늦지 않게 채워주세요', true); }
        } else if (every('angryOff', 10)) toast(`${z+1}층 손님이 화나서 떠났어요`, true);
      }
    }
  });
  R.custs = R.custs.filter(c => !(c.state === 'leave' && c.x < -40));

  // 맨 앞 손님에게 하나씩 건네기
  const front = R.custs.find(c => c.state === 'wait' && c.slot === 0 && c.at);
  const cashFull = pileFull(Z, z);
  if (cashFull && z === cz && !S.tut.cashFull) { S.tut.cashFull = true; toast('돈더미가 가득 찼어요! 챙겨야 다시 팔려요', true); }
  if (front && Z.queue.length && !cashFull) {
    R.serveT += dt;
    if (R.serveT >= sellIv(Z.sellLv)) {
      R.serveT = 0; const it = Z.queue.shift(); front.got++; front.paySum += itemValue(it);
      S.stats.sell++; if (it % MINE >= GOLD) S.stats.golden++;
      if (z === cz) { fly(deskPos(z, 0), () => [front.x, front.y, 30], it, 0.22, () => {}); sfx.hand(); R.pull = performance.now(); }
      if (front.got >= front.want) {
        const tip = front.pat/CFG.cust.patience > 0.6;
        if (tip) S.stats.tip++;
        const pay = tip ? Math.round(front.paySum*(1 + CFG.cust.tip)) : front.paySum;
        Z.cash += pay; Z.bills = bills(Z, z) + 1; S.tut.sold = true; front.state = 'leave'; front.happy = true;
        if (z === cz) {
          fly([front.x, front.y, 30], () => cashPos(z, bills(Z, z)), 'bill', 0.3, () => {});
          floatText(front.x, front.y, tip ? `팁! +${fmt(pay)}` : `+${fmt(pay)}`, tip ? '#b58a12' : C.billFront); sfx.paid(tip); R.ring = performance.now();
          burst(DESK.x + 37, gy(z, DESK.y+14), 66, 5, 'spark', { color:'#ffd23f', speed:60, up:50, g:0, life:0.45 });
          burst(front.x, front.y, 50, tip ? 14 : 6, 'spark', { color:tip ? '#ffd23f' : '#9be3b0', speed:80, up:60, g:0, life:0.55 });
        }
      }
    }
  } else R.serveT = 0;
}

// ---- 도둑 ----
// 지금 있는 층의 돈더미를 오래 방치하면 위쪽에서 나타나 절반을 들고 위로 도망감. 부딪히면 잡아서 돌려받음
function updThief(cz, dt){
  if (thiefCd > 0) thiefCd -= dt;
  if (!thief) {
    const Z = S.zones[cz], R = rt(cz);
    if (thiefCd <= 0 && Z.cash > 0 && (R.cashIdle || 0) > CFG.thief.after && Math.random() < CFG.thief.chance*dt) {
      thief = { z:cz, x:CASH.x + 60, y:gy(cz, -40), state:'come', loot:0, t:0, fx:-1, fy:0, svx:0, svy:0 };
      toast('도둑이 나타났어요! 돈더미를 지키세요', true); sfx.siren();
    }
    return;
  }
  const T = thief, Z = S.zones[T.z];
  if (T.state === 'come') {
    if (Z.cash <= 0) T.state = 'run';
    else if (moveTo(T, CASH.x + 34, gy(T.z, CASH.y), CFG.thief.speed, dt, true)) { T.state = 'grab'; T.t = 0; }
  } else if (T.state === 'grab') {
    if ((T.t += dt) > 0.9) {
      T.loot = Math.min(Z.cash, Math.max(valueOf(T.z), Math.ceil(Z.cash*CFG.thief.take)));
      T.lootBills = bills(Z, T.z); takeCash(Z, T.z, T.loot); T.lootBills -= Z.bills; T.state = 'run';
      if (T.z === cz) { floatText(T.x, T.y, `-₩${fmt(T.loot)}`, C.warn); sfx.stolen(); shake(4); }
    }
  } else if (moveTo(T, CASH.x + 60, gy(T.z, -60), CFG.thief.speed, dt, true)) {
    if (T.loot > 0) toast(`도둑맞았어요 -₩${fmt(T.loot)}`, true);
    thief = null; thiefCd = CFG.thief.cooldown; return;
  }
  // 잡기

  const Z = S.zones[cz];

  const cap = capOf(S.capLv);
  Z.sp.forEach((s, k) => {
    if (!s.on || !inRect(P.x, P.y, { x:SP[k].x, y:gy(cz, SP[k].y), ...SP_ZONE })) return;

    fly(stackPos(P, S.stack.length), () => deskPos(cz, q), it, 0.2, () => { Z.queue.push(it + MINE); });
    sfx.drop();
    if (!S.tut.direct) { S.tut.direct = true; toast('직접 내려놓은 물건은 2배 값에 팔려요! (파란 테두리)'); toastT = 3.5; }
  }
  // 돈 줍기
  P.cashT += dt;
  if (inRect(P.x, P.y, zr(cz, CASH)) && Z.cash > 0 && P.cashT > 0.05 && room() <= 0) {
    P.cashT = 0;
    if (every('walletFull', 1.2)) { floatText(P.x, P.y, '지갑 MAX', C.warn); sfx.max(); }
    if (!S.tut.wallet) { S.tut.wallet = true; toast('지갑이 가득 찼어요! 돈을 쓰거나 지갑을 키워요', true); }
  }
  if (inRect(P.x, P.y, zr(cz, CASH)) && Z.cash > 0 && P.cashT > 0.05 && room() > 0) {
    P.cashT = 0; rt(cz).cashIdle = 0; const v = valueOf(cz); const chunk = Math.min(Z.cash, Math.max(v, Math.ceil(Z.cash/6)), room());
    takeCash(Z, cz, chunk); S.money += chunk; S.tut.collected = true; S.stats.collect += chunk;
    fly(cashPos(cz, bills(Z, cz)), () => [P.x, P.y, 40], 'bill', 0.25, () => {});
    floatSum(P.x, P.y, 'cash', chunk, C.billFront); sfx.cash(); coinsFrom(P.x, P.y, 40, 1);
  }
  // 잔업 챙기기
  if (Z.safe > 0 && inRect(P.x, P.y, zr(cz, SAFE)) && P.cashT > 0.05) {
    P.cashT = 0;
    if (room() <= 0) { if (every('walletFull', 1.2)) { floatText(P.x, P.y, '지갑 MAX', C.warn); sfx.max(); } }
    else {
      const chunk = Math.min(Z.safe, Math.max(valueOf(cz), Math.ceil(Z.safe/6)), room());
      Z.safe -= chunk; S.money += chunk; S.stats.collect += chunk;

}

function updWorker(w, dt){
  const Z = S.zones[w.z]; if (!Z) return;
  w.t += dt; if (w.bump) w.bump = Math.max(0, w.bump - dt*6);

    const p = SP[w.tgt], [gx, gyy] = [p.x-24+(w.i%3)*24, gy(w.z, p.y+30)], [wx, wy] = detour(w, w.z, w.tgt, gx, gyy);

        w.wait = 0;

        }
      } else {

    if (moveTo(w, wx, wy, CFG.workerSpeed, dt) && wx === sx && wy === sy) {

}

      floorRect(zr(z, SAFE), full ? 'rgba(232,185,35,.22)' : 'rgba(44,43,53,.08)', full ? '#b58a12' : C.lock, true, 0);   // 돈더미(초록)와 구별되게 금색
      const max = awayRate(Z, z)*awayHours(Z)*3600;
      drawChest(SAFE.x, sy - 8, full, full ? Math.min(1, max > 0 ? Z.safe/max : 1) : 0);
      const why = awayWhy(Z);   // 못 버는 상태면 빈 상자 밑에 이유를 빨갛게
      text(Z.safe > 0 ? `잔업수당 ₩${fmt(Z.safe)}` : why ? `잔업 멈춤 · ${why}` : `잔업수당 · 최대 ${awayHours(Z)}시간`, SAFE.x, sy + 26, 0, Z.safe > 0 ? 14 : 12, Z.safe > 0 ? '#8a6a0e' : why ? C.warn : C.ink, 'center', SAFE.w - 8);
    }});
    list.push({ y:gy(z, CASH.y), draw:() => {
      const n = Math.min(bills(Z, z), 18);
      for (let i = 0; i < n; i++) { const [x, y, zz] = cashPos(z, i); bill(x, y, zz); }
      if (pileFull(Z, z)) { const pulse = 1 + Math.sin(performance.now()/120)*0.08; text('MAX', CASH.x, gy(z, CASH.y-38), 22, 17*pulse, C.warn); }
      else if (Z.cash > 0) text(`₩${fmt(Z.cash)}`, CASH.x, gy(z, CASH.y-38), 20, 15, C.billFront);
      if (Z.auto) text('자동 수금', CASH.x, gy(z, CASH.y+58), 0, 13, C.billFront);
    }});
    if (Z.auto) { const b = cashRobot(z); list.push({ y:b.y, draw:() => drawRobot(b) }); }
    Z.sp.forEach((s, k) => {
      if (!s.on || s.ruined) return;                   // 부서진 생산기는 안 그림(그 자리에 '다시 제작' 칸)
      const p = SP[k], py = gy(z, p.y);
      list.push({ y:py-40, draw:() => {
        if (!ART.machine && PRN.complete && PRN.naturalWidth) return drawPrinter(s, z, k, p, py);
        const [mx, my] = toS(p.x, py-34);
        if (!art('machine', mx, my, 84*scale, 90*scale)) cube(p.x, py-34, 0, 80, 46, C.machTop, C.machFront);
        const [bx, by] = toS(p.x-28, py-58, 0);
        ctx.fillStyle = 'rgba(255,250,240,.5)'; ctx.fillRect(bx, by, 56*scale, 6*scale);
        if (s.broken) {                                // 고장: 연기 + 수리 막대
          for (let i = 0; i < 3; i++) { const t = (performance.now()/900 + i/3) % 1, [cx, cy] = toS(p.x - 10 + i*10, py-34, 50 + t*40);
            ctx.fillStyle = `rgba(90,90,100,${0.5*(1-t)})`; ctx.beginPath(); ctx.arc(cx, cy, (6 + t*8)*scale, 0, Math.PI*2); ctx.fill(); }
          ctx.fillStyle = C.ok; ctx.fillRect(bx, by, 56*scale*Math.min(1, (s.fix || 0)/CFG.broken.fixTime), 6*scale);
          const on = Math.floor(performance.now()/300) % 2, left = CFG.broken.ruin - (s.brokenT || 0);
          const msg = s.fix > 0 ? '수리 중…' : left <= CFG.broken.warn ? `${Math.ceil(left)}초 뒤 부서짐!` : '고장! 앞에 서서 수리';
          text(msg, p.x, py-76, 0, 13, on || s.fix > 0 ? C.hud : '#ffb3a6');
        } else {
          const prog = s.items >= CFG.spawnMax ? 1 : s.t/CFG.spawnEvery;
          ctx.fillStyle = s.items >= CFG.spawnMax ? C.warn : C.hud; ctx.fillRect(bx, by, 56*scale*prog, 6*scale);
          text(s.items >= CFG.spawnMax ? '가득 참' : '생산 중', p.x, py-76, 0, 13, C.hud);
        }
      }});
      list.push({ y:py, draw:() => {
        const g0 = s.items - (s.golden || 0), blinkOff = Math.floor(performance.now()/200) % 2;
        const shown = s.items - ((rt(z).pfly || [])[k] || 0);   // 프린터에서 날아오는 중인 물건은 도착하면 보임
        for (let i = 0; i < shown; i++) {
          const gold = i >= g0, life = gold && s.goldLife ? s.goldLife[i - g0] : 99;
          if (gold && life < 10 && blinkOff) continue;             // 사라지기 10초 전부터 깜빡임
          const [x, y, zz] = spItemPos(z, k, i); item(x, y, zz, gold ? GOLD + z : z);
        }
      } });
    });
    rt(z).custs.forEach(c => list.push({ y:c.y, draw:() => customer(c, z) }));
    const V = rt(z).vip; if (V) list.push({ y:V.y, draw:() => drawVip(V, z) });
  });

  // 업그레이드 칸 (지금 층만)
  PADS.forEach(p => {
    if (!p.vis() || p.z !== f) return;
    const c = p.cost(), paid = S.paid[p.id] || 0;
    const pk = 1 + 0.18*Math.sin((p.pop || 0)*Math.PI);   // 완료 직후 '뿅' 커졌다 돌아옴
    floorRect(pk > 1 ? { x:p.x, y:p.y, w:p.w*pk, h:p.h*pk } : p, p.gate ? 'rgba(232,185,35,.22)' : C.padFill, p.gate ? '#b58a12' : C.pad, true, paid/c);
    const mw = p.w - 12;
    text(p.label, p.x, p.y-18, 0, 15, C.ink, 'center', mw);
    if (p.sub()) text(p.sub(), p.x, p.y+2, 0, 13, p.gate ? '#8a6a0e' : C.pad, 'center', mw);
    text(`₩${fmt(c - paid)}`, p.x, p.y+22, 0, 15, S.money > 0 ? C.billFront : C.ink, 'center', mw);
  });

  muds.forEach(m => {                                // 진흙 발자국 (바닥)
    const [mx, my] = toS(m.x, m.y); ctx.fillStyle = `rgba(110,78,44,${0.45*(1 - m.t/1.4)})`;
    ctx.beginPath(); ctx.ellipse(mx, my, 4.5*scale, 2.6*scale, 0, 0, Math.PI*2); ctx.fill();
  });

  if (S.warp) list.push({ y:gy(f, ELEV.y), draw:() => drawElevator(f) });
  if (thief && thief.z === f) list.push({ y:thief.y, draw:drawThief });
  workers.forEach(w => { if (w.z === f) list.push({ y:w.y, draw:() => carrier(w, w.stack, C.worker, C.workerDark, 'worker', 'worker') }); });
  list.push({ y:P.y, draw:() => {
    if (S.slow > 0) {                                  // 발밑 진흙 웅덩이
      const [px, py] = toS(P.x, P.y); ctx.fillStyle = 'rgba(110,78,44,.45)';
      ctx.beginPath(); ctx.ellipse(px, py + 1*scale, 19*scale, 8*scale, 0, 0, Math.PI*2); ctx.fill();
    }
    carrier(P, S.stack, C.player, C.playerDark, 'player');
    const cap = capOf(S.capLv), n = S.stack.length;
    const [x, y, z] = stackPos(P, n);
    if (n >= cap) text('MAX', x, y, z+14, 14, C.warn);
    if (S.slow > 0) vipCloud(P, Math.max(z + 34, 80));  // VIP 놓친 벌칙: 머리(또는 등짐) 위 화난 VIP 먹구름
    else if (n > CFG.drawStackMax) text(`×${n}`, x, y, z+14, 14, C.ink);
  }});
  list.sort((a, b) => a.y - b.y).forEach(o => o.draw());

  // 날아가는 것들
  anims.forEach(a => {
    const to = a.toFn(), t = a.t, e = 1-(1-t)*(1-t);
    const x = a.from[0] + (to[0]-a.from[0])*e, y = a.from[1] + (to[1]-a.from[1])*e;
    const z = a.from[2] + (to[2]-a.from[2])*e + Math.sin(Math.PI*t)*30;
    a.kind === 'bill' ? bill(x, y, z) : item(x, y, z, a.kind);
  });
  drawParts();
  floats.forEach(f => {                              // 떠오르는 글자: 처음에 크게 튀어나왔다가 떠오르며 사라짐
    const t = f.t, pop = t < 0.12 ? 1.45 - t/0.12*0.45 : 1, [sx, sy] = toS(f.x, f.y, 60 + (1 - Math.pow(1 - t/0.9, 2))*55);
    ctx.globalAlpha = t > 0.55 ? 1 - (t - 0.55)/0.35 : 1;
    ctx.font = `${Math.round(18*pop*scale)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 4*scale; ctx.strokeStyle = 'rgba(255,250,240,.9)'; ctx.strokeText(f.text, sx, sy);
    ctx.fillStyle = f.color; ctx.fillText(f.text, sx, sy); ctx.globalAlpha = 1;
  });

  // 판매대가 화면 위로 벗어났을 때 손님 대기 표시
  const R = rt(curZone), waiting = R.custs.filter(c => c.state !== 'leave').length;
  if (waiting) {
    const [dx, dy] = toS(DESK.x, gy(curZone, LINE.y), 40);
    if (dy < 110) {
      const danger = custAlert(curZone) === 2, blink = danger && Math.floor(performance.now()/300) % 2;
      const label = `▲ 손님 ${waiting}명 대기${danger ? ' · 화나기 직전!' : ''}`;
      ctx.font = `15px ${FONT}`; const tw = ctx.measureText(label).width + 28;
      const x = Math.max(16 + tw/2, Math.min(VW - 16 - tw/2, dx)), y = toastEl.hidden ? 128 : 210;   // 알림이 떠 있으면 그 아래로
      rr(x - tw/2, y - 17, tw, 34, 17); ctx.fillStyle = danger ? (blink ? '#e0604a' : C.warn) : 'rgba(44,43,53,.82)'; ctx.fill();
      ctx.fillStyle = C.hud; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, y);
    }
  }

  if (fade > 0) { ctx.fillStyle = `rgba(44,43,53,${fade})`; ctx.fillRect(0, 0, VW, VH); }
  drawScreenFx();

  // 조이스틱
  if (joy) {
    ctx.strokeStyle = 'rgba(44,43,53,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, Math.PI*2); ctx.stroke();
    const dx = joy.x-joy.ox, dy = joy.y-joy.oy, d = Math.hypot(dx, dy), m = d > 50 ? 50/d : 1;
    ctx.fillStyle = 'rgba(44,43,53,.4)'; ctx.beginPath(); ctx.arc(joy.ox + dx*m, joy.oy + dy*m, 22, 0, Math.PI*2); ctx.fill();
  }
}

let shownSlow = 0, shownMoney = '', lastHint = '', shownMission = '', dispMoney = S.money, lastDt = 0.016;
function hud(){
  const w = walletOf(S.walLv);
  const sl = S.slow > 0 ? Math.ceil(S.slow) : 0;
  if (sl !== shownSlow) { shownSlow = sl; slowChip.hidden = !sl; slowSec.textContent = sl; }
  const diff = S.money - dispMoney;                 // 돈 숫자가 촤르륵 따라 올라감(쓸 때는 빨리 내려감)
  dispMoney = Math.abs(diff) < 1 ? S.money : dispMoney + diff*Math.min(1, lastDt*(diff > 0 ? 9 : 16));
  const txt = `${fmt(dispMoney)} / ${fmt(w)}`;
  if (txt !== shownMoney) { shownMoney = txt; moneyEl.textContent = txt; moneyEl.parentElement.classList.toggle('full', S.money >= w); }
  let h = '';
  const gateOpen = S.zones[S.zones.length-1].sp.every(s => s.on);
  if (!S.tut.sold) h = S.stack.length > 0 ? '파란 판매 칸에 내려놓으면 손님에게 팔려요' : '회색 생산기 앞 칸에 서서 물건을 모아요';
  else if (!S.tut.collected) h = '초록 돈더미를 밟아서 돈을 챙겨요';
  else if (!S.tut.upgraded) h = '점선 칸 위에 서 있으면 돈이 들어가 업그레이드돼요';
  else if (!S.tut.zone && gateOpen) h = '오른쪽 위 노란 칸에서 다음 층을 열 수 있어요';
  if (h !== lastHint) { lastHint = h; hintEl.textContent = h; hintEl.hidden = !h; }
  chipEls.forEach((b, z) => {                       // 다른 층 손님 경고: 1=기다리는 중(노랑), 2=화나기 직전(빨강)
    const a = z === curZone ? 0 : zoneAlert(z);
    if (chipState[z] !== a) { chipState[z] = a; ALERT_CLS.forEach((c, i) => { if (i) b.classList.toggle(c, a === i); }); }
  });
  const m = S.mission;
  if (m) {
    const prog = Math.min(m.target, (S.stats[m.type] || 0) - m.base), key = m.n + ':' + prog;
    if (key !== shownMission) {
      shownMission = key; $('mission').hidden = false;
      const f = m.type === 'collect' ? fmt : String;
      $('mText').textContent = missionLabel(m);
      $('mProg').textContent = `${f(prog)} / ${f(m.target)} · 보상 ₩${fmt(m.reward)}`;
      $('mBar').style.width = (prog/m.target*100) + '%';
    }
  }
}

// ---- 시작 ----
let last = 0, saveT = 0;
function frame(now){
  // 마지막 저장 뒤 오래 지났으면(게임을 껐거나 다른 화면이었음) 잔업 계산. 저장 시각이 없는 예전 저장은 건너뜀
  const away = S.seen ? (Date.now() - S.seen)/1000 : 0;
  if (away >= CFG.away.min) grantAway(away);
  if (away >= CFG.away.min || !S.seen) save();
  const dt = Math.min(0.05, (now - last)/1000 || 0); last = now; lastDt = dt;
  update(dt); render(); hud();
  if ((saveT += dt) > 1.5) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
P.x = S.px; P.y = S.py; cam.x = P.x; cam.y = P.y; curZone = zoneOf(P.y);
rebuildPads(); syncWorkers(); renderZoneChips(); resize();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>

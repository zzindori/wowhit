<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>드라마 vs 실록</title>
<meta name="description" content="사극 속 그 장면, 조선왕조실록에는 뭐라고 적혀 있을까? 사실·각색·허구로 나눠 보는 사극 팩트체크">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 드라마 vs 실록 — 사극 장면을 실록 기록과 비교하는 카드 모음 + 퀴즈.
   데이터는 아래 WORKS 하나. 그림 없음(드라마 사진은 저작권 때문에 안 씀), 글·색·도장만 */
:root{
  --bg:#f4ecdc; --paper:#fbf7ee; --ink:#2b2622; --sub:#6d635a; --line:#ddd0b8;
  --red:#b3352b; --fact:#2f6b4f; --adapt:#b7791f; --fic:#a3362d; --accent:#30455f;
  --serif:'Gowun Batang','Nanum Myeongjo',serif;
  --sans:'Gowun Dodum',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1916; --paper:#25221e; --ink:#ece4d6; --sub:#a89d8f; --line:#3d372f;
    --red:#d9584c; --fact:#5fae86; --adapt:#e0a548; --fic:#e0685c; --accent:#9db4d3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1916; --paper:#25221e; --ink:#ece4d6; --sub:#a89d8f; --line:#3d372f;
  --red:#d9584c; --fact:#5fae86; --adapt:#e0a548; --fic:#e0685c; --accent:#9db4d3; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
header{padding:28px 0 8px;text-align:center}
.seal{display:inline-grid;place-items:center;width:46px;height:46px;border:2px solid var(--red);border-radius:6px;
  color:var(--red);font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.05;transform:rotate(-4deg);margin-bottom:8px}
h1{font-family:var(--serif);font-size:clamp(26px,6vw,36px);margin:0;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--red)}
.lead{color:var(--sub);margin:6px 0 0;font-size:15px}
.tabs{display:flex;gap:6px;justify-content:center;margin:18px 0 14px}
.tab{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:15px;
  padding:8px 18px;border-radius:99px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.works{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.work{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;cursor:pointer;
  border-radius:12px;padding:8px 12px;text-align:left;min-width:132px}
.work b{display:block;font-family:var(--serif);font-size:15px}
.work small{color:var(--sub);font-size:12px}
.work[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.intro{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0 12px}
.intro h2{font-family:var(--serif);margin:0 0 2px;font-size:21px}
.intro .meta{color:var(--sub);font-size:13px}
.intro p{margin:6px 0 0;font-size:14.5px}
.tally{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:transparent;color:var(--sub);font:inherit;font-size:13px;padding:4px 11px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;border:1.5px solid currentColor}
.v-fact{color:var(--fact)} .v-adapt{color:var(--adapt)} .v-fic{color:var(--fic)}
.cards{display:grid;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative}
.card h3{font-family:var(--serif);font-size:17px;margin:0 0 10px;padding-right:76px}
.stamp{position:absolute;top:12px;right:12px;font-family:var(--serif);font-weight:700;font-size:15px;
  border:2px solid currentColor;border-radius:6px;padding:2px 8px;transform:rotate(5deg)}
.row{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:14.5px}
.row + .row{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.lbl{color:var(--sub);font-size:13px;padding-top:1px}
.lbl b{display:block;color:var(--ink);font-size:13.5px}
.src{display:block;color:var(--accent);font-size:12.5px;margin-top:3px}
.spoil{filter:blur(6px);cursor:pointer;user-select:none}
.spoil::after{content:''}
.spoilnote{font-size:12px;color:var(--sub)}
/* 퀴즈 */
.quiz{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 16px;text-align:center}
.qtop{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
.qwork{font-family:var(--serif);color:var(--red);font-size:14px}
.qscene{font-family:var(--serif);font-size:19px;margin:6px 0 16px;line-height:1.5}
.qbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtn{font:inherit;font-size:16px;font-weight:700;padding:12px 4px;border-radius:12px;border:2px solid currentColor;background:transparent;cursor:pointer}
.qbtn:disabled{opacity:.45;cursor:default}
.qbtn.pick{opacity:1;background:color-mix(in srgb, currentColor 14%, transparent)}
.qres{margin-top:14px;text-align:left;font-size:14.5px}
.qres .ok{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:4px}
.next{margin-top:14px;font:inherit;font-size:15px;padding:10px 22px;border-radius:99px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.score{font-family:var(--serif);font-size:15px;margin-top:10px;color:var(--sub)}
.legend{margin:20px 0 0;font-size:13px;color:var(--sub);background:transparent;border-top:1px solid var(--line);padding-top:14px}
.legend p{margin:4px 0}
.legend .badge{margin-right:4px}
a{color:var(--accent)}
.home{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:17px}
.theme{left:auto;right:10px;cursor:pointer;font:inherit}
@media (max-width:420px){ .row{grid-template-columns:1fr} .lbl b{display:inline;margin-right:6px} .qscene{font-size:17px} }
</style>
</head>
<body>
<a class="home" href="/" title="wowHit 홈" aria-label="wowHit 홈">⌂</a>
<button class="home theme" id="bTheme" title="밝게/어둡게" aria-label="밝게/어둡게 바꾸기">◐</button>
<div class="wrap">
  <header>
    <div class="seal">實<br>錄</div>
    <h1>드라마 <em>vs</em> 실록</h1>
    <p class="lead">사극 속 그 장면, 조선왕조실록에는 뭐라고 적혀 있을까?</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tCards" aria-selected="true">작품별 비교</button>
    <button class="tab" role="tab" id="tQuiz" aria-selected="false">진짜일까, 드라마일까?</button>
  </div>

  <section id="pCards">
    <div class="works" id="works"></div>
    <div class="intro" id="intro"></div>
    <div class="filter" id="filter"></div>
    <div class="cards" id="cards"></div>
  </section>

  <section id="pQuiz" hidden>
    <div class="quiz" id="quiz"></div>
  </section>

  <div class="legend">
    <p><span class="badge v-fact">사실</span> 실록(또는 같은 시대 기록)에 그대로 나오는 일</p>
    <p><span class="badge v-adapt">각색</span> 실제 있었던 일·인물에 이야기를 덧붙이거나 바꾼 것</p>
    <p><span class="badge v-fic">허구</span> 기록에 없는, 작가가 지어낸 인물·사건</p>
    <p>실록 날짜는 모두 음력(왕의 재위 연도 기준)입니다. 요약은 직접 쓴 글이며, 원문은
      <a href="https://sillok.history.go.kr" target="_blank" rel="noopener">국사편찬위원회 조선왕조실록</a>에서 카드의 검색어로 찾아볼 수 있어요.
      드라마·영화 사진은 저작권 때문에 싣지 않았습니다.</p>
  </div>
</div>

<script>
// v: 'fact' 사실 · 'adapt' 각색 · 'fic' 허구, src: 출처(왕·연도·음력 날짜), q: 실록 검색어, spoil: 결말 내용이면 가림
const WORKS = [
  { id:'janggeum', title:'대장금', kind:'드라마', year:2003, by:'MBC', era:'중종 (1506~1544)',
    about:'수라간 궁녀 장금이 의녀가 되어 왕의 주치의 자리에 오르는 이야기. 실록에 실제로 이름이 나오는 의녀가 주인공이에요.',
    cards:[
      { t:'장금은 실제 인물일까?', v:'fact',
        d:'수라간 궁녀 출신 장금이 주인공으로 나와요.',
        r:'중종실록에 \'장금\', \'대장금\'이라는 의녀가 1515년(중종 10)부터 1544년(중종 39)까지 여러 번 나옵니다. 이름만은 진짜예요.',
        src:'중종실록 10년(1515) 외', q:'대장금' },
      { t:'수라간에서 요리 경합', v:'fic',
        d:'장금이 수라간 최고 상궁 자리를 걸고 요리 경합을 벌여요.',
        r:'실록 속 장금은 처음부터 끝까지 \'의녀\'로만 나옵니다. 요리를 했다거나 수라간에 있었다는 기록은 없어요. 드라마 전반부는 거의 창작입니다.',
        src:'중종실록', q:'장금' },
      { t:'왕의 병을 돌본 의녀', v:'fact',
        d:'의녀가 된 장금이 중종의 병을 맡아 치료해요.',
        r:'1524년(중종 19) 12월 15일, 중종이 "의녀 대장금의 의술이 무리 중에서 조금 낫다"며 급료를 주게 했고, 1533년(중종 28) 2월 11일 병이 나은 뒤 쌀·콩 등을 상으로 내렸어요. 1544년 중종이 위독할 때도 곁에서 증세를 전한 기록이 있습니다.',

      { t:'최초의 여자 주치의 \'대장금\'', v:'adapt', spoil:true,

        r:'왕을 가까이서 돌본 건 사실이지만, 공식 주치의(어의) 벼슬을 받았다는 기록은 없어요. \'대(大)\'가 붙은 이름도 칭호를 내린 장면 없이 실록에 그냥 등장합니다.',
        src:'중종실록', q:'대장금' },
      { t:'민정호와의 사랑', v:'fic', spoil:true,
        d:'장금은 종사관 민정호와 사랑하고, 궁을 떠나 함께 살아요.',
        r:'민정호는 지어낸 인물입니다. 실록에는 장금의 집안이나 혼인, 말년 이야기가 전혀 없어요.',
        src:'—', q:'장금' },

  { id:'tree', title:'뿌리 깊은 나무', kind:'드라마', year:2011, by:'SBS', era:'세종 (1418~1450)',
    about:'한글 창제를 막으려는 비밀 조직과 집현전 학자 연쇄 살인을 쫓는 이야기. 큰 줄기는 실록, 사건은 추리극 창작이에요.',
    cards:[
      { t:'세종이 직접 한글을 만들었다', v:'fact',
        d:'세종이 밤낮으로 글자를 연구해 스물여덟 자를 완성해요.',

        d:'집현전 부제학 최만리가 한글에 반대하며 세종과 맞서요.',

        src:'—', q:'' },

        d:'집현전 학자들이 잇달아 의문의 죽음을 맞고, 겸사복 강채윤이 범인을 쫓아요.',

  { id:'sleeve', title:'옷소매 붉은 끝동', kind:'드라마', year:2021, by:'MBC', era:'영조 말 ~ 정조 (1776~1800)',
    about:'궁녀 성덕임과 정조(이산)의 이야기. 덕임은 실제로 정조의 후궁 의빈 성씨가 된 인물이에요.',

      { t:'궁녀 성덕임은 실존 인물', v:'fact',
        d:'궁녀 덕임이 세손 이산과 얽히며 궁에서 살아가요.',
        r:'정조의 후궁 의빈 성씨(1753~1786)가 실제 인물입니다. 궁녀 시절 이웃 궁녀들과 함께 소설을 베껴 쓴 필사본(『곽장양문록』)에 그의 글씨가 남아 있어요.',

      { t:'덕임과 이산의 애틋한 감정선', v:'adapt',
        d:'두 사람이 오래 마음을 숨기며 밀고 당겨요.',
        r:'정조가 의빈을 아꼈다는 건 묘지명과 실록의 슬픔 표현으로 알 수 있지만, 둘이 나눈 대화나 마음은 기록에 없어요. 이야기의 대부분은 원작 소설과 드라마가 채운 것입니다.',
        src:'—', q:'' },
    ]},
  { id:'kingsman', title:'왕의 남자', kind:'영화', year:2005, by:'이준익 감독', era:'연산군 (1494~1506)',
    about:'광대 장생과 공길이 왕을 풍자하는 놀이로 연산군의 궁에 들어가는 이야기. 실록 한 줄에서 시작된 영화예요.',
    cards:[
      { t:'광대 공길은 진짜 있었다', v:'fact',
        d:'광대 공길이 왕 앞에서 놀이판을 벌여요.',
        r:'1505년(연산군 11) 12월 29일, 배우 공길이 늙은 선비 놀이를 하며 "임금이 임금답지 않으면…"이라는 『논어』 구절로 왕을 꼬집었다가, 불경하다며 곤장을 맞고 유배됐다는 기록이 있어요. 영화는 이 한 줄에서 출발했습니다.',
        src:'연산군일기 11년 12월 29일', q:'공길' },
      { t:'장생과 공길의 우정', v:'fic',
        d:'공길의 단짝 광대 장생이 모든 사건의 중심에 있어요.',
        r:'장생은 기록에 없는 인물이에요. 실록에 이름이 남은 광대는 공길이고, 둘의 우정은 영화가 만든 이야기입니다.',
        src:'—', q:'' },
      { t:'연산군의 광대놀이 사랑', v:'fact',
        d:'연산군이 궁 안에 광대를 들여 놀이를 즐겨요.',
        r:'연산군일기에는 궁중 놀이(나례)와 광대를 불러 즐긴 기록이 여러 번 나와요. 왕이 이를 위해 사람과 물자를 끌어모은 일도 비판받았습니다.',
        src:'연산군일기', q:'나례' },
      { t:'장녹수', v:'fact', spoil:true,
        d:'왕의 총애를 받는 후궁 녹수가 광대들을 시기해요.',
        r:'장녹수는 연산군의 실제 후궁이에요. 1506년 중종반정으로 연산군이 쫓겨난 뒤 처형됐습니다. 광대를 시기했다는 이야기는 각색이에요.',
        src:'연산군일기 · 중종실록 1년(1506)', q:'장녹수' },
    ]},
  { id:'gwanghae', title:'광해, 왕이 된 남자', kind:'영화', year:2012, by:'추창민 감독', era:'광해군 (1608~1623)',
    about:'독살 위협을 받는 광해군 대신 닮은 광대 하선이 15일 동안 왕 노릇을 하는 이야기. 실록에 빈 기간이 있다는 설정에서 출발했어요.',
    cards:[
      { t:'15일 동안의 가짜 왕', v:'fic',
        d:'광대 하선이 왕과 닮았다는 이유로 대신 용상에 앉아요.',
        r:'대역 왕은 영화의 상상이에요. 광해군일기에는 그런 기록이 전혀 없습니다. 영화는 \'기록되지 않은 15일\'이라는 설정을 붙였을 뿐이에요.',
        src:'—', q:'' },
      { t:'대동법', v:'fact',
        d:'하선이 "백성에게 땅만큼만 세금을 걷자"는 대동법을 밀어붙여요.',
        r:'광해군은 즉위한 1608년 경기도에 선혜청을 두고 대동법(공물을 쌀로, 땅 넓이에 따라 내게 한 법)을 시작했어요. 다만 영화처럼 왕이 한 번에 밀어붙인 게 아니라, 이원익 등의 건의로 경기도부터 시험한 것입니다.',
        src:'광해군일기 즉위년(1608) 5월', q:'선혜청' },
      { t:'명나라 파병과 중립 외교', v:'fact',
        d:'명이 군사를 요구하자 하선은 "백성의 목숨이 더 중하다"고 버텨요.',
        r:'1619년 명의 요구로 강홍립이 군사를 이끌고 출전했다가 후금(청)에 항복했어요. 명과 후금 사이에서 균형을 잡으려 한 외교로 평가되지만, 해석은 지금도 엇갈립니다.',
        src:'광해군일기 11년(1619)', q:'강홍립' },
      { t:'왕에서 쫓겨난 광해군', v:'fact', spoil:true,
        d:'영화 끝에 광해군의 앞날이 암시돼요.',
        r:'1623년 인조반정으로 폐위됐어요. 그래서 그의 기록은 \'실록\'이 아니라 \'광해군일기\'라고 부릅니다.',
        src:'인조실록 1년(1623)', q:'광해군' },
    ]},
  { id:'sado', title:'사도', kind:'영화', year:2015, by:'이준익 감독', era:'영조 (1724~1776)',
    about:'영조가 아들 사도세자를 뒤주에 가둔 8일을 따라가는 이야기. 실록·한중록에 바탕을 두고 부자의 마음을 그렸어요.',
    cards:[
      { t:'뒤주에 갇힌 세자', v:'fact',
        d:'영조가 세자를 뒤주에 가두고, 세자는 8일 만에 숨을 거둬요.',
        r:'1762년(영조 38) 윤5월 13일 영조가 세자를 폐하고 가뒀고, 윤5월 21일 세자가 세상을 떠났어요. 실록은 이 일을 짧게만 적었고, 뒤주 안의 모습은 혜경궁 홍씨의 『한중록』에 자세히 나옵니다.',
        src:'영조실록 38년 윤5월 13일 · 21일, 『한중록』', q:'사도세자' },
      { t:'\'사도\'라는 이름', v:'fact', spoil:true,
        d:'세자가 죽은 뒤 영조가 \'사도\'라는 이름을 내려요.',
        r:'영조는 세자가 세상을 떠나자 세자 호칭을 되돌리고 \'생각하며 슬퍼한다\'는 뜻의 시호 \'사도(思悼)\'를 내렸어요.',
        src:'영조실록 38년 윤5월 21일', q:'사도' },
      { t:'세자의 병과 폭력', v:'adapt',
        d:'세자가 옷을 입지 못하는 병에 시달리고 궁인을 해쳐요.',
        r:'세자의 병과 행동은 주로 『한중록』에 자세히 적혀 있어요. 실록은 이 시기 기록이 적고, 『한중록』은 혜경궁이 나중에 쓴 회고라 어느 쪽 이야기로 볼지 학자마다 해석이 갈립니다.',
        src:'『한중록』', q:'' },
      { t:'"나는 사도세자의 아들이다"', v:'fact', spoil:true,
        d:'훗날 왕위에 오른 세손(정조)이 아버지를 떠올려요.',
        r:'정조는 1776년 즉위 직후 신하들 앞에서 "과인은 사도세자의 아들이다"라고 밝혔어요. 실록에 그대로 남은 유명한 말입니다.',
        src:'정조실록 즉위년(1776) 3월 10일', q:'사도세자의 아들' },
      { t:'혜경궁 회갑 잔치', v:'fact', spoil:true,
        d:'정조가 어머니의 환갑 잔치에서 춤을 바쳐요.',
        r:'1795년(정조 19) 정조는 어머니 혜경궁을 모시고 화성(수원)으로 가서 회갑 잔치를 열었어요. 이 행차는 『원행을묘정리의궤』 그림으로도 남아 있습니다. 춤 장면은 영화의 연출이에요.',
        src:'정조실록 19년(1795) 윤2월', q:'혜경궁' },
    ]},
];

const V = { fact:{n:'사실', c:'v-fact'}, adapt:{n:'각색', c:'v-adapt'}, fic:{n:'허구', c:'v-fic'} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k, d){ try{ const v = localStorage.getItem('sillok-' + k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
                set(k, v){ try{ localStorage.setItem('sillok-' + k, JSON.stringify(v)); }catch{} } };

// ── 작품별 비교
let cur = store.get('work', WORKS[0].id), vf = 'all';
if (!WORKS.some(w => w.id === cur)) cur = WORKS[0].id;

function renderWorks(){
  $('#works').innerHTML = WORKS.map(w => `<button class="work" data-id="${w.id}" aria-pressed="${w.id === cur}">
    <b>${esc(w.title)}</b><small>${w.kind} · ${w.year}</small></button>`).join('');
}
function renderWork(){
  const w = WORKS.find(x => x.id === cur);
  const cnt = { fact:0, adapt:0, fic:0 };
  w.cards.forEach(c => cnt[c.v]++);
  $('#intro').innerHTML = `<h2>${esc(w.title)}</h2>
    <div class="meta">${w.kind} · ${w.year} · ${esc(w.by)} — 배경: ${esc(w.era)}</div>
    <p>${esc(w.about)}</p>
    <div class="tally">${Object.keys(V).map(k => `<span class="badge ${V[k].c}">${V[k].n} ${cnt[k]}</span>`).join('')}</div>`;
  $('#filter').innerHTML = [['all','전체'], ...Object.keys(V).map(k => [k, V[k].n])]
    .map(([k, n]) => `<button class="chip" data-v="${k}" aria-pressed="${vf === k}">${n}</button>`).join('')
    + `<span class="spoilnote" style="align-self:center;margin-left:auto">흐린 칸은 결말 — 누르면 보여요</span>`;
  $('#cards').innerHTML = w.cards.filter(c => vf === 'all' || c.v === vf).map(c => `
    <article class="card">
      <span class="stamp ${V[c.v].c}">${V[c.v].n}</span>
      <h3>${esc(c.t)}</h3>
      <div class="row"><div class="lbl"><b>🎬 ${w.kind}</b></div><div class="${c.spoil ? 'spoil' : ''}">${esc(c.d)}</div></div>
      <div class="row"><div class="lbl"><b>📜 기록</b></div><div class="${c.spoil ? 'spoil' : ''}">${esc(c.r)}
        <span class="src">출처: ${esc(c.src)}${c.q ? ` · 실록 검색어 「${esc(c.q)}」` : ''}</span></div></div>
    </article>`).join('') || '<p class="spoilnote">이 작품엔 해당 카드가 없어요.</p>';
}
$('#works').addEventListener('click', e => {
  const b = e.target.closest('.work'); if (!b) return;
  cur = b.dataset.id; vf = 'all'; store.set('work', cur); renderWorks(); renderWork();
});
$('#filter').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  vf = b.dataset.v; renderWork();
});
$('#cards').addEventListener('click', e => {
  const s = e.target.closest('.spoil'); if (s) s.classList.remove('spoil');
});

// ── 퀴즈: 모든 카드를 섞어 한 장씩, 사실·각색·허구 고르기
const ALL = WORKS.flatMap(w => w.cards.map(c => ({ ...c, w })));
let deck = [], qi = 0, score = { ok:0, n:0 }, best = store.get('best', 0);
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newDeck(){ deck = shuffle(ALL.slice()); qi = 0; score = { ok:0, n:0 }; }
function renderQuiz(){
  if (qi >= deck.length){
    const pct = Math.round(score.ok / score.n * 100);
    if (score.ok > best){ best = score.ok; store.set('best', best); }
    $('#quiz').innerHTML = `<div class="qscene">${score.n}문제 중 <b>${score.ok}</b>개 맞혔어요 (${pct}%)</div>
      <p>${pct >= 80 ? '사관 수준이시네요! 📜' : pct >= 50 ? '사극 꽤 보셨군요 🎬' : '드라마에 깜빡 속으셨네요 😅'}</p>
      <div class="score">최고 기록 ${best}개</div>
      <button class="next" id="again">다시 하기</button>`;
    $('#again').onclick = () => { newDeck(); renderQuiz(); };
    return;
  }
  const c = deck[qi];
  $('#quiz').innerHTML = `<div class="qtop"><span>${qi + 1} / ${deck.length}</span><span>맞힘 ${score.ok}</span></div>
    <div class="qwork">${c.w.kind} 「${esc(c.w.title)}」</div>
    <div class="qscene">${esc(c.d)}</div>
    <div class="qbtns">${Object.keys(V).map(k => `<button class="qbtn ${V[k].c}" data-v="${k}">${V[k].n}</button>`).join('')}</div>
    <div class="qres" id="qres"></div>`;
}
$('#quiz').addEventListener('click', e => {
  const b = e.target.closest('.qbtn'); if (!b || b.disabled) return;
  const c = deck[qi], ok = b.dataset.v === c.v;
  score.n++; if (ok) score.ok++;
  $('#quiz').querySelectorAll('.qbtn').forEach(x => { x.disabled = true; if (x.dataset.v === c.v) x.classList.add('pick'); });
  $('#qres').innerHTML = `<div class="ok ${V[c.v].c}">${ok ? '⭕ 맞았어요!' : '❌ 아쉬워요'} — 정답은 ${V[c.v].n}</div>
    <div>${esc(c.r)}</div><span class="src">출처: ${esc(c.src)}</span>
    <div style="text-align:center"><button class="next" id="next">${qi + 1 < deck.length ? '다음 문제' : '결과 보기'}</button></div>`;
  $('#next').onclick = () => { qi++; renderQuiz(); window.scrollTo({ top: $('#quiz').offsetTop - 80, behavior: 'smooth' }); };
  $('#next').focus({ preventScroll: true });
});

// ── 탭·테마
function tab(q){
  $('#tCards').setAttribute('aria-selected', !q); $('#tQuiz').setAttribute('aria-selected', q);
  $('#pCards').hidden = q; $('#pQuiz').hidden = !q;
  if (q && !deck.length){ newDeck(); renderQuiz(); }
}
$('#tCards').onclick = () => tab(false);
$('#tQuiz').onclick = () => tab(true);
const th = store.get('theme', null);
if (th) document.documentElement.dataset.theme = th;
$('#bTheme').onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('theme', next);
};

renderWorks(); renderWork();
if (location.hash === '#quiz') tab(true);
</script>
</body>
</html>
